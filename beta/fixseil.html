<!-- Hochtour und Klettern laufen jetzt mit Skitour und Wandern auf index.html (Wechsel ohne Neuladen).
     Diese Adresse bleibt für installierte Apps und Lesezeichen und leitet weiter (?view=msl → Klettern). -->
<script>(function(){ var q = location.search.replace(/^\?/, ''); var klet = /(^|&)view=msl(&|$)/.test(q); location.replace('./index.html?d=' + (klet ? 'klet' : 'hoch') + (q ? '&' + q : '') + location.hash); })();</script>
</head>
