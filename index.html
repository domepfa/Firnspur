<!DOCTYPE html>

<meta charset="UTF-8">

<title>Skitour — gemeinsam planen</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./IMG-20260816-WA0023.jpg">
<link rel="apple-touch-icon" href="./IMG-20260816-WA0023.jpg">
<meta name="theme-color" content="#1F4D63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E9F1F4;
    --paper:#FFFFFF;
    --ink:#1B2A33;
    --ink-soft:#5B6B73;
    --ink-faint:#8B9AA1;
    --ice:#2E6E8E;
    --ice-deep:#1F4D63;
    --ice-light:#D9E9EF;
    --signal:#F2B705;
    --signal-deep:#C99400;
    --line:#DFD8C8;
    --danger:#B0392C;
    --ok:#3C7A52;
    --shadow: 0 2px 10px rgba(27,42,51,0.08);
    --shadow-lg: 0 12px 32px rgba(27,42,51,0.16);
    --radius: 3px;

    --d-L:#5FA8D3;
    --d-WS:#2E7EB0;
    --d-ZS:#C9A227;
    --d-S:#D97B3E;
    --d-SS:#C2452D;
    --d-AS:#8A2E2E;
    --d-EX:#2B1416;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--ice-deep);}

  /* ===== App-Umschalter ===== */
  .app-switch-bar{
    background:var(--ink); display:flex; justify-content:center; gap:0;
  }
  .app-switch-bar a, .app-switch-bar button{
    color:rgba(255,255,255,0.55); text-decoration:none; font-size:13.5px; font-weight:700;
    letter-spacing:0.03em; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; flex:1; max-width:220px; text-transform:uppercase;
    border-bottom:3px solid transparent; transition:background .12s ease, color .12s ease;
    background:none; border-left:none; border-right:none; border-top:none; font-family:inherit; cursor:pointer;
  }
  .app-switch-bar a:hover, .app-switch-bar button:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .app-switch-bar a.active{color:#fff; border-bottom-color:var(--signal, #F2B705); background:rgba(255,255,255,0.06);}

  /* ===== Skyline hero ===== */
  .hero{
    color:#fff;
    padding:28px 20px 34px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image: url('20260114_145500.jpg');
    background-size: 115%;
    background-position: center 55%;
    filter: brightness(1.25) contrast(1.05);
    z-index:0;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(31,77,99,0.55) 0%, rgba(46,110,142,0.35) 55%, rgba(76,147,172,0.22) 100%);
    z-index:0;
  }
  .hero-top, .hero .tabs{ position:relative; z-index:1; }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:44px; color:#fff; letter-spacing:1px; font-weight:800;}
  .brand .tag{font-family:'Source Sans 3'; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ice-light); font-style:italic;}
  .who{
    font-size:13px; color:var(--ice-light); text-align:right;
  }
  .who-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .who button{
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:12px; margin-left:6px;
  }
  .who button:hover{background:rgba(255,255,255,0.15);}
  .skyline{width:100%; height:64px; display:block; margin-top:22px;}

  /* ===== Signpost tabs ===== */
  .tabs{
    max-width:1000px; margin:0 auto; padding:0 20px;
    transform:translateY(20px);
    position:relative; z-index:2;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs-inner{
    display:flex; gap:14px; width:max-content; margin:0 auto;
  }
  .route-waypoint-label{ background:none; border:none; box-shadow:none; color:#fff; font-weight:700; font-size:11px; }
  .tab{
    background:none; border:none; box-shadow:none; clip-path:none;
    color:rgba(255,255,255,0.62);
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    font-size:14px;
    padding:10px 14px 8px 14px;
    border-bottom:2px solid transparent;
    flex-shrink:0; white-space:nowrap;
  }
  .tab.active{color:#fff; border-bottom-color:var(--signal, #F2B705);}
  .tab:hover{color:#fff;}

  main{max-width:1000px; margin:0 auto; padding:40px 20px 80px 20px;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-input{
    flex:1; min-width:180px;
    padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .btn{
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ice-deep);
    background:var(--ice-deep); color:#fff; font-weight:600; font-size:14px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ice);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.secondary:hover{background:var(--ice-light);}
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--ice-deep); outline-offset:2px;}

  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .sort-control{display:flex; align-items:center; gap:6px;}
  .sort-control select{
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px;
    font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .sort-dir-btn{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff;
    width:32px; height:32px; font-size:15px; cursor:pointer; color:var(--ink);
  }
  .sort-dir-btn:hover{background:var(--ice-light);}
  .chip{
    padding:4px 10px; border-radius:16px; border:1px solid var(--line);
    background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.3;
  }
  .chip.on{color:#fff; border-color:transparent;}

  /* ===== Cards ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ice-light); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-left-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); cursor:pointer; border-left-color:var(--ice);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .agenda-date-row{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em;
    font-weight:700; font-size:15px; color:var(--ice-deep); margin-bottom:2px;
  }
  .card h3{font-size:17px; color:var(--ink); line-height:1.25;}
  .badge{
    flex-shrink:0; font-family:'JetBrains Mono'; font-weight:700; font-size:12px;
    color:#fff; padding:3px 8px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
  .stat-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft);}
  .stat-row .mono{color:var(--ink); font-weight:600;}
  .card p.excerpt{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .hut-link-chip{
    align-self:flex-start; font-size:12px; background:var(--ice-light); color:var(--ice-deep);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .conditions-note{
    font-size:12.5px; background:#FBF3D9; border-left:3px solid var(--signal-deep);
    padding:6px 9px; color:#5B4A00; border-radius:2px;
  }
  .meta-line{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty h3{color:var(--ink); font-size:18px; margin-bottom:8px;}
  .empty .btn{margin-top:16px;}

  /* ===== Legend ===== */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .legend .chip{cursor:default; display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(20,30,36,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); width:100%; max-width:620px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:28px; margin:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px;}
  .modal-head h2{font-size:22px;}
  .x-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; padding:2px 6px;}
  .x-btn:hover{color:var(--ink);}

  .field{margin-bottom:9px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:3px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .fab-save{
    position:fixed; bottom:20px; right:20px; z-index:70;
    background:var(--ice-deep); color:#fff; border:none; border-radius:50px;
    padding:14px 24px; font-weight:700; font-size:14px; box-shadow:var(--shadow-lg);
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .fab-save:hover{background:var(--ice);}
  .fab-save[disabled]{opacity:0.6; cursor:default;}
  .emergency-tab{
    position:fixed; top:50%; left:0; transform:translateY(-50%); z-index:70;
    background:var(--danger); color:#fff; border:none;
    padding:12px 5px; border-radius:0 8px 8px 0;
    font-family:'Oswald'; font-size:11px; font-weight:700; letter-spacing:0.08em;
    writing-mode:vertical-rl; text-orientation:mixed;
    box-shadow:var(--shadow); cursor:pointer; opacity:0.72;
    touch-action:none;
  }
  .emergency-tab:hover{opacity:1;}

  /* ===== Detail panel ===== */
  .detail-badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{
    font-family:'Oswald'; text-transform:uppercase; font-size:13px; letter-spacing:0.05em;
    color:var(--ice-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  }
  .detail-section p{font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap; margin:0;}
  .detail-stats{display:flex; gap:22px; flex-wrap:wrap; margin:14px 0;}
  .detail-stat .num{font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--ink);}
  .detail-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .detail-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#FBEAE7;}

  .cond-box{background:var(--ice-light); border-radius:var(--radius); padding:12px; margin-top:14px;}
  .cond-box textarea{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13.5px; min-height:44px;}
  .cond-box .meta-line{margin-top:6px;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-family:'Oswald'; letter-spacing:0.05em; text-transform:uppercase; font-size:13px;}

  .form-error{
    background:#FBEAE7; border:1px solid var(--danger); color:#7A2A1F;
    padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ice-deep); color:#fff; padding:11px 20px; border-radius:20px;
    font-size:13.5px; box-shadow:var(--shadow-lg); z-index:100; max-width:90%; text-align:center;
  }
  .toast.error{background:var(--danger);}
  .btn[disabled]{opacity:0.6; cursor:default;}

  .backup-banner{
    background:#B0392C; color:#fff; padding:12px 20px; text-align:center;
    font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:80;
  }
  .backup-banner button{
    background:#fff; color:#B0392C; border:none; border-radius:20px; padding:6px 16px;
    font-weight:700; font-size:13px;
  }

  .debug-toggle{
    display:none;
    position:fixed; bottom:16px; right:16px; z-index:90;
    background:var(--ink); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12px; font-family:'JetBrains Mono'; opacity:0.55;
    box-shadow:var(--shadow);
  }
  .debug-panel{
    position:fixed; bottom:60px; right:16px; left:16px; max-width:520px; margin:0 auto;
    max-height:50vh; overflow-y:auto; background:#12181C; color:#D7E4E9;
    border-radius:var(--radius); padding:12px; font-family:'JetBrains Mono'; font-size:11.5px;
    z-index:91; box-shadow:var(--shadow-lg); line-height:1.5;
  }
  .debug-panel .row{border-bottom:1px solid #2A343B; padding:4px 0;}
  .debug-panel .row.err{color:#FF8A75;}
  .debug-panel .row.ok{color:#8FD9A8;}
  .debug-panel .head{display:flex; justify-content:space-between; margin-bottom:6px;}
  .debug-panel .head button{background:none; border:1px solid #445; color:#D7E4E9; border-radius:4px; padding:2px 8px; font-size:11px;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .brand h1{font-size:32px;}
    .hero{padding-bottom:30px;}
    .tabs{transform:translateY(16px);}
    .tab{padding:8px 16px 8px 14px; font-size:12.5px;}
  }
</style>
</head>

/* =================================================================

/* Agenda ist app-übergreifend geteilt zwischen Firnspur und Fixseil. */
const OWN_TOURS_PATH = 'tours';

/* ================= Lokaler Offline-Cache ================= */
function cacheLocalSnapshot(){
  try{
    localStorage.setItem('firnspur-cache', JSON.stringify({
      tours: state.tours, huts: state.huts, agenda: state.agenda, cachedAt: new Date().toISOString()
    }));
  }catch(e){ /* z. B. Safari privater Modus – dann halt kein Offline-Cache */ }
}
function loadLocalSnapshot(){
  try{
    const raw = localStorage.getItem('firnspur-cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function migrateCompletions(item){
  if(!Array.isArray(item.completions)){
    item.completions = (item.completed && (item.completedBy || item.completedDate))
      ? [{by: item.completedBy || '?', date: item.completedDate || null}]
      : [];
  }
  return item;
}

async function loadAll(){
  state.loading = true; render();
  const [toursObj, hutsObj, agendaObj] = await Promise.all([ fbGet('tours'), fbGet('huts'), fbGet(AGENDA_PATH) ]);
  const cached = loadLocalSnapshot();

  if(!toursObj && !hutsObj && !agendaObj){
    // Keine Verbindung zur Datenbank – auf lokalen Offline-Cache zurückgreifen
    state.loading = false;
    if(cached){
      state.tours = (cached.tours || []).map(migrateCompletions);
      state.huts = (cached.huts || []).map(migrateCompletions);
      state.agenda = cached.agenda || [];
      state.offlineMode = true;
      state.offlineCachedAt = cached.cachedAt;
      showToast('Offline – zeigt den zuletzt gespeicherten Stand vom ' + fmtDate(cached.cachedAt), true);
    }else{
      showToast('Konnte nicht mit der Datenbank verbinden. Prüfe deine Internetverbindung.', true);
    }
    render();
    return;
  }

  const tours = (toursObj ? Object.values(toursObj) : []).filter(t=>t && t.id).map(migrateCompletions);
  const huts = (hutsObj ? Object.values(hutsObj) : []).filter(h=>h && h.id).map(migrateCompletions);
  const agenda = (agendaObj ? Object.values(agendaObj) : []).filter(a=>a && a.id).map(migrateAgendaStatus);
  tours.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  huts.sort((a,b)=> a.name.localeCompare(b.name, 'de'));

  // Lokale, noch nicht synchronisierte Einträge nicht verlieren — sowohl aus dem
  // aktuellen Speicher als auch aus dem lokalen Cache (wichtig nach einem
  // Seiten-Neuladen, da der Speicher dann leer ist, der Cache aber nicht).
  const unsyncedTours = dedupeById([
    ...state.tours.filter(x=>x._unsynced),
    ...((cached && cached.tours) ? cached.tours.filter(x=>x._unsynced) : [])
  ]).filter(x=>!tours.find(y=>y.id===x.id));
  const unsyncedHuts = dedupeById([
    ...state.huts.filter(x=>x._unsynced),
    ...((cached && cached.huts) ? cached.huts.filter(x=>x._unsynced) : [])
  ]).filter(x=>!huts.find(y=>y.id===x.id));
  const unsyncedAgenda = dedupeById([
    ...state.agenda.filter(x=>x._unsynced),
    ...((cached && cached.agenda) ? cached.agenda.filter(x=>x._unsynced) : [])
  ]).filter(x=>!agenda.find(y=>y.id===x.id));

  state.tours = [...unsyncedTours, ...tours];
  state.huts = [...unsyncedHuts, ...huts];
  state.agenda = [...unsyncedAgenda, ...agenda];
  state.loading = false;
  state.offlineMode = false;
  render();

  // Wiedergefundene, noch nicht synchronisierte Einträge jetzt automatisch
  // erneut versuchen hochzuladen, da offenbar wieder eine Verbindung besteht.
  unsyncedTours.forEach(async t=>{
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(ok) render();
  });
  unsyncedHuts.forEach(async h=>{
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(ok) render();
  });
  unsyncedAgenda.forEach(async a=>{
    const ok = await saveAgendaCloud(a).catch(()=>false);
    a._unsynced = !ok;
    if(ok) render();
  });
}

function closeModal(fromPopstate, skipDirtyCheck, keepHistoryLayer){
  if(!skipDirtyCheck && !confirmDiscardIfDirty()){
    // Nutzer will weiter bearbeiten — nichts schliessen. Bei der Hardware-/Browser-Zurück-Taste
    // wurde der History-Eintrag bereits konsumiert; render() stellt ihn über
    // pushModalHistoryIfNeeded() automatisch wieder her.
    render();
    return;
  }
  stopLiveGpsOnMap();
  // Zustiege sind "verschachtelt" unter einer Hütte — beim Schliessen zurück zur
  // Hütten-Detailansicht statt ganz zur Übersicht, damit man nicht jedes Mal neu
  // hinein navigieren muss. Ein Klick auf X/Zurück (oder die Hardware-Zurück-Taste)
  // schliesst dadurch immer nur die zuoberst offene Ebene.
  if(state.modal && (state.modal.type==='access-route-detail' || state.modal.type==='edit-access-route') && state.modal.payload && state.modal.payload.hutId){
    state.modal = {type:'hut-detail', payload: state.modal.payload.hutId};
  }else{
    state.modal = null;
  }
  render();
  // keepHistoryLayer: der Aufrufer öffnet direkt im Anschluss ein neues Modal (z. B. nach dem
  // Speichern zur Detailansicht) — dann ist die Modal-"Ebene" aus Sicht der Browser-Historie nie
  // wirklich geschlossen worden, also darf hier kein history.back() ausgelöst werden. Das wäre
  // sonst ein synchrones history.back() gefolgt von einem sofortigen history.pushState() (beim
  // Öffnen des neuen Modals) — genau diese Kombination verhält sich browserübergreifend
  // inkonsistent und kann die Historie verwirren, sodass eine spätere Zurück-Aktion zu weit
  // zurückspringt (bis auf die andere App).
  // Wurde diese Detailansicht von der Vollbild-Übersichtskarte aus geöffnet (siehe
  // openTourFromMap() etc. in 0-shared.js), landet man beim endgültigen Schliessen wieder auf der
  // Karte statt auf der normalen Übersicht darunter. Wichtig: hier NICHT zusätzlich
  // consumeHistoryEntry() (history.back()) aufrufen, bevor openStandaloneMap() gleich seinerseits
  // einen neuen History-Eintrag pusht — genau dieses synchrone back()+pushState() ist der Fehler,
  // der oben bei keepHistoryLayer bereits vermieden wird.
  if(!state.modal && !keepHistoryLayer && modalOpenedFromStandaloneMap){
    modalOpenedFromStandaloneMap = false;
    modalHistoryPushed = false;
    openStandaloneMap();
  }else if(!state.modal && modalHistoryPushed && !keepHistoryLayer){
    modalHistoryPushed = false;
    if(!fromPopstate) consumeHistoryEntry();
  }
}

function mergeImportedData(json){
  let data;
  try{ data = JSON.parse(json); }
  catch(e){ throw new Error('Das eingefügte Format ist kein gültiges JSON.'); }
  const importedTours = Array.isArray(data.tours) ? data.tours : [];
  const importedHuts = Array.isArray(data.huts) ? data.huts : [];
  const importedAgenda = Array.isArray(data.agenda) ? data.agenda : [];
  let addedTours = 0, updatedTours = 0, addedHuts = 0, updatedHuts = 0, addedAgenda = 0, updatedAgenda = 0;
  importedTours.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    migrateCompletions(t);
    const idx = state.tours.findIndex(x=>x.id===t.id);
    if(idx>=0){ state.tours[idx] = t; updatedTours++; }
    else { state.tours.unshift(t); addedTours++; }
  });
  importedHuts.forEach(h=>{
    if(!h || !h.id || !h.name) return;
    migrateCompletions(h);
    const idx = state.huts.findIndex(x=>x.id===h.id);
    if(idx>=0){ state.huts[idx] = h; updatedHuts++; }
    else { state.huts.push(h); addedHuts++; }
  });
  importedAgenda.forEach(a=>{
    if(!a || !a.id || !a.tourName) return;
    const idx = state.agenda.findIndex(x=>x.id===a.id);
    if(idx>=0){ state.agenda[idx] = a; updatedAgenda++; }
    else { state.agenda.unshift(a); addedAgenda++; }
  });
  // importierte Einträge auch in die Cloud schreiben, damit sie für alle sichtbar werden
  importedTours.forEach(t=> saveTourCloud(t).catch(()=>markUnsaved()));
  importedHuts.forEach(h=> saveHutCloud(h).catch(()=>markUnsaved()));
  importedAgenda.forEach(a=> saveAgendaCloud(a).catch(()=>markUnsaved()));
  return {addedTours, updatedTours, addedHuts, updatedHuts, addedAgenda, updatedAgenda};
}

async function submitAccessRouteForm(form){
  const hut = state.huts.find(h=>h.id===form.hutId);
  if(!hut) return;
  migrateHutAccessRoutes(hut);
  let track = null;
  try{ track = form.trackSimplified ? JSON.parse(form.trackSimplified) : null; }catch(e){ track = null; }
  let manual = [];
  try{ manual = form.manualTrack ? JSON.parse(form.manualTrack) : []; }catch(e){ manual = []; }
  const routeData = {
    id: form.routeId || uid('ar'),
    name: (form.name||'').trim(),
    season: form.season || '',
    elevation: form.elevation||'',
    duration: form.duration||'',
    difficulty: form.difficulty||'',
    difficultyT: form.difficultyT||'',
    description: form.description||'',
    gpxLink: form.gpxLink||'',
    trackSimplified: track,
    manualTrack: manual
  };
  const idx = hut.accessRoutes.findIndex(r=>r.id===routeData.id);
  if(idx>=0) hut.accessRoutes[idx] = routeData; else hut.accessRoutes.push(routeData);
  hut.updatedAt = new Date().toISOString();
  hut.updatedBy = state.myName;
  closeModal(false, true, true);
  state.modal = {type:'hut-detail', payload:hut.id};
  render();
  const ok = await saveHutCloud(hut).catch(()=>false);
  hut._unsynced = !ok;
  if(!ok){ markUnsaved(); showToast('Zustieg lokal gespeichert, aber nicht synchronisiert.', true); }
  else{ showToast('Zustieg gespeichert.'); }
  render();
}

async function deleteAccessRoute(hutId, routeId){
  const hut = state.huts.find(h=>h.id===hutId);

  hut.accessRoutes = (hut.accessRoutes||[]).filter(r=>r.id!==routeId);
  hut.updatedAt = new Date().toISOString();
  hut.updatedBy = state.myName;
  closeModal(false, true, true);
  state.modal = {type:'hut-detail', payload:hutId};
  render();
  const ok = await saveHutCloud(hut).catch(()=>false);
  hut._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
  showToast('Zustieg gelöscht.');
}
function setFormBusy(formId, busy){
  const form = document.getElementById(formId);
  if(!form) return;
  const btnId = formId==='tour-form' ? 'tour-save-btn' : 'hut-save-btn';
  const btn = document.getElementById(btnId);
  if(btn){
    btn.disabled = busy;
    if(busy){ btn.dataset.origText = btn.textContent; btn.textContent = 'Speichert…'; }
    else if(btn.dataset.origText){ btn.textContent = btn.dataset.origText; }
  }
}
function showFormError(formId, message){
  const form = document.getElementById(formId);
  if(!form) return;
  let box = form.querySelector('.form-error');
  if(!box){
    box = document.createElement('div');
    box.className = 'form-error';
    const actions = form.querySelector('.form-actions');
    if(actions) form.insertBefore(box, actions);
    else form.appendChild(box);
  }
  box.textContent = message;
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

  if(state.activeDiffFilters.size){
    list = list.filter(t=>state.activeDiffFilters.has(t.difficulty));
  }
  if(state.activeRegionFilters.size){
    list = list.filter(t=>state.activeRegionFilters.has(t.region));
  }
  if(state.activeApproachTypeFilters.size){
    list = list.filter(t=>(t.approachTypes||[]).some(v=>state.activeApproachTypeFilters.has(v)));
  }
  if(state.activeStayTypeFilters.size){
    list = list.filter(t=>(t.stayTypes||[]).some(v=>state.activeStayTypeFilters.has(v)));
  }
  if(state.activeStatusFilters.size){

}

/* ================= Modal rendering ================= */
function renderModal(){
  pushModalHistoryIfNeeded();
  const root = document.getElementById('modal-root');
  const m = state.modal;
  let inner = '';
  if(m.type==='name') inner = nameModalHtml();
  else if(m.type==='edit-tour') inner = tourFormHtml(m.payload);
  else if(m.type==='tour-detail') inner = tourDetailHtml(m.payload);
  else if(m.type==='edit-hut') inner = hutFormHtml(m.payload);
  else if(m.type==='edit-access-route') inner = accessRouteFormHtml(m.payload.hutId, m.payload.route);
  else if(m.type==='access-route-detail') inner = accessRouteDetailHtml(m.payload.hutId, m.payload.route);
  else if(m.type==='hut-detail') inner = hutDetailHtml(m.payload);
  else if(m.type==='complete-tour') inner = completeFormHtml('tour', m.payload);
  else if(m.type==='complete-hut') inner = completeFormHtml('hut', m.payload);
  else if(m.type==='export') inner = exportModalHtml(m.payload);
  else if(m.type==='import') inner = importModalHtml();
  else if(m.type==='vorlagen') inner = vorlagenModalHtml(TOUR_VORLAGE_JSON);
  else if(m.type==='bedienungsanleitung') inner = bedienungsanleitungModalHtml();
  else if(m.type==='add-agenda') inner = agendaFormHtml();
  else if(m.type==='agenda-detail') inner = agendaDetailHtml(m.payload);
  else if(m.type==='emergency') inner = emergencyCardHtml();
  root.innerHTML = `<div class="overlay" data-act="overlay-close">${inner}</div>`;
  wireModalHandlers();
}

// Baut die Export-Nutzlast anhand der aktuell angehakten Filter-Chips im Export-Fenster.
// Bewusst nicht "alles immer" (wie früher) — man will z. B. oft nur die Touren an
// jemanden weitergeben, nicht die ganze Sammlung samt Hütten/Agenda.
function buildExportData(){
  const singleTourId = state.modal && state.modal.type==='export' && state.modal.payload && state.modal.payload.tourId;
  if(singleTourId){
    const tour = state.tours.find(t=>t.id===singleTourId);
    return tour ? {tours:[tour]} : {};
  }
  const chips = document.querySelectorAll('#export-filter-chips .chip');
  const selected = new Set();
  chips.forEach(c=>{ if(c.classList.contains('on')) selected.add(c.getAttribute('data-export-key')); });
  const data = {};
  if(selected.has('tours')) data.tours = state.tours;
  if(selected.has('huts')) data.huts = state.huts;
  if(selected.has('agenda')) data.agenda = state.agenda;
  return data;
}
function refreshExportText(){
  const ta = document.getElementById('export-text');
  if(ta) ta.value = JSON.stringify(buildExportData(), null, 2);
}
function exportModalHtml(payload){
  const singleTour = payload && payload.tourId ? state.tours.find(t=>t.id===payload.tourId) : null;
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>Exportieren</h2><button class="x-btn" data-act="close-modal">×</button></div>
    ${singleTour

function completeFormHtml(kind, id){
  const item = kind==='tour' ? state.tours.find(x=>x.id===id) : state.huts.find(x=>x.id===id);
  const title = kind==='tour' ? 'Tour als abgeschlossen markieren' : 'Hütte als besucht markieren';
  const today = new Date().toISOString().slice(0,10);
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>${title}</h2><button class="x-btn" data-act="close-modal">×</button></div>
    ${item ? `<p style="font-size:14px; color:var(--ink-soft); margin:0 0 14px 0;">${esc(item.name)}</p>` : ''}
    <div class="field"><label>Name</label><input type="text" id="complete-name-input" value="${esc(state.myName||'')}" placeholder="z. B. Simone" autofocus/></div>
    <div class="field"><label>Datum</label><input type="date" id="complete-date-input" value="${today}"/></div>
    <div class="form-actions">
      <button class="btn secondary" data-act="close-modal">Abbrechen</button>
      <button class="btn" data-act="submit-complete" data-kind="${kind}" data-id="${id}">Bestätigen</button>
    </div>
  </div>`;
}

/* ================= Abgeschlossen view ================= */
function buildPersonGroups(){
  const groups = {};
  state.tours.forEach(t=>{
    (t.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].tours.find(x=>x.id===t.id)) groups[name].tours.push(t);
    });
  });
  state.huts.forEach(h=>{
    (h.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].huts.find(x=>x.id===h.id)) groups[name].huts.push(h);
    });
  });
  return groups;
}

function abgeschlossenViewHtml(){
  const groups = buildPersonGroups();
  const names = Object.keys(groups);
  if(!names.length){
    return `<div class="empty">
      <h3>Noch nichts als abgeschlossen markiert</h3>
      <p>Öffne eine Tour oder Hütte und tippe auf "Als abgeschlossen markieren", um sie hier zu sammeln.</p>
    </div>`;
  }
  names.sort((a,b)=>{
    if(state.myName){
      if(a===state.myName) return -1;
      if(b===state.myName) return 1;
    }
    return a.localeCompare(b, 'de');
  });
  return names.map(name=>{
    const g = groups[name];
    const isMe = state.myName && name===state.myName;
    const total = g.tours.length + g.huts.length;
    return `<div class="detail-section" style="margin-bottom:28px;">
      <h4>${isMe ? '⭐ Meine Liste' : esc(name)} (${total})</h4>
      ${g.tours.length ? `<div class="grid" style="margin-top:6px;">${g.tours.map(tourCardHtml).join('')}</div>` : ''}
      ${g.huts.length ? `<div class="grid" style="margin-top:${g.tours.length?12:6}px;">${g.huts.map(hutCardHtml).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
function openCompleteTour(id){
  state.modal = {type:'complete-tour', payload:id};
  render();
}
function openCompleteHut(id){
  state.modal = {type:'complete-hut', payload:id};
  render();
}
async function submitCompleteTour(id, name, date){
  const t = state.tours.find(x=>x.id===id);
  if(!t) return;
  if(!Array.isArray(t.completions)) t.completions = [];
  t.completions.push({by: (name||'').trim() || state.myName, date: date});
  t.completed = true;
  t.updatedAt = new Date().toISOString();
  t.updatedBy = state.myName;
  state.modal = {type:'tour-detail', payload:id};
  render();
  const ok = await saveTourCloud(t).catch(()=>false);
  t._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}
async function submitCompleteHut(id, name, date){
  const h = state.huts.find(x=>x.id===id);
  if(!h) return;
  if(!Array.isArray(h.completions)) h.completions = [];
  h.completions.push({by: (name||'').trim() || state.myName, date: date});
  h.completed = true;
  h.updatedAt = new Date().toISOString();
  h.updatedBy = state.myName;
  state.modal = {type:'hut-detail', payload:id};
  render();
  const ok = await saveHutCloud(h).catch(()=>false);
  h._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}
async function removeCompletion(kind, id, idx){
  const item = kind==='tour' ? state.tours.find(x=>x.id===id) : state.huts.find(x=>x.id===id);
  if(!item || !Array.isArray(item.completions)) return;
  item.completions.splice(idx, 1);
  item.completed = item.completions.length > 0;
  item.updatedAt = new Date().toISOString();
  item.updatedBy = state.myName;
  render();
  const saveFn = kind==='tour' ? saveTourCloud : saveHutCloud;
  const ok = await saveFn(item).catch(()=>false);
  item._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}

/* ================= Event wiring ================= */
function wireGlobalHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act');
    if(act==='view-touren') el.onclick = ()=>setView('touren');
    else if(act==='view-huetten') el.onclick = ()=>setView('huetten');
    else if(act==='view-agenda') el.onclick = ()=>setView('agenda');
    else if(act==='view-abgeschlossen') el.onclick = ()=>setView('abgeschlossen');
    else if(act==='change-name') el.onclick = ()=>{ state.modal = {type:'name'}; render(); };
    else if(act==='export-data') el.onclick = openExport;
    else if(act==='import-data') el.onclick = openImport;
    else if(act==='add-tour') el.onclick = openAddTour;
    else if(act==='add-hut') el.onclick = openAddHut;
    else if(act==='open-standalone-map') el.onclick = openStandaloneMap;
    else if(act==='add-agenda') el.onclick = openAddAgenda;
    else if(act==='open-tour') { el.onclick = ()=>openTourDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openTourDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-hut') { el.onclick = ()=>openHutDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openHutDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-agenda') { el.onclick = ()=>openAgendaDetail(el.getAttribute('data-id')); }
    else if(act==='filter-diff') el.onclick = ()=>toggleDiffFilter(el.getAttribute('data-code'));
    else if(act==='filter-region') el.onclick = ()=>toggleRegionFilter(el.getAttribute('data-region'));
    else if(act==='reset-tour-filters') el.onclick = ()=>resetTourFilters();
    else if(act==='filter-approach-type') el.onclick = ()=>toggleApproachTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-stay-type') el.onclick = ()=>toggleStayTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-status') el.onclick = ()=>toggleStatusFilter(el.getAttribute('data-value'));
    else if(act==='filter-glacier') el.onclick = ()=>toggleGlacierFilter(el.getAttribute('data-value'));
    else if(act==='toggle-favorite') el.onclick = (e)=>{ e.stopPropagation(); toggleFavorite(el.getAttribute('data-id')); };
    else if(act==='toggle-only-favorites') el.onclick = ()=>{ state.onlyFavorites = !state.onlyFavorites; render(); };
    else if(act==='filter-hut-region') el.onclick = ()=>toggleHutRegionFilter(el.getAttribute('data-region'));
    else if(act==='filter-hut-diff') el.onclick = ()=>toggleHutDiffFilter(el.getAttribute('data-code'));
    else if(act==='filter-hut-approach-type') el.onclick = ()=>toggleHutApproachTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-hut-staffed-month') el.onclick = ()=>toggleHutStaffedMonthFilter(el.getAttribute('data-month'));
    else if(act==='filter-hut-winterraum-month') el.onclick = ()=>toggleHutWinterraumMonthFilter(el.getAttribute('data-month'));
    else if(act==='reset-hut-filters') el.onclick = ()=>resetHutFilters();
    else if(act==='sort-by') el.onchange = (e)=>{ const kind=el.getAttribute('data-kind'); if(kind==='tour') state.tourSortBy=e.target.value; else state.hutSortBy=e.target.value; renderListOnly(); };
    else if(act==='sort-dir') el.onclick = ()=>{ const kind=el.getAttribute('data-kind'); if(kind==='tour') state.tourSortDir = state.tourSortDir==='asc'?'desc':'asc'; else state.hutSortDir = state.hutSortDir==='asc'?'desc':'asc'; renderListOnly(); };
    else if(act==='search') el.oninput = (e)=>{ state.search = e.target.value; renderListOnly(); };
  });
  const tourFilterToggleBtn = app.querySelector('#tour-filter-toggle-btn');
  if(tourFilterToggleBtn){
    tourFilterToggleBtn.addEventListener('click', ()=>{
      const panel = app.querySelector('#tour-filter-panel');
      if(panel) panel.style.display = (panel.style.display==='none') ? '' : 'none';
    });
  }
  const hutFilterToggleBtn = app.querySelector('#hut-filter-toggle-btn');
  if(hutFilterToggleBtn){
    hutFilterToggleBtn.addEventListener('click', ()=>{
      const panel = app.querySelector('#hut-filter-panel');
      if(panel) panel.style.display = (panel.style.display==='none') ? '' : 'none';
    });
  }
  app.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });
}

// Lightweight partial re-render for search input to avoid focus loss
function renderListOnly(){
  const main = document.querySelector('main');
  if(!main) return;
  main.innerHTML = state.loading ? `<div class="loading">Lade…</div>` : (state.view==='touren' ? tourenViewHtml() : state.view==='huetten' ? huettenViewHtml() : state.view==='agenda' ? agendaViewHtml() : abgeschlossenViewHtml());
  wireGlobalHandlers();
  const input = main.querySelector('.search-input');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

  const root = document.getElementById('modal-root');
  dlog('Modal gerendert: ' + (state.modal ? state.modal.type : 'keins'));
  syncModalDirtyTracking();
  // Erkennt Änderungen an Text-/Auswahlfeldern sowie Chip-Klicks, um beim Verlassen einer
  // Bearbeiten-Maske gezielt nachfragen zu können, ob ungespeicherte Änderungen verworfen
  // werden sollen. Nur einmal verdrahtet (modal-root bleibt über Renders hinweg bestehen).
  if(!root.dataset.dirtyWired){
    root.dataset.dirtyWired = '1';
    root.addEventListener('input', ()=> markModalDirty());
    root.addEventListener('change', ()=> markModalDirty());
    root.addEventListener('click', (e)=>{ if(e.target.closest('button.chip')) markModalDirty(); });

      if(!typeSelect || !tourSelect) return;

      if(val==='custom') return;
      const [src, refId] = val.split(':');
      const list = src==='own' ? state.tours : state.otherAppTours;

      const [src, refId] = val.split(':');

      if(!accessRoutes.length && !descentRoutes.length){ routeFieldsWrap.style.display = 'none'; return; }
      routeFieldsWrap.style.display = '';
      const opt = r => `<option value="${esc(r.id)}">${esc(r.name||'?')}</option>`;

    }

    }
  }

  // Dezente Löschen-Funktion mit zweistufiger Bestätigung (Tour & Hütte)
  function wireDeleteConfirm(prefix, removeFn, onDeletedGoTo){
    const trigger = document.getElementById(`delete-${prefix}-trigger`);
    const confirmBox = document.getElementById(`delete-${prefix}-confirm`);
    const yesBtn = document.getElementById(`delete-${prefix}-yes`);
    const noBtn = document.getElementById(`delete-${prefix}-no`);
    if(!trigger) return;
    trigger.addEventListener('click', ()=>{
      trigger.style.display = 'none';
      confirmBox.style.display = '';
    });
    if(noBtn) noBtn.addEventListener('click', ()=>{
      confirmBox.style.display = 'none';
      trigger.style.display = '';
    });
    if(yesBtn) yesBtn.addEventListener('click', ()=>{
      removeFn(yesBtn.getAttribute('data-id'));
      closeModal(false, true);
      showToast(onDeletedGoTo + ' gelöscht.');
    });
  }
  wireDeleteConfirm('tour', removeTour, 'Tour');
  wireDeleteConfirm('hut', removeHut, 'Hütte');
  wireDeleteConfirm('agenda', removeAgendaItem, 'Termin');

  root.querySelectorAll('[data-act="edit-tour"]').forEach(el=> el.onclick = ()=>openEditTour(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="export-tour"]').forEach(el=> el.onclick = ()=>openTourExport(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="edit-hut"]').forEach(el=> el.onclick = ()=>openEditHut(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-hut"]').forEach(el=> el.onclick = ()=>openHutDetail(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-tour"]').forEach(el=> el.onclick = ()=>openTourDetail(el.getAttribute('data-id')));

  root.querySelectorAll('[data-act="add-access-route"]').forEach(el=> el.onclick = ()=>{
    state.modal = {type:'edit-access-route', payload:{hutId: el.getAttribute('data-hut-id'), route:null}};
    render();
  });
  root.querySelectorAll('[data-act="open-access-route"]').forEach(el=> el.onclick = ()=>{
    const hutId = el.getAttribute('data-hut-id');
    const routeId = el.getAttribute('data-route-id');
    const hut = state.huts.find(h=>h.id===hutId);
    const route = hut && hut.accessRoutes ? hut.accessRoutes.find(r=>r.id===routeId) : null;
    if(!route) return;
    state.modal = {type:'access-route-detail', payload:{hutId, route}};
    render();
  });
  root.querySelectorAll('[data-act="edit-access-route"]').forEach(el=> el.onclick = ()=>{
    const hutId = el.getAttribute('data-hut-id');
    const routeId = el.getAttribute('data-route-id');
    const hut = state.huts.find(h=>h.id===hutId);
    const route = hut && hut.accessRoutes ? hut.accessRoutes.find(r=>r.id===routeId) : null;
    if(!route) return;
    state.modal = {type:'edit-access-route', payload:{hutId, route}};
    render();
  });
  root.querySelectorAll('[data-act="show-access-route-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-target');
      let track = [], manualTrack = [];
      try{ track = JSON.parse(btn.getAttribute('data-track') || '[]'); }catch(e){ track = []; }
      try{ manualTrack = JSON.parse(btn.getAttribute('data-manual-track') || '[]'); }catch(e){ manualTrack = []; }
      renderTrackDisplayMap(target, [], track, manualTrack);
    });
  });
}

/* ================= Global error safety net ================= */
window.addEventListener('error', function(e){
  console.error('Unhandled error', e.error || e.message);
  showToast('Es gab ein unerwartetes Problem: ' + (e.message || 'unbekannter Fehler') + '. Bitte nochmal versuchen.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection', e.reason);
  showToast('Es gab ein unerwartetes Problem beim Speichern. Bitte nochmal versuchen.', true);
});
window.addEventListener('beforeunload', function(e){
  if(state.hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= Init ================= */
try{
  const savedName = localStorage.getItem('firnspur-myname');
  if(savedName) state.myName = savedName;
}catch(e){}
loadAuthFromStorage();
cleanupExpiredOfflineDownloads();
wireAppSwitchSwipe('./fixseil.html');
function toggleEmergencyCard(){
  if(state.modal && state.modal.type==='emergency'){ closeModal(); }
  else{ state.modal = {type:'emergency'}; render(); }
}
const emergencyTab = document.getElementById('emergency-btn');
emergencyTab.addEventListener('click', toggleEmergencyCard);
let emergencySwipeStart = null;
emergencyTab.addEventListener('touchstart', (e)=>{
  emergencySwipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, {passive:true});
emergencyTab.addEventListener('touchend', (e)=>{
  if(!emergencySwipeStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - emergencySwipeStart.x;
  const dy = t.clientY - emergencySwipeStart.y;
  emergencySwipeStart = null;
  // Wegziehen nach rechts oder nach unten öffnet die Karte (kein erneutes Schliessen per Wisch, nur per Klick/erneutem Antippen)
  if((dx > 35 || dy > 35) && !(state.modal && state.modal.type==='emergency')){
    state.modal = {type:'emergency'}; render();
  }
});

if(isLoggedIn()){
  dlog('App gestartet — Version ' + APP_VERSION);
  loadAll();
  if(state.myName) loadFavorites();
}else{
  document.getElementById('app').innerHTML = loginScreenHtml();
  wireLoginScreen();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      dlog('Service Worker konnte nicht registriert werden (Offline-Modus evtl. eingeschränkt).', 'err');
    });
  });
}
</script>
