<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skitour — gemeinsam planen</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./IMG-20260816-WA0023.jpg">
<link rel="apple-touch-icon" href="./IMG-20260816-WA0023.jpg">
<meta name="theme-color" content="#1F4D63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E9F1F4;
    --paper:#FFFFFF;
    --ink:#1B2A33;
    --ink-soft:#5B6B73;
    --ink-faint:#8B9AA1;
    --ice:#2E6E8E;
    --ice-deep:#1F4D63;
    --ice-light:#D9E9EF;
    --signal:#F2B705;
    --signal-deep:#C99400;
    --line:#DFD8C8;
    --danger:#B0392C;
    --ok:#3C7A52;
    --shadow: 0 2px 10px rgba(27,42,51,0.08);
    --shadow-lg: 0 12px 32px rgba(27,42,51,0.16);
    --radius: 3px;

    --d-L:#5FA8D3;
    --d-WS:#2E7EB0;
    --d-ZS:#C9A227;
    --d-S:#D97B3E;
    --d-SS:#C2452D;
    --d-AS:#8A2E2E;
    --d-EX:#2B1416;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--ice-deep);}

  /* ===== App-Umschalter ===== */
  .app-switch-bar{
    background:var(--ink); display:flex; justify-content:center; gap:0;
  }
  .app-switch-bar a{
    color:rgba(255,255,255,0.55); text-decoration:none; font-size:13.5px; font-weight:700;
    letter-spacing:0.03em; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; flex:1; max-width:220px; text-transform:uppercase;
    border-bottom:3px solid transparent; transition:background .12s ease, color .12s ease;
  }
  .app-switch-bar a:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .app-switch-bar a.active{color:#fff; border-bottom-color:var(--signal, #F2B705); background:rgba(255,255,255,0.06);}

  /* ===== Skyline hero ===== */
  .hero{
    color:#fff;
    padding:28px 20px 34px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image: url('20260114_145500.jpg');
    background-size: 115%;
    background-position: center 55%;
    filter: brightness(1.25) contrast(1.05);
    z-index:0;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(31,77,99,0.55) 0%, rgba(46,110,142,0.35) 55%, rgba(76,147,172,0.22) 100%);
    z-index:0;
  }
  .hero-top, .hero .tabs{ position:relative; z-index:1; }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:44px; color:#fff; letter-spacing:1px; font-weight:800;}
  .brand .tag{font-family:'Source Sans 3'; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ice-light); font-style:italic;}
  .who{
    font-size:13px; color:var(--ice-light); text-align:right;
  }
  .who-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .who button{
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:12px; margin-left:6px;
  }
  .who button:hover{background:rgba(255,255,255,0.15);}
  .skyline{width:100%; height:64px; display:block; margin-top:22px;}

  /* ===== Signpost tabs ===== */
  .tabs{
    max-width:1000px; margin:0 auto; padding:0 20px;
    display:flex; gap:14px; transform:translateY(20px);
    position:relative; z-index:2;
  }
  .tab{
    background:none; border:none; box-shadow:none; clip-path:none;
    color:rgba(255,255,255,0.62);
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    font-size:14px;
    padding:10px 14px 8px 14px;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:#fff; border-bottom-color:var(--signal, #F2B705);}
  .tab:hover{color:#fff;}

  main{max-width:1000px; margin:0 auto; padding:40px 20px 80px 20px;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-input{
    flex:1; min-width:180px;
    padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .btn{
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ice-deep);
    background:var(--ice-deep); color:#fff; font-weight:600; font-size:14px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ice);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.secondary:hover{background:var(--ice-light);}
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--ice-deep); outline-offset:2px;}

  .chips{display:flex; gap:7px; flex-wrap:wrap;}
  .chip{
    padding:5px 12px; border-radius:20px; border:1px solid var(--line);
    background:#fff; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .chip.on{color:#fff; border-color:transparent;}

  /* ===== Cards ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ice-light); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-left-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); cursor:pointer; border-left-color:var(--ice);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .agenda-date-row{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em;
    font-weight:700; font-size:15px; color:var(--ice-deep); margin-bottom:2px;
  }
  .card h3{font-size:17px; color:var(--ink); line-height:1.25;}
  .badge{
    flex-shrink:0; font-family:'JetBrains Mono'; font-weight:700; font-size:12px;
    color:#fff; padding:3px 8px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
  .stat-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft);}
  .stat-row .mono{color:var(--ink); font-weight:600;}
  .card p.excerpt{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .hut-link-chip{
    align-self:flex-start; font-size:12px; background:var(--ice-light); color:var(--ice-deep);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .conditions-note{
    font-size:12.5px; background:#FBF3D9; border-left:3px solid var(--signal-deep);
    padding:6px 9px; color:#5B4A00; border-radius:2px;
  }
  .meta-line{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty h3{color:var(--ink); font-size:18px; margin-bottom:8px;}
  .empty .btn{margin-top:16px;}

  /* ===== Legend ===== */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .legend .chip{cursor:default; display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(20,30,36,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); width:100%; max-width:620px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:28px; margin:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px;}
  .modal-head h2{font-size:22px;}
  .x-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; padding:2px 6px;}
  .x-btn:hover{color:var(--ink);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  /* ===== Detail panel ===== */
  .detail-badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{
    font-family:'Oswald'; text-transform:uppercase; font-size:13px; letter-spacing:0.05em;
    color:var(--ice-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  }
  .detail-section p{font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap; margin:0;}
  .detail-stats{display:flex; gap:22px; flex-wrap:wrap; margin:14px 0;}
  .detail-stat .num{font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--ink);}
  .detail-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .detail-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#FBEAE7;}

  .cond-box{background:var(--ice-light); border-radius:var(--radius); padding:12px; margin-top:14px;}
  .cond-box textarea{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13.5px; min-height:44px;}
  .cond-box .meta-line{margin-top:6px;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-family:'Oswald'; letter-spacing:0.05em; text-transform:uppercase; font-size:13px;}

  .form-error{
    background:#FBEAE7; border:1px solid var(--danger); color:#7A2A1F;
    padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ice-deep); color:#fff; padding:11px 20px; border-radius:20px;
    font-size:13.5px; box-shadow:var(--shadow-lg); z-index:100; max-width:90%; text-align:center;
  }
  .toast.error{background:var(--danger);}
  .btn[disabled]{opacity:0.6; cursor:default;}

  .backup-banner{
    background:#B0392C; color:#fff; padding:12px 20px; text-align:center;
    font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:80;
  }
  .backup-banner button{
    background:#fff; color:#B0392C; border:none; border-radius:20px; padding:6px 16px;
    font-weight:700; font-size:13px;
  }

  .debug-toggle{
    position:fixed; bottom:16px; right:16px; z-index:90;
    background:var(--ink); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12px; font-family:'JetBrains Mono'; opacity:0.55;
    box-shadow:var(--shadow);
  }
  .debug-panel{
    position:fixed; bottom:60px; right:16px; left:16px; max-width:520px; margin:0 auto;
    max-height:50vh; overflow-y:auto; background:#12181C; color:#D7E4E9;
    border-radius:var(--radius); padding:12px; font-family:'JetBrains Mono'; font-size:11.5px;
    z-index:91; box-shadow:var(--shadow-lg); line-height:1.5;
  }
  .debug-panel .row{border-bottom:1px solid #2A343B; padding:4px 0;}
  .debug-panel .row.err{color:#FF8A75;}
  .debug-panel .row.ok{color:#8FD9A8;}
  .debug-panel .head{display:flex; justify-content:space-between; margin-bottom:6px;}
  .debug-panel .head button{background:none; border:1px solid #445; color:#D7E4E9; border-radius:4px; padding:2px 8px; font-size:11px;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .brand h1{font-size:32px;}
    .hero{padding-bottom:30px;}
    .tabs{transform:translateY(16px);}
    .tab{padding:8px 16px 8px 14px; font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="app-switch-bar">
  <a href="./index.html" class="active">🎿 Skitour</a>
  <a href="./fixseil.html">🧗 Hochtour/MSL</a>
</div>
<div id="app"></div>
<button class="debug-toggle" id="debug-toggle-btn" onclick="toggleDebugPanel()">Diagnose v12</button>
<div id="debug-panel-root"></div>

<script>
/* ================= Debug log (in-app, browser-independent) ================= */
const APP_VERSION = 'v23-peak-as-name';
let debugLog = [];
let debugPanelOpen = false;
function dlog(message, kind){
  const entry = {t: new Date().toLocaleTimeString('de-CH'), message, kind: kind||'info'};
  debugLog.push(entry);
  if(debugLog.length > 60) debugLog.shift();
  if(kind==='err') console.error(message); else console.log(message);
  if(debugPanelOpen) renderDebugPanel();
}
function toggleDebugPanel(){
  debugPanelOpen = !debugPanelOpen;
  renderDebugPanel();
}
function renderDebugPanel(){
  const root = document.getElementById('debug-panel-root');
  if(!debugPanelOpen){ root.innerHTML = ''; return; }
  const rows = debugLog.slice().reverse().map(e=>
    `<div class="row ${e.kind==='err'?'err':(e.kind==='ok'?'ok':'')}">[${e.t}] ${esc(e.message)}</div>`
  ).join('') || '<div class="row">Noch keine Einträge.</div>';
  root.innerHTML = `<div class="debug-panel">
    <div class="head"><strong>Diagnose-Log</strong><button onclick="debugLog=[];renderDebugPanel();">leeren</button></div>
    ${rows}
  </div>`;
}

/* =================================================================
   Speicherung: Diese Version läuft als eigenständige Webseite (nicht
   im Claude-Artefakt), daher funktioniert echter Netzwerkzugriff zu
   Firebase. Alle Touren/Hütten werden live in Firebase Realtime
   Database gespeichert und zwischen allen Nutzern synchronisiert.
   Als Sicherheitsnetz bei fehlender Internetverbindung bleibt der
   Export/Import weiterhin verfügbar.
   ================================================================= */
const FIREBASE_URL = 'https://firnspur-default-rtdb.europe-west1.firebasedatabase.app';
/* Agenda ist app-übergreifend geteilt zwischen Firnspur und Fixseil. */
const AGENDA_PATH = 'agenda';
const OWN_TOURS_PATH = 'tours';
const OTHER_TOURS_PATH = 'fixseil/tours';
const OWN_APP_LABEL = '🎿 Skitour';
const OTHER_APP_LABEL = '🧗 Hochtour';

async function fbGet(path){
  try{
    const res = await fetch(FIREBASE_URL + '/' + path + '.json');
    if(!res.ok){ dlog('Firebase GET fehlgeschlagen ('+res.status+'): '+path, 'err'); return null; }
    const data = await res.json();
    return data;
  }catch(e){
    dlog('Firebase GET Fehler für "'+path+'": '+(e && e.message ? e.message : e), 'err');
    return null;
  }
}
async function fbSet(path, value){
  try{
    const res = await fetch(FIREBASE_URL + '/' + path + '.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
    if(!res.ok){ dlog('Firebase PUT fehlgeschlagen ('+res.status+'): '+path, 'err'); return false; }
    return true;
  }catch(e){
    dlog('Firebase PUT Fehler für "'+path+'": '+(e && e.message ? e.message : e), 'err');
    return false;
  }
}
async function fbDelete(path){
  try{
    const res = await fetch(FIREBASE_URL + '/' + path + '.json', {method:'DELETE'});
    if(!res.ok){ dlog('Firebase DELETE fehlgeschlagen ('+res.status+'): '+path, 'err'); return false; }
    return true;
  }catch(e){
    dlog('Firebase DELETE Fehler für "'+path+'": '+(e && e.message ? e.message : e), 'err');
    return false;
  }
}

/* ================= Domain meta ================= */
const DIFF = {
  'L':   {label:'Leicht',  color:'var(--d-L)',  desc:'Mässig steiles Gelände, keine Spitzkehren nötig.'},
  'WS-': {label:'Wenig schwierig −', color:'var(--d-WS)', desc:'Mässig steil, einfache Spitzkehren.'},
  'WS':  {label:'Wenig schwierig', color:'var(--d-WS)', desc:'Mässig steil bis steil, kurze Spitzkehren.'},
  'WS+': {label:'Wenig schwierig +', color:'var(--d-WS)', desc:'Steiler, anspruchsvollere Spitzkehren.'},
  'ZS-': {label:'Ziemlich schwierig −', color:'var(--d-ZS)', desc:'Steil, kurze anspruchsvolle Passagen.'},
  'ZS':  {label:'Ziemlich schwierig', color:'var(--d-ZS)', desc:'Durchgehend steil, anspruchsvolle Spitzkehren.'},
  'ZS+': {label:'Ziemlich schwierig +', color:'var(--d-ZS)', desc:'Durchgehend sehr steil, kurze Extrempassagen.'},
  'S-':  {label:'Schwierig −', color:'var(--d-S)', desc:'Sehr steil, Passagen bis rund 35°.'},
  'S':   {label:'Schwierig', color:'var(--d-S)', desc:'Sehr steil, Passagen bis rund 40°.'},
  'SS':  {label:'Sehr schwierig', color:'var(--d-SS)', desc:'Durchgehend sehr steil, kurze Extrempassagen.'}
};
const DIFF_ORDER = ['L','WS-','WS','WS+','ZS-','ZS','ZS+','S-','S','SS'];
const EXPOSITIONS = ['N','NE','E','SE','S','SW','W','NW'];
const GEFAHREN_SKI = ['Lawinenhang','Triebschnee','Steilhänge über 40°','Absturzgelände','Engpass','vereiste Passage','Gletscher/Spalten','schwierige Orientierung','Waldpassagen','Wechten'];
const MATERIAL_SKI = ['Steigeisen','Pickel','Gurt','Spaltenrettung'];
const ROPE_TYPES_SKI = ['Gletscherseil','Einfachseil','Halbseilstrang','Zwillingsseil'];
const ROPE_LENGTHS_SKI = ['30m','40m','50m','60m','70m'];

/* ================= State ================= */
let state = {
  view: 'touren',
  loading: true,
  tours: [],
  huts: [],
  agenda: [],
  otherAppTours: [], // Touren der jeweils anderen App, für die Termin-Auswahl
  myName: null,
  search: '',
  activeDiffFilters: new Set(),
  hasUnsavedChanges: false,
  offlineMode: false,
  offlineCachedAt: null,
  modal: null // {type:'add-tour'|'edit-tour'|'add-hut'|'edit-hut'|'tour-detail'|'hut-detail'|'name'|'add-agenda', payload}
};

function markUnsaved(){ state.hasUnsavedChanges = true; }
function markSaved(){ state.hasUnsavedChanges = false; }

function showToast(message, isError){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, isError ? 5000 : 2500);
}

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' + d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateOnly(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
}

/* ================= Data loading ================= */
/* ================= Lokaler Offline-Cache ================= */
function cacheLocalSnapshot(){
  try{
    localStorage.setItem('firnspur-cache', JSON.stringify({
      tours: state.tours, huts: state.huts, agenda: state.agenda, cachedAt: new Date().toISOString()
    }));
  }catch(e){ /* z. B. Safari privater Modus – dann halt kein Offline-Cache */ }
}
function loadLocalSnapshot(){
  try{
    const raw = localStorage.getItem('firnspur-cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function migrateCompletions(item){
  if(!Array.isArray(item.completions)){
    item.completions = (item.completed && (item.completedBy || item.completedDate))
      ? [{by: item.completedBy || '?', date: item.completedDate || null}]
      : [];
  }
  return item;
}

async function loadAll(){
  state.loading = true; render();
  const [toursObj, hutsObj, agendaObj] = await Promise.all([ fbGet('tours'), fbGet('huts'), fbGet(AGENDA_PATH) ]);

  if(!toursObj && !hutsObj && !agendaObj){
    // Keine Verbindung zur Datenbank – auf lokalen Offline-Cache zurückgreifen
    const cached = loadLocalSnapshot();
    state.loading = false;
    if(cached){
      state.tours = (cached.tours || []).map(migrateCompletions);
      state.huts = (cached.huts || []).map(migrateCompletions);
      state.agenda = cached.agenda || [];
      state.offlineMode = true;
      state.offlineCachedAt = cached.cachedAt;
      showToast('Offline – zeigt den zuletzt gespeicherten Stand vom ' + fmtDate(cached.cachedAt), true);
    }else{
      showToast('Konnte nicht mit der Datenbank verbinden. Prüfe deine Internetverbindung.', true);
    }
    render();
    return;
  }

  const tours = (toursObj ? Object.values(toursObj) : []).filter(t=>t && t.id).map(migrateCompletions);
  const huts = (hutsObj ? Object.values(hutsObj) : []).filter(h=>h && h.id).map(migrateCompletions);
  const agenda = (agendaObj ? Object.values(agendaObj) : []).filter(a=>a && a.id).map(migrateAgendaStatus);
  tours.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  huts.sort((a,b)=> a.name.localeCompare(b.name, 'de'));

  // Lokale, noch nicht synchronisierte Einträge beim Neuladen nicht verlieren
  const unsyncedTours = state.tours.filter(x=>x._unsynced && !tours.find(y=>y.id===x.id));
  const unsyncedHuts = state.huts.filter(x=>x._unsynced && !huts.find(y=>y.id===x.id));
  const unsyncedAgenda = state.agenda.filter(x=>x._unsynced && !agenda.find(y=>y.id===x.id));

  state.tours = [...unsyncedTours, ...tours];
  state.huts = [...unsyncedHuts, ...huts];
  state.agenda = [...unsyncedAgenda, ...agenda];
  state.loading = false;
  state.offlineMode = false;
  render();
}

function mergeImportedData(json){
  let data;
  try{ data = JSON.parse(json); }
  catch(e){ throw new Error('Das eingefügte Format ist kein gültiges JSON.'); }
  const importedTours = Array.isArray(data.tours) ? data.tours : [];
  const importedHuts = Array.isArray(data.huts) ? data.huts : [];
  let addedTours = 0, updatedTours = 0, addedHuts = 0, updatedHuts = 0;
  importedTours.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    migrateCompletions(t);
    const idx = state.tours.findIndex(x=>x.id===t.id);
    if(idx>=0){ state.tours[idx] = t; updatedTours++; }
    else { state.tours.unshift(t); addedTours++; }
  });
  importedHuts.forEach(h=>{
    if(!h || !h.id || !h.name) return;
    migrateCompletions(h);
    const idx = state.huts.findIndex(x=>x.id===h.id);
    if(idx>=0){ state.huts[idx] = h; updatedHuts++; }
    else { state.huts.push(h); addedHuts++; }
  });
  // importierte Einträge auch in die Cloud schreiben, damit sie für alle sichtbar werden
  importedTours.forEach(t=> saveTourCloud(t).catch(()=>markUnsaved()));
  importedHuts.forEach(h=> saveHutCloud(h).catch(()=>markUnsaved()));
  return {addedTours, updatedTours, addedHuts, updatedHuts};
}

  const btnId = formId==='tour-form' ? 'tour-save-btn' : 'hut-save-btn';
  const btn = document.getElementById(btnId);
  if(btn){
    btn.disabled = busy;
    if(busy){ btn.dataset.origText = btn.textContent; btn.textContent = 'Speichert…'; }
    else if(btn.dataset.origText){ btn.textContent = btn.dataset.origText; }
  }
}

function showFormError(formId, message){
  const form = document.getElementById(formId);
  if(!form) return;
  let box = form.querySelector('.form-error');
  if(!box){
    box = document.createElement('div');
    box.className = 'form-error';
    const actions = form.querySelector('.form-actions');
    if(actions) form.insertBefore(box, actions);
    else form.appendChild(box);
  }
  box.textContent = message;
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ================= Agenda ================= */
function fmtDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtWeekday(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('de-CH', {weekday:'short'});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isPastAgendaItem(item){
  const ref = item.endDate || item.startDate;
  if(!ref) return false;
  return ref < todayStr();
}

/* ================= Agenda: Status-Workflow ================= */
const AGENDA_STATUS_ORDER = ['idee','termin-gesucht','geplant','bestaetigt','abgesagt','durchgefuehrt'];
const AGENDA_STATUS_LABELS = {
  'idee':'Idee', 'termin-gesucht':'Termin gesucht', 'geplant':'Geplant',
  'bestaetigt':'Bestätigt', 'abgesagt':'Abgesagt', 'durchgefuehrt':'Durchgeführt'
};
function migrateAgendaStatus(a){
  if(!a.status){
    a.status = a.cancelled ? 'abgesagt' : (isPastAgendaItem(a) ? 'durchgefuehrt' : 'geplant');
  }
  return a;
}

function agendaViewHtml(){
  const groups = {};
  AGENDA_STATUS_ORDER.forEach(s=> groups[s] = []);
  state.agenda.forEach(a=>{ (groups[a.status] || groups['geplant']).push(a); });
  const descStatuses = ['abgesagt','durchgefuehrt'];
  AGENDA_STATUS_ORDER.forEach(s=>{
    groups[s].sort((a,b)=> descStatuses.includes(s)
      ? (b.startDate||'').localeCompare(a.startDate||'')
      : (a.startDate||'').localeCompare(b.startDate||''));

  return `

async function submitAgendaForm(form){
  const startDate = form.startDate;
  if(!startDate){ showFormError('agenda-form', 'Bitte ein Startdatum wählen.'); return; }
  let tourName = '';
  if(form.tourChoice && form.tourChoice!=='custom'){
    const [src, refId] = form.tourChoice.split(':');
    const list = src==='own' ? state.tours : state.otherAppTours;
    const ref = list.find(t=>t.id===refId);
    tourName = ref ? ref.name : (form.customName||'').trim();
  }else{
    tourName = (form.customName||'').trim();
  }
  if(!tourName){ showFormError('agenda-form', 'Bitte eine Tour auswählen oder einen Vorschlag eintragen.'); return; }

  const a = {
    id: uid('a'), createdBy: state.myName, createdAt: new Date().toISOString(),
    type: form.type||'ski', startDate, endDate: form.endDate||'',
    tourName, meetingPoint: form.meetingPoint||'', note: form.note||'',
    participants: [{by: state.myName, joinedAt: new Date().toISOString()}],
    status: 'geplant'
  };
  state.agenda.unshift(a);
  closeModal();
  state.modal = {type:'agenda-detail', payload:a.id};
  render();
  const ok = await saveAgendaCloud(a).catch(()=>false);
  a._unsynced = !ok;
  if(!ok){ markUnsaved(); showToast('Termin lokal gespeichert, aber nicht synchronisiert.', true); }
  else{ showToast('Termin vorgeschlagen.'); }
  render();
}

async function toggleParticipation(id){
  ensureName(async ()=>{
    const a = state.agenda.find(x=>x.id===id);
    if(!a) return;
    a.participants = a.participants || [];
    const idx = a.participants.findIndex(p=>p.by===state.myName);
    if(idx>=0) a.participants.splice(idx,1);
    else a.participants.push({by: state.myName, joinedAt: new Date().toISOString()});
    render();
    const ok = await saveAgendaCloud(a).catch(()=>false);
    a._unsynced = !ok;
    if(!ok) markUnsaved();
    render();
  });
}

async function setAgendaStatus(id, status){
  const a = state.agenda.find(x=>x.id===id);
  if(!a || !AGENDA_STATUS_ORDER.includes(status)) return;
  a.status = status;
  render();
  const ok = await saveAgendaCloud(a).catch(()=>false);
  a._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}

/* ================= Abgeschlossen view ================= */
function buildPersonGroups(){
  const groups = {};
  state.tours.forEach(t=>{
    (t.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].tours.find(x=>x.id===t.id)) groups[name].tours.push(t);
    });
  });
  state.huts.forEach(h=>{
    (h.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].huts.find(x=>x.id===h.id)) groups[name].huts.push(h);
    });
  });
  return groups;
}

function abgeschlossenViewHtml(){
  const groups = buildPersonGroups();
  const names = Object.keys(groups);
  if(!names.length){
    return `<div class="empty">
      <h3>Noch nichts als abgeschlossen markiert</h3>
      <p>Öffne eine Tour oder Hütte und tippe auf "Als abgeschlossen markieren", um sie hier zu sammeln.</p>
    </div>`;
  }
  names.sort((a,b)=>{
    if(state.myName){
      if(a===state.myName) return -1;
      if(b===state.myName) return 1;
    }
    return a.localeCompare(b, 'de');
  });
  return names.map(name=>{
    const g = groups[name];
    const isMe = state.myName && name===state.myName;
    const total = g.tours.length + g.huts.length;
    return `<div class="detail-section" style="margin-bottom:28px;">
      <h4>${isMe ? '⭐ Meine Liste' : esc(name)} (${total})</h4>
      ${g.tours.length ? `<div class="grid" style="margin-top:6px;">${g.tours.map(tourCardHtml).join('')}</div>` : ''}
      ${g.huts.length ? `<div class="grid" style="margin-top:${g.tours.length?12:6}px;">${g.huts.map(hutCardHtml).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function openCompleteTour(id){

function openCompleteHut(id){
  state.modal = {type:'complete-hut', payload:id};
  render();

async function submitCompleteTour(id, name, date){
  const t = state.tours.find(x=>x.id===id);
  if(!t) return;
  if(!Array.isArray(t.completions)) t.completions = [];
  t.completions.push({by: (name||'').trim() || state.myName, date: date});
  t.completed = true;
  t.updatedAt = new Date().toISOString();
  t.updatedBy = state.myName;
  state.modal = {type:'tour-detail', payload:id};
  render();
  const ok = await saveTourCloud(t).catch(()=>false);
  t._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}
async function submitCompleteHut(id, name, date){
  const h = state.huts.find(x=>x.id===id);
  if(!h) return;
  if(!Array.isArray(h.completions)) h.completions = [];
  h.completions.push({by: (name||'').trim() || state.myName, date: date});
  h.completed = true;
  h.updatedAt = new Date().toISOString();
  h.updatedBy = state.myName;
  state.modal = {type:'hut-detail', payload:id};
  render();
  const ok = await saveHutCloud(h).catch(()=>false);
  h._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}
async function removeCompletion(kind, id, idx){
  const item = kind==='tour' ? state.tours.find(x=>x.id===id) : state.huts.find(x=>x.id===id);
  if(!item || !Array.isArray(item.completions)) return;
  item.completions.splice(idx, 1);
  item.completed = item.completions.length > 0;
  item.updatedAt = new Date().toISOString();
  item.updatedBy = state.myName;
  render();
  const saveFn = kind==='tour' ? saveTourCloud : saveHutCloud;
  const ok = await saveFn(item).catch(()=>false);
  item._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}

/* ================= Event wiring ================= */
function wireGlobalHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act');
    if(act==='view-touren') el.onclick = ()=>setView('touren');
    else if(act==='view-huetten') el.onclick = ()=>setView('huetten');
    else if(act==='view-agenda') el.onclick = ()=>setView('agenda');
    else if(act==='view-abgeschlossen') el.onclick = ()=>setView('abgeschlossen');
    else if(act==='change-name') el.onclick = ()=>{ state.modal = {type:'name'}; render(); };
    else if(act==='export-data') el.onclick = openExport;
    else if(act==='import-data') el.onclick = openImport;
    else if(act==='add-tour') el.onclick = openAddTour;
    else if(act==='add-hut') el.onclick = openAddHut;
    else if(act==='add-agenda') el.onclick = openAddAgenda;
    else if(act==='open-tour') { el.onclick = ()=>openTourDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openTourDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-hut') { el.onclick = ()=>openHutDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openHutDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-agenda') { el.onclick = ()=>{ state.modal={type:'agenda-detail', payload:el.getAttribute('data-id')}; render(); }; }
    else if(act==='filter-diff') el.onclick = ()=>toggleDiffFilter(el.getAttribute('data-code'));
    else if(act==='search') el.oninput = (e)=>{ state.search = e.target.value; renderListOnly(); };
  });
  app.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });
}

// Lightweight partial re-render for search input to avoid focus loss
function renderListOnly(){
  const main = document.querySelector('main');
  if(!main) return;
  main.innerHTML = state.loading ? `<div class="loading">Lade…</div>` : (state.view==='touren' ? tourenViewHtml() : state.view==='huetten' ? huettenViewHtml() : state.view==='agenda' ? agendaViewHtml() : abgeschlossenViewHtml());
  wireGlobalHandlers();
  const input = main.querySelector('.search-input');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

function wireModalHandlers(){
  const root = document.getElementById('modal-root');
  dlog('Modal gerendert: ' + (state.modal ? state.modal.type : 'keins'));
  const overlay = root.querySelector('.overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  root.querySelectorAll('[data-stop]').forEach(el=> el.addEventListener('click', e=>e.stopPropagation()));

  root.querySelectorAll('[data-act="close-modal"]').forEach(el=> el.onclick = closeModal);

  const openCompleteTourBtn = root.querySelector('[data-act="open-complete-tour"]');
  if(openCompleteTourBtn) openCompleteTourBtn.onclick = ()=> openCompleteTour(openCompleteTourBtn.getAttribute('data-id'));

  if(openCompleteHutBtn) openCompleteHutBtn.onclick = ()=> openCompleteHut(openCompleteHutBtn.getAttribute('data-id'));
  root.querySelectorAll('[data-act="remove-completion"]').forEach(el=>{
    el.onclick = ()=> removeCompletion(el.getAttribute('data-kind'), el.getAttribute('data-id'), parseInt(el.getAttribute('data-idx'), 10));
  });

  const toggleParticipationBtn = root.querySelector('[data-act="toggle-participation"]');
  if(toggleParticipationBtn) toggleParticipationBtn.onclick = ()=> toggleParticipation(toggleParticipationBtn.getAttribute('data-id'));
  root.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });

  const agendaForm = document.getElementById('agenda-form');
  if(agendaForm){
    const tourSelect = document.getElementById('agenda-tour-select');
    const customField = document.getElementById('agenda-custom-field');
    function syncCustomFieldVisibility(){
      customField.style.display = (tourSelect.value==='custom') ? '' : 'none';
    }
    if(tourSelect){ tourSelect.addEventListener('change', syncCustomFieldVisibility); syncCustomFieldVisibility(); }
    const agendaSaveBtn = document.getElementById('agenda-save-btn');
    if(agendaSaveBtn){
      agendaSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        const fd = new FormData(agendaForm);
        const data = Object.fromEntries(fd.entries());
        submitAgendaForm(data);
      });
    }
  }

  const completeBtn = root.querySelector('[data-act="submit-complete"]');
  if(completeBtn) completeBtn.onclick = ()=>{
    const kind = completeBtn.getAttribute('data-kind');
    const id = completeBtn.getAttribute('data-id');
    const name = document.getElementById('complete-name-input').value;
    const date = document.getElementById('complete-date-input').value;
    if(kind==='tour') submitCompleteTour(id, name, date);
    else submitCompleteHut(id, name, date);
  };

  const copyExportBtn = root.querySelector('[data-act="copy-export"]');
  if(copyExportBtn) copyExportBtn.onclick = async ()=>{
    const ta = document.getElementById('export-text');
    try{
      await navigator.clipboard.writeText(ta.value);
      showToast('In Zwischenablage kopiert.');
    }catch(e){
      ta.select();
      showToast('Automatisches Kopieren nicht möglich — Text ist markiert, bitte manuell kopieren.', true);
    }
  };

  const downloadExportBtn = root.querySelector('[data-act="download-export"]');
  if(downloadExportBtn) downloadExportBtn.onclick = ()=>{
    try{
      const ta = document.getElementById('export-text');
      const blob = new Blob([ta.value], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `firnspur-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      markSaved();
      render();
      showToast('Datei heruntergeladen. Jetzt mit deinen Freunden teilen!');
    }catch(e){
      showToast('Download fehlgeschlagen: '+(e&&e.message?e.message:e), true);
    }
  };

  const importFileInput = root.querySelector('#import-file');
  if(importFileInput) importFileInput.addEventListener('change', ()=>{
    const file = importFileInput.files && importFileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ document.getElementById('import-text').value = reader.result; };
    reader.onerror = ()=>{ showToast('Datei konnte nicht gelesen werden.', true); };
    reader.readAsText(file);
  });

  const doImportBtn = root.querySelector('[data-act="do-import"]');
  if(doImportBtn) doImportBtn.onclick = ()=>{
    const val = document.getElementById('import-text').value;
    const errBox = document.getElementById('import-error');
    try{
      const res = mergeImportedData(val);
      closeModal();
      render();
      showToast(`Importiert: ${res.addedTours} neue Touren, ${res.updatedTours} aktualisiert, ${res.addedHuts} neue Hütten, ${res.updatedHuts} aktualisiert.`);
    }catch(e){
      errBox.style.display = 'block';
      errBox.textContent = e.message || 'Import fehlgeschlagen.';
    }
  };
  const submitNameBtn = root.querySelector('[data-act="submit-name"]');
  if(submitNameBtn) submitNameBtn.onclick = ()=>{
    const val = document.getElementById('name-input').value;
    submitName(val);
  };
  const nameInput = document.getElementById('name-input');
  if(nameInput) nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitName(nameInput.value); } });

  const tourForm = document.getElementById('tour-form');
  dlog('tour-form im DOM gefunden: ' + !!tourForm);
  if(tourForm){
    // Gletscher-Chips + automatisches Anhaken von Spaltenrettung bei "Ja"
    const glacierHidden = document.getElementById('glacier-hidden');
    const glacierButtons = tourForm.querySelectorAll('.glacier-chip');
    function checkMaterialCheckbox(name){
      const cb = tourForm.querySelector(`input[name="material"][value="${name}"]`);
      if(!cb || cb.checked) return;
      cb.checked = true;
      const label = cb.closest('label.chip');
      if(label){ label.style.background='var(--ice-deep)'; label.style.color='#fff'; label.style.borderColor='transparent'; }
    }
    glacierButtons.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        glacierButtons.forEach(b=>{ b.classList.remove('on'); b.style.background=''; });
        btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
        if(glacierHidden) glacierHidden.value = btn.getAttribute('data-value');
        if(btn.getAttribute('data-value')==='ja') checkMaterialCheckbox('Spaltenrettung');
      });
    });
    // Region-Chips
    const regionHidden = document.getElementById('region-hidden-input');
    const regionOtherInput = document.getElementById('region-other-input');
    tourForm.querySelectorAll('.region-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        tourForm.querySelectorAll('.region-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        const region = chip.getAttribute('data-region');
        if(region==='__other__'){
          regionOtherInput.style.display = '';
          regionOtherInput.focus();
          regionHidden.value = regionOtherInput.value;
        }else{
          regionOtherInput.style.display = 'none';
          regionHidden.value = region;
        }
      });
    });
    if(regionOtherInput) regionOtherInput.addEventListener('input', ()=>{ regionHidden.value = regionOtherInput.value; });
    // Seil-Chips
    const ropeTypeHidden = document.getElementById('rope-type-hidden');
    tourForm.querySelectorAll('.rope-type-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        tourForm.querySelectorAll('.rope-type-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        ropeTypeHidden.value = chip.getAttribute('data-rope-type');
      });
    });
    const ropeLengthHidden = document.getElementById('rope-length-hidden');
    tourForm.querySelectorAll('.rope-length-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        tourForm.querySelectorAll('.rope-length-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        ropeLengthHidden.value = chip.getAttribute('data-rope-length');
      });
    });

    const tourSaveBtn = document.getElementById('tour-save-btn');
    if(tourSaveBtn){
      tourSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        dlog('Klick auf Tour-Speichern-Button registriert — speichere direkt (ohne Formular-Submit)');
        try{
          const fd = new FormData(tourForm);
          const data = Object.fromEntries(fd.entries());
          data.material = fd.getAll('material');
          data.exposition = fd.getAll('exposition');
          data.gefahren = fd.getAll('gefahren');
          if(!data.name || !data.name.trim()){
            dlog('Validierung fehlgeschlagen: Name fehlt', 'err');
            showFormError('tour-form', 'Bitte einen Namen für die Tour eingeben (ganz oben im Formular).');
            return;
          }
          dlog('Validierung ok, rufe submitTourForm auf für "'+data.name+'"');
          submitTourForm(data, state.modal.payload);
        }catch(err){
          dlog('Unerwarteter Fehler beim Speichern: '+(err && err.message ? err.message : err), 'err');
          showFormError('tour-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
  }

  const hutForm = document.getElementById('hut-form');
  if(hutForm){
    const hutSaveBtn = document.getElementById('hut-save-btn');
    if(hutSaveBtn){
      hutSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        dlog('Klick auf Hütte-Speichern-Button registriert — speichere direkt (ohne Formular-Submit)');
        try{
          const fd = new FormData(hutForm);
          const data = Object.fromEntries(fd.entries());
          if(!data.name || !data.name.trim()){
            dlog('Validierung fehlgeschlagen: Name fehlt', 'err');
            showFormError('hut-form', 'Bitte einen Namen für die Hütte eingeben (ganz oben im Formular).');
            return;
          }
          dlog('Validierung ok, rufe submitHutForm auf für "'+data.name+'"');
          submitHutForm(data, state.modal.payload);
        }catch(err){
          dlog('Unerwarteter Fehler beim Speichern: '+(err && err.message ? err.message : err), 'err');
          showFormError('hut-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
  }

  // Dezente Löschen-Funktion mit zweistufiger Bestätigung (Tour & Hütte)
  function wireDeleteConfirm(prefix, removeFn, onDeletedGoTo){
    const trigger = document.getElementById(`delete-${prefix}-trigger`);
    const confirmBox = document.getElementById(`delete-${prefix}-confirm`);
    const yesBtn = document.getElementById(`delete-${prefix}-yes`);
    const noBtn = document.getElementById(`delete-${prefix}-no`);
    if(!trigger) return;
    trigger.addEventListener('click', ()=>{
      trigger.style.display = 'none';
      confirmBox.style.display = '';
    });
    if(noBtn) noBtn.addEventListener('click', ()=>{
      confirmBox.style.display = 'none';
      trigger.style.display = '';
    });
    if(yesBtn) yesBtn.addEventListener('click', ()=>{
      removeFn(yesBtn.getAttribute('data-id'));
      closeModal();
      showToast(onDeletedGoTo + ' gelöscht.');
    });
  }
  wireDeleteConfirm('tour', removeTour, 'Tour');
  wireDeleteConfirm('hut', removeHut, 'Hütte');

  root.querySelectorAll('[data-act="edit-tour"]').forEach(el=> el.onclick = ()=>openEditTour(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="edit-hut"]').forEach(el=> el.onclick = ()=>openEditHut(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-hut"]').forEach(el=> el.onclick = ()=>openHutDetail(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-tour"]').forEach(el=> el.onclick = ()=>openTourDetail(el.getAttribute('data-id')));
}

/* ================= Global error safety net ================= */
window.addEventListener('error', function(e){
  console.error('Unhandled error', e.error || e.message);
  showToast('Es gab ein unerwartetes Problem: ' + (e.message || 'unbekannter Fehler') + '. Bitte nochmal versuchen.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection', e.reason);
  showToast('Es gab ein unerwartetes Problem beim Speichern. Bitte nochmal versuchen.', true);
});
window.addEventListener('beforeunload', function(e){
  if(state.hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= Init ================= */
try{
  const savedName = localStorage.getItem('firnspur-myname');
  if(savedName) state.myName = savedName;
}catch(e){}
dlog('App gestartet — Version ' + APP_VERSION);
loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      dlog('Service Worker konnte nicht registriert werden (Offline-Modus evtl. eingeschränkt).', 'err');
    });
  });
}
</script>
</body>
</html>
