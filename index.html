        if(!btn) return;
        const wasOn = btn.classList.contains('on');
        hutSubregionChipsWrap.querySelectorAll('.subregion-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){ hutSubregionHidden.value = ''; return; }
        btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
        hutSubregionHidden.value = btn.getAttribute('data-subregion');
      });
    }
  }

  const gebietForm = document.getElementById('gebiet-form');
  if(gebietForm){
    const gebietSaveBtn = document.getElementById('gebiet-save-btn');
    if(gebietSaveBtn){
      gebietSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        try{
          const fd = new FormData(gebietForm);
          const data = Object.fromEntries(fd.entries());
          if(!data.name || !data.name.trim()){
            showFormError('gebiet-form', 'Bitte einen Namen für das Gebiet eingeben.');
            return;
          }
          submitGebietForm(data, state.modal.payload);
        }catch(err){
          showFormError('gebiet-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
    const gebietFabSaveBtn = document.getElementById('gebiet-fab-save-btn');
    if(gebietFabSaveBtn) gebietFabSaveBtn.addEventListener('click', ()=>{ if(gebietSaveBtn) gebietSaveBtn.click(); });

    // Region-Chips (identisch zum Touren-/Hütten-Formular)
    const gebietRegionHidden = document.getElementById('region-hidden-input');
    const gebietRegionOtherInput = document.getElementById('region-other-input');
    const gebietSubregionField = document.getElementById('subregion-field');
    const gebietSubregionChipsWrap = document.getElementById('subregion-chips');
    const gebietSubregionHidden = document.getElementById('subregion-hidden');
    gebietForm.querySelectorAll('.region-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const wasOn = chip.classList.contains('on');
        gebietForm.querySelectorAll('.region-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){
          gebietRegionOtherInput.style.display = 'none';
          gebietRegionOtherInput.value = '';
          gebietRegionHidden.value = '';
          if(gebietSubregionField){ gebietSubregionField.style.display = 'none'; gebietSubregionHidden.value = ''; }
          return;
        }
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        const region = chip.getAttribute('data-region');
        if(region==='__other__'){
          gebietRegionOtherInput.style.display = '';
          gebietRegionOtherInput.focus();
          gebietRegionHidden.value = gebietRegionOtherInput.value;
          if(gebietSubregionField){ gebietSubregionField.style.display = 'none'; gebietSubregionHidden.value = ''; }
        }else{
          gebietRegionOtherInput.style.display = 'none';
          gebietRegionHidden.value = region;
          if(gebietSubregionField && gebietSubregionChipsWrap){
            const subs = REGION_SUBAREAS[region] || [];
            if(subs.length){
              gebietSubregionChipsWrap.innerHTML = renderSubregionChipsHtml(region, '');
              gebietSubregionHidden.value = '';
              gebietSubregionField.style.display = '';
            }else{
              gebietSubregionField.style.display = 'none';
              gebietSubregionHidden.value = '';
            }
          }
        }
      });
    });
    if(gebietRegionOtherInput) gebietRegionOtherInput.addEventListener('input', ()=>{ gebietRegionHidden.value = gebietRegionOtherInput.value; });
    if(gebietSubregionChipsWrap){
      gebietSubregionChipsWrap.addEventListener('click', (e)=>{
        const btn = e.target.closest('.subregion-chip');
        if(!btn) return;
        const wasOn = btn.classList.contains('on');
        gebietSubregionChipsWrap.querySelectorAll('.subregion-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){ gebietSubregionHidden.value = ''; return; }
        btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
        gebietSubregionHidden.value = btn.getAttribute('data-subregion');
      });
    }
  }

  // Dezente Löschen-Funktion mit zweistufiger Bestätigung (Tour & Hütte)
  function wireDeleteConfirm(prefix, removeFn, message){
    const trigger = document.getElementById(`delete-${prefix}-trigger`);
    const confirmBox = document.getElementById(`delete-${prefix}-confirm`);
    const yesBtn = document.getElementById(`delete-${prefix}-yes`);
    const noBtn = document.getElementById(`delete-${prefix}-no`);
    if(!trigger) return;
    trigger.addEventListener('click', ()=>{
      trigger.style.display = 'none';
      confirmBox.style.display = '';
    });
    if(noBtn) noBtn.addEventListener('click', ()=>{
      confirmBox.style.display = 'none';
      trigger.style.display = '';
    });
    if(yesBtn) yesBtn.addEventListener('click', ()=>{
      removeFn(yesBtn.getAttribute('data-id'));
      closeModal(false, true);
      showToast(message);
    });
  }
  // Tour/Hütte landen nur im Papierkorb (siehe removeTour/removeHut -> moveToTrash), Termine
  // werden weiterhin sofort und endgültig entfernt (rein persönliche Planung, kein geteilter Inhalt).
  wireDeleteConfirm('tour', removeTour, `Tour in den Papierkorb verschoben (${TRASH_RETENTION_DAYS} Tage wiederherstellbar).`);
  wireDeleteConfirm('hut', removeHut, `Hütte in den Papierkorb verschoben (${TRASH_RETENTION_DAYS} Tage wiederherstellbar).`);
  wireDeleteConfirm('gebiet', removeGebiet, `Gebiet in den Papierkorb verschoben (${TRASH_RETENTION_DAYS} Tage wiederherstellbar).`);
  wireDeleteConfirm('agenda', removeAgendaItem, 'Termin gelöscht.');

  root.querySelectorAll('[data-act="edit-tour"]').forEach(el=> el.onclick = ()=>openEditTour(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="export-tour"]').forEach(el=> el.onclick = ()=>openTourExport(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="edit-hut"]').forEach(el=> el.onclick = ()=>openEditHut(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-hut"]').forEach(el=> el.onclick = ()=>openHutDetail(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-tour"]').forEach(el=> el.onclick = ()=>openTourDetail(el.getAttribute('data-id')));

  root.querySelectorAll('[data-act="add-access-route"]').forEach(el=> el.onclick = ()=>{
    navigateToModal({type:'edit-access-route', payload:{hutId: el.getAttribute('data-hut-id'), route:null}});
    render();
  });
  root.querySelectorAll('[data-act="open-access-route"]').forEach(el=> el.onclick = ()=>{
    const hutId = el.getAttribute('data-hut-id');
    const routeId = el.getAttribute('data-route-id');
    const hut = state.huts.find(h=>h.id===hutId);
    const route = hut && hut.accessRoutes ? hut.accessRoutes.find(r=>r.id===routeId) : null;
    if(!route) return;
    navigateToModal({type:'access-route-detail', payload:{hutId, route}});
    render();
  });
  root.querySelectorAll('[data-act="edit-access-route"]').forEach(el=> el.onclick = ()=>{
    const hutId = el.getAttribute('data-hut-id');
    const routeId = el.getAttribute('data-route-id');
    const hut = state.huts.find(h=>h.id===hutId);
    const route = hut && hut.accessRoutes ? hut.accessRoutes.find(r=>r.id===routeId) : null;
    if(!route) return;
    navigateToModal({type:'edit-access-route', payload:{hutId, route}});
    render();
  });
  root.querySelectorAll('[data-act="show-access-route-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-target');
      let track = [], manualTrack = [];
      try{ track = JSON.parse(btn.getAttribute('data-track') || '[]'); }catch(e){ track = []; }
      try{ manualTrack = JSON.parse(btn.getAttribute('data-manual-track') || '[]'); }catch(e){ manualTrack = []; }
      renderTrackDisplayMap(target, [], track, manualTrack);
    });
  });
}

/* ================= Global error safety net ================= */
window.addEventListener('error', function(e){
  console.error('Unhandled error', e.error || e.message);
  showToast('Es gab ein unerwartetes Problem: ' + (e.message || 'unbekannter Fehler') + '. Bitte nochmal versuchen.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection', e.reason);
  showToast('Es gab ein unerwartetes Problem beim Speichern. Bitte nochmal versuchen.', true);
});
window.addEventListener('beforeunload', function(e){
  if(state.hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= Init ================= */
try{
  const savedName = localStorage.getItem('firnspur-myname');
  if(savedName) state.myName = savedName;
}catch(e){}
loadAuthFromStorage();
cleanupExpiredOfflineDownloads();
wireAppSwitchSwipe('./fixseil.html');
const emergencyTab = document.getElementById('emergency-btn');
emergencyTab.addEventListener('click', toggleEmergencyCard);
let emergencySwipeStart = null;
emergencyTab.addEventListener('touchstart', (e)=>{
  emergencySwipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, {passive:true});
emergencyTab.addEventListener('touchend', (e)=>{
  if(!emergencySwipeStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - emergencySwipeStart.x;
  const dy = t.clientY - emergencySwipeStart.y;
  emergencySwipeStart = null;
  // Wegziehen nach rechts oder nach unten öffnet die Karte (kein erneutes Schliessen per Wisch, nur per Klick/erneutem Antippen)
  if((dx > 35 || dy > 35) && !(state.modal && state.modal.type==='emergency')){
    state.modal = {type:'emergency'}; render();
  }
});
document.getElementById('agenda-tab-btn').addEventListener('click', ()=>setView('agenda'));

if(isLoggedIn()){
  dlog('App gestartet — Version ' + APP_VERSION);
  loadAll();
  if(state.myName) loadFavorites();
}else{
  document.getElementById('app').innerHTML = loginScreenHtml();
  wireLoginScreen();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      dlog('Service Worker konnte nicht registriert werden (Offline-Modus evtl. eingeschränkt).', 'err');
    });
  });
}
</script>
</body>
