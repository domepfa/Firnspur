<!DOCTYPE html>
<html lang="de" data-disc="ski">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firnspur — Skitour</title>
<meta name="apple-mobile-web-app-title" content="Firnspur β">
<meta name="application-name" content="Firnspur β">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="theme-color" content="#F3F6F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E9F1F4;
    --paper:#FFFFFF;
    --ink:#1B2A33;
    --ink-soft:#5B6B73;
    --ink-faint:#8B9AA1;
    --ice:#2E6E8E;
    --ice-deep:#1F4D63;
    --ice-light:#D9E9EF;
    --signal:#F2B705;
    --signal-deep:#C99400;
    --line:#DFD8C8;
    --danger:#B0392C;
    --ok:#3C7A52;
    --shadow: 0 2px 10px rgba(27,42,51,0.08);
    --shadow-lg: 0 12px 32px rgba(27,42,51,0.16);
    --radius: 3px;

    --d-L:#5FA8D3;
    --d-WS:#2E7EB0;
    --d-ZS:#C9A227;
    --d-S:#D97B3E;
    --d-SS:#C2452D;
    --d-AS:#8A2E2E;
    --d-EX:#2B1416;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Manrope', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'Manrope', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--ice-deep);}

  /* ===== App-Umschalter ===== */
  .app-switch-bar{
    background:var(--ink); display:flex; justify-content:center; gap:0;
  }
  .app-switch-bar a, .app-switch-bar button{
    color:rgba(255,255,255,0.55); text-decoration:none; font-size:13.5px; font-weight:700;
    letter-spacing:0.03em; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; flex:1; max-width:220px; text-transform:uppercase;
    border-bottom:3px solid transparent; transition:background .12s ease, color .12s ease;
    background:none; border-left:none; border-right:none; border-top:none; font-family:inherit; cursor:pointer;
  }
  .app-switch-bar a:hover, .app-switch-bar button:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .app-switch-bar a.active{color:#fff; border-bottom-color:var(--signal, #F2B705); background:rgba(255,255,255,0.06);}

  /* ===== Skyline hero ===== */
  .hero{
    color:#fff;
    padding:28px 20px 34px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image: url('./20260114_145500.jpg');
    background-size: 115%;
    background-position: center 55%;
    filter: brightness(1.25) contrast(1.05);
    z-index:0;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(31,77,99,0.55) 0%, rgba(46,110,142,0.35) 55%, rgba(76,147,172,0.22) 100%);
    z-index:0;
  }
  .hero-top, .hero .tabs{ position:relative; z-index:1; }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:44px; color:#fff; letter-spacing:1px; font-weight:800;}
  .brand .tag{font-family:'Source Sans 3'; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ice-light); font-style:italic;}
  .who{
    font-size:13px; color:var(--ice-light); text-align:right;
  }
  .who-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .who button{
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:12px; margin-left:6px;
  }
  .who button:hover{background:rgba(255,255,255,0.15);}
  .skyline{width:100%; height:64px; display:block; margin-top:22px;}

  /* ===== Signpost tabs ===== */
  .tabs{
    max-width:1000px; margin:0 auto; padding:0 20px;
    transform:translateY(20px);
    position:relative; z-index:2;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs-inner{
    display:flex; gap:14px; width:max-content; margin:0 auto;
  }
  .route-waypoint-label{ background:none; border:none; box-shadow:none; color:#fff; font-weight:700; font-size:11px; }
  .tab{
    background:none; border:none; box-shadow:none; clip-path:none;
    color:rgba(255,255,255,0.62);
    font-family:'Manrope'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    font-size:14px;
    padding:10px 14px 8px 14px;
    border-bottom:2px solid transparent;
    flex-shrink:0; white-space:nowrap;
  }
  .tab.active{color:#fff; border-bottom-color:var(--signal, #F2B705);}
  .tab:hover{color:#fff;}

  main{max-width:1000px; margin:0 auto; padding:40px 20px 80px 20px;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-input{
    flex:1; min-width:180px;
    padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .btn{
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ice-deep);
    background:var(--ice-deep); color:#fff; font-weight:600; font-size:14px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ice);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.secondary:hover{background:var(--ice-light);}
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--ice-deep); outline-offset:2px;}

  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .sort-control{display:flex; align-items:center; gap:6px;}
  .sort-control select{
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px;
    font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .sort-dir-btn{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff;
    width:32px; height:32px; font-size:15px; cursor:pointer; color:var(--ink);
  }
  .sort-dir-btn:hover{background:var(--ice-light);}
  .chip{
    padding:4px 10px; border-radius:16px; border:1px solid var(--line);
    background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.3;
  }
  .chip.on{color:#fff; border-color:transparent;}

  /* ===== Cards ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ice-light); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-left-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); cursor:pointer; border-left-color:var(--ice);}
  /* Verhindert auf jeder Karte, dass ein Long-Press das native Text-Auswählen/den iOS-Callout
     ("Kopieren"-Menü etc.) auslöst — das äussert sich sonst nur als Vibration ohne sichtbare
     Wirkung, ohne dass die Karte reagiert. */
  .card, .card *{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .agenda-date-row{
    font-family:'Manrope'; text-transform:uppercase; letter-spacing:0.03em;
    font-weight:700; font-size:15px; color:var(--ice-deep); margin-bottom:2px;
  }
  .card h3{font-size:17px; color:var(--ink); line-height:1.25;}
  .badge{
    flex-shrink:0; font-family:'Manrope'; font-weight:700; font-size:12px;
    color:#fff; padding:3px 8px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
  .stat-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft);}
  .stat-row .mono{color:var(--ink); font-weight:600;}
  .card p.excerpt{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .hut-link-chip{
    align-self:flex-start; font-size:12px; background:var(--ice-light); color:var(--ice-deep);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .conditions-note{
    font-size:12.5px; background:#FBF3D9; border-left:3px solid var(--signal-deep);
    padding:6px 9px; color:#5B4A00; border-radius:2px;
  }

  /* ===== Karten-Streifen (echte CH-Silhouette/Seen/Relief, fest eingebettet — siehe 0-geo-ch.js,
     kein Leaflet/keine Kacheln, kein Netzwerk beim Öffnen einer Liste) ===== */
  .map-strip{margin-bottom:16px;}
  .map-strip-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .map-strip-label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; font-weight:700;}
  .map-strip-head-actions{display:flex; gap:10px; align-items:baseline;}
  .map-strip-hint{font-size:11px; color:var(--ink-faint); background:none; border:none; padding:0; cursor:pointer;}
  /* Seitenverhältnis der echten CH-Silhouette (siehe GEO_CH_VIEWBOX) statt fixer Höhe, sonst
     stimmt die Skalierung von Kantonen/Seen/Pins nicht mehr zusammen. touch-action:none, damit
     die eigene Pinch/Pan-Geste (wireMapStripCanvases) nicht mit dem nativen Seiten-Scroll kollidiert. */
  .map-strip-canvas{position:relative; aspect-ratio:260/173.9; border-radius:var(--radius); overflow:hidden; background:var(--ice-light); border:1px solid var(--line); touch-action:none; user-select:none;}
  .map-strip-zoomwrap{position:absolute; inset:0; will-change:transform;}
  .map-strip-bg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .map-strip-cantons path{fill:none; stroke:var(--ink-faint); stroke-width:0.35; stroke-opacity:0.55;}
  .map-strip-lakes path{fill:#5B84A0; opacity:0.8;}
  .map-strip-compass{position:absolute; top:7px; left:7px; font-size:9px; color:var(--ink-faint); font-weight:700; display:flex; flex-direction:column; align-items:center; gap:1px; z-index:1;}
  .map-strip-compass .n{width:0; height:0; border-left:3px solid transparent; border-right:3px solid transparent; border-bottom:5px solid var(--ink-faint);}
  /* transform (translate -50%/-50% + Gegen-Skalierung 1/Zoom) kommt inline pro Pin aus
     mapStripHtml() -- Pins/Popups bleiben dadurch beim Reinzoomen lesbar konstant gross,
     nur ihr Abstand zueinander wächst (genau das trennt geclusterte Punkte wieder). */
  .map-strip-pin{position:absolute; z-index:2;}
  .map-strip-dot{width:12px; height:12px; border-radius:50%; background:var(--ice-deep); border:2px solid var(--paper); box-shadow:0 0 0 1px var(--line); padding:0; cursor:pointer;}
  .map-strip-pin.open .map-strip-dot{background:var(--signal-deep);}
  .map-strip-cluster-dot{width:26px; height:26px; border-radius:50%; background:var(--signal-deep); border:2px solid var(--paper); box-shadow:0 0 0 1px var(--line); padding:0; cursor:pointer; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .map-strip-cluster.open .map-strip-cluster-dot{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ice-deep);}
  .map-strip-nlabel{position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:700; color:var(--ink); white-space:nowrap; background:rgba(255,255,255,0.82); padding:1px 5px; border-radius:8px; pointer-events:none;}
  .map-strip-popup{position:absolute; top:20px; left:50%; transform:translateX(-50%); background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:8px 10px; display:flex; flex-direction:column; gap:5px; width:132px; z-index:3;}
  .map-strip-popup strong{font-size:12.5px; color:var(--ice-deep);}
  .map-strip-popup button{font-size:11px; color:var(--ice-deep); font-weight:700; background:none; border:none; padding:0; text-align:left; cursor:pointer;}
  .map-strip-popup-list{width:170px;}
  .map-strip-popup-list button{padding:3px 0; border-bottom:1px solid var(--line);}
  .map-strip-popup-list button:last-child{border-bottom:none;}
  .map-strip-empty{position:relative; z-index:1; display:flex; align-items:center; justify-content:center; height:100%; font-size:12.5px; color:var(--ink-faint); text-align:center; padding:0 16px; pointer-events:none;}
  .meta-line{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty h3{color:var(--ink); font-size:18px; margin-bottom:8px;}
  .empty .btn{margin-top:16px;}

  /* ===== Legend ===== */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .legend .chip{cursor:default; display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(20,30,36,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); width:100%; max-width:620px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:28px; margin:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px;}
  .modal-head h2{font-size:22px;}
  .x-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; padding:2px 6px;}
  .x-btn:hover{color:var(--ink);}

  .field{margin-bottom:9px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:3px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .fab-save{
    position:fixed; bottom:20px; right:20px; z-index:70;
    background:var(--ice-deep); color:#fff; border:none; border-radius:50px;
    padding:14px 24px; font-weight:700; font-size:14px; box-shadow:var(--shadow-lg);
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .fab-save:hover{background:var(--ice);}
  .fab-save[disabled]{opacity:0.6; cursor:default;}
  .emergency-tab{
    position:fixed; top:50%; left:0; transform:translateY(-50%); z-index:70;
    background:var(--danger); color:#fff; border:none;
    padding:12px 5px; border-radius:0 8px 8px 0;
    font-family:'Manrope'; font-size:11px; font-weight:700; letter-spacing:0.08em;
    writing-mode:vertical-rl; text-orientation:mixed;
    box-shadow:var(--shadow); cursor:pointer; opacity:0.72;
    touch-action:none;
  }
  .emergency-tab:hover{opacity:1;}
  /* Agenda gilt für alle drei Kategorien (Skitour/Hochtour/MSL) gleichermassen — deshalb bewusst
     nicht als weiterer Tab in der oberen Kategorie-Leiste, sondern als eigener, dezenter Zugang
     am rechten Rand (spiegelbildlich zum SOS-Tab links), von überall aus erreichbar. */
  .agenda-tab{
    position:fixed; top:50%; right:0; transform:translateY(-50%); z-index:70;
    background:var(--ink); color:#fff; border:none;
    padding:12px 5px; border-radius:8px 0 0 8px;
    font-family:'Manrope'; font-size:11px; font-weight:700; letter-spacing:0.08em;
    writing-mode:vertical-rl; text-orientation:mixed;
    box-shadow:var(--shadow); cursor:pointer; opacity:0.72;
    touch-action:none;
  }
  .agenda-tab:hover, .agenda-tab.active{opacity:1;}
  .agenda-tab.active{background:var(--ice-deep);}

  /* ===== Detail panel ===== */
  .detail-badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{
    font-family:'Manrope'; text-transform:uppercase; font-size:13px; letter-spacing:0.05em;
    color:var(--ice-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  }
  .detail-section p{font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap; margin:0;}
  .detail-stats{display:flex; gap:22px; flex-wrap:wrap; margin:14px 0;}
  .detail-stat .num{font-family:'Manrope'; font-size:20px; font-weight:700; color:var(--ink);}
  .detail-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .detail-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#FBEAE7;}

  .cond-box{background:var(--ice-light); border-radius:var(--radius); padding:12px; margin-top:14px;}
  .cond-box textarea{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13.5px; min-height:44px;}
  .cond-box .meta-line{margin-top:6px;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-family:'Manrope'; letter-spacing:0.05em; text-transform:uppercase; font-size:13px;}

  .form-error{
    background:#FBEAE7; border:1px solid var(--danger); color:#7A2A1F;
    padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ice-deep); color:#fff; padding:11px 20px; border-radius:20px;
    font-size:13.5px; box-shadow:var(--shadow-lg); z-index:100; max-width:90%; text-align:center;
  }
  .toast.error{background:var(--danger);}
  .btn[disabled]{opacity:0.6; cursor:default;}

  .backup-banner{
    background:#B0392C; color:#fff; padding:12px 20px; text-align:center;
    font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:80;
  }
  .backup-banner button{
    background:#fff; color:#B0392C; border:none; border-radius:20px; padding:6px 16px;
    font-weight:700; font-size:13px;
  }

  .debug-toggle{
    display:none;
    position:fixed; bottom:16px; right:16px; z-index:90;
    background:var(--ink); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12px; font-family:'Manrope'; opacity:0.55;
    box-shadow:var(--shadow);
  }
  .debug-panel{
    position:fixed; bottom:60px; right:16px; left:16px; max-width:520px; margin:0 auto;
    max-height:50vh; overflow-y:auto; background:#12181C; color:#D7E4E9;
    border-radius:var(--radius); padding:12px; font-family:'Manrope'; font-size:11.5px;
    z-index:91; box-shadow:var(--shadow-lg); line-height:1.5;
  }
  .debug-panel .row{border-bottom:1px solid #2A343B; padding:4px 0;}
  .debug-panel .row.err{color:#FF8A75;}
  .debug-panel .row.ok{color:#8FD9A8;}
  .debug-panel .head{display:flex; justify-content:space-between; margin-bottom:6px;}
  .debug-panel .head button{background:none; border:1px solid #445; color:#D7E4E9; border-radius:4px; padding:2px 8px; font-size:11px;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .brand h1{font-size:32px;}
    .hero{padding-bottom:30px;}
    .tabs{transform:translateY(16px);}
    .tab{padding:8px 16px 8px 14px; font-size:12.5px;}
  }
</style>
<link rel="stylesheet" href="./look.css">
</head>
<body>
<div class="app-switch-bar">
  <a href="./index.html" class="active">🎿 Skitour</a>
  <a href="./fixseil.html">🏔️ Hochtour</a>
  <a href="./fixseil.html?view=msl">🧗 Klettern</a>
  <a href="./wandern.html">🥾 Wandern</a>
</div>
<div id="app"></div>
<button class="emergency-tab" id="emergency-btn">SOS</button>

function cacheLocalSnapshot(){
  try{
    localStorage.setItem('firnspur-cache', JSON.stringify({
      tours: state.tours, huts: state.huts, gebiete: state.gebiete,
      trashedTours: state.trashedTours, trashedHuts: state.trashedHuts, trashedGebiete: state.trashedGebiete,
      agenda: state.agenda, cachedAt: new Date().toISOString()
    }));
  }catch(e){ /* z. B. Safari privater Modus – dann halt kein Offline-Cache */ }
}
function loadLocalSnapshot(){
  try{
    const raw = localStorage.getItem('firnspur-cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}


async function loadAll(){
  state.loading = true; render();
  const [toursObj, hutsObj, gebieteObj, agendaObj] = await Promise.all([ fbGet('tours'), fbGet('huts'), fbGet('gebiete'), fbGet(AGENDA_PATH) ]);
  const cached = loadLocalSnapshot();

  if(!toursObj && !hutsObj && !gebieteObj && !agendaObj){
    // Keine Verbindung zur Datenbank – auf lokalen Offline-Cache zurückgreifen
    state.loading = false;
    if(cached){
      state.tours = (cached.tours || []).map(migrateCompletions);
      state.huts = (cached.huts || []).map(migrateCompletions);
      state.gebiete = cached.gebiete || [];
      state.trashedTours = cached.trashedTours || [];
      state.trashedHuts = cached.trashedHuts || [];
      state.trashedGebiete = cached.trashedGebiete || [];
      state.agenda = cached.agenda || [];
      state.offlineMode = true;
      state.offlineCachedAt = cached.cachedAt;
      showToast('Offline – zeigt den zuletzt gespeicherten Stand vom ' + fmtDate(cached.cachedAt), true);
    }else{
      showToast('Konnte nicht mit der Datenbank verbinden. Prüfe deine Internetverbindung.', true);
    }
    render();
    checkSharedContent().then(shared=>{ if(shared) openShareImportModal(shared); });
    return;
  }

  const toursSplit = splitTrash(toursObj), hutsSplit = splitTrash(hutsObj), gebieteSplit = splitTrash(gebieteObj);
  const tours = toursSplit.active.map(migrateCompletions);
  const trashedTours = toursSplit.trashed.map(migrateCompletions);
  const huts = hutsSplit.active.map(migrateCompletions);
  const trashedHuts = hutsSplit.trashed.map(migrateCompletions);
  const gebiete = gebieteSplit.active;
  const trashedGebiete = gebieteSplit.trashed;
  const agenda = (agendaObj ? Object.values(agendaObj) : []).filter(a=>a && a.id).map(migrateAgendaStatus);
  tours.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  huts.sort((a,b)=> a.name.localeCompare(b.name, 'de'));
  gebiete.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'de'));
  trashedTours.sort((a,b)=> (b.deletedAt||'').localeCompare(a.deletedAt||''));
  trashedHuts.sort((a,b)=> (b.deletedAt||'').localeCompare(a.deletedAt||''));
  trashedGebiete.sort((a,b)=> (b.deletedAt||'').localeCompare(a.deletedAt||''));

  // Lokale, noch nicht synchronisierte Einträge nicht verlieren — sowohl aus dem
  // aktuellen Speicher als auch aus dem lokalen Cache (wichtig nach einem
  // Seiten-Neuladen, da der Speicher dann leer ist, der Cache aber nicht).
  const unsyncedTours = dedupeById([
    ...state.tours.filter(x=>x._unsynced),
    ...((cached && cached.tours) ? cached.tours.filter(x=>x._unsynced) : [])
  ]).filter(x=> fsKeepUnsynced(x, tours, 'tours'));
  const unsyncedHuts = dedupeById([
    ...state.huts.filter(x=>x._unsynced),
    ...((cached && cached.huts) ? cached.huts.filter(x=>x._unsynced) : [])
  ]).filter(x=> fsKeepUnsynced(x, huts, 'huts'));
  const unsyncedGebiete = dedupeById([
    ...state.gebiete.filter(x=>x._unsynced),
    ...((cached && cached.gebiete) ? cached.gebiete.filter(x=>x._unsynced) : [])
  ]).filter(x=> fsKeepUnsynced(x, gebiete, 'gebiete'));
  const unsyncedAgenda = dedupeById([
    ...state.agenda.filter(x=>x._unsynced),
    ...((cached && cached.agenda) ? cached.agenda.filter(x=>x._unsynced) : [])
  ]).filter(x=> fsKeepUnsynced(x, agenda, AGENDA_PATH));

  state.tours = [...unsyncedTours, ...tours];
  state.huts = [...unsyncedHuts, ...huts];
  state.gebiete = [...unsyncedGebiete, ...gebiete];
  state.trashedTours = trashedTours;
  state.trashedHuts = trashedHuts;
  state.trashedGebiete = trashedGebiete;
  state.agenda = [...unsyncedAgenda, ...agenda];
  // Fehlende Einträge aus dem Gerätespeicher retten, bevor dieser überschrieben wird
  fsRescueCollect('firnspur', ['firnspur-cache', 'firnspur' + 'beta-cache']);
  state.loading = false;
  state.offlineMode = false;
  // Einmal pro Ladevorgang: Papierkorb-Einträge, deren Aufbewahrungsfrist abgelaufen ist, endgültig
  // entfernen (siehe TRASH_RETENTION_DAYS in 0-shared.js).
  purgeExpiredTrash(state.trashedTours, 'tours');
  purgeExpiredTrash(state.trashedHuts, 'huts');
  purgeExpiredTrash(state.trashedGebiete, 'gebiete');
  render();
  checkSharedContent().then(shared=>{ if(shared) openShareImportModal(shared); });

  // Wiedergefundene, noch nicht synchronisierte Einträge jetzt automatisch
  // erneut versuchen hochzuladen, da offenbar wieder eine Verbindung besteht.
  unsyncedTours.forEach(async t=>{
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(ok) render();
  });
  unsyncedHuts.forEach(async h=>{
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(ok) render();
  });
  unsyncedGebiete.forEach(async g=>{
    const ok = await saveGebietCloud(g).catch(()=>false);
    g._unsynced = !ok;
    if(ok) render();
  });
  unsyncedAgenda.forEach(async a=>{
    const ok = await saveAgendaCloud(a).catch(()=>false);
    a._unsynced = !ok;
    if(ok) render();
  });
}

// Von der Übersichtskarte aus per "Punkt setzen" — siehe pointPlacementPopupContent in 0-shared.js.
// Öffnet eine der "frei verlinkbaren" Detailansichten (Tour/Hütte) — diese sind von überall aus
// erreichbar, auch per Cross-Link aus einer ANDEREN bereits offenen Detailansicht heraus (z. B.
// eine Tour direkt aus der Hütten-Detailansicht öffnen). War bereits eine Ansicht offen, merkt
// sich modalBackStack diese, damit closeModal() beim Schliessen genau eine Ebene zurückfällt statt
// direkt ganz auf die Übersicht. Jeder Eintrag ist mit dem Typ der neu geöffneten Ansicht markiert,
// damit er nie versehentlich beim Schliessen einer später unabhängig geöffneten Ansicht desselben
// Typs verwendet wird (siehe closeModal()).
function mergeImportedData(json){
  let data;
  try{ data = JSON.parse(json); }
  catch(e){ throw new Error('Das eingefügte Format ist kein gültiges JSON.'); }
  const importedTours = fsImportPrep(data.tours, 't');
  const importedHuts = fsImportPrep(data.huts, 'h');
  const importedAgenda = fsImportPrep(data.agenda, 'a', 'tourName');
  let addedTours = 0, updatedTours = 0, addedHuts = 0, updatedHuts = 0, addedAgenda = 0, updatedAgenda = 0;
  fsImportConfirm([['Touren', importedTours, state.tours], ['Hütten', importedHuts, state.huts], ['Termine', importedAgenda, state.agenda]]);
  importedTours.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    migrateCompletions(t);
    const idx = state.tours.findIndex(x=>x.id===t.id);
    if(idx>=0){ Object.assign(t, fsImportMerge(state.tours[idx], t)); state.tours[idx] = t; updatedTours++; }
    else { state.tours.unshift(t); addedTours++; }
  });
  importedHuts.forEach(h=>{
    if(!h || !h.id || !h.name) return;
    migrateCompletions(h);
    const idx = state.huts.findIndex(x=>x.id===h.id);
    if(idx>=0){ Object.assign(h, fsImportMerge(state.huts[idx], h)); state.huts[idx] = h; updatedHuts++; }
    else { state.huts.push(h); addedHuts++; }
  });
  importedAgenda.forEach(a=>{
    if(!a || !a.id || !a.tourName) return;
    const idx = state.agenda.findIndex(x=>x.id===a.id);
    if(idx>=0){ Object.assign(a, fsImportMerge(state.agenda[idx], a)); state.agenda[idx] = a; updatedAgenda++; }
    else { state.agenda.unshift(a); addedAgenda++; }
  });
  // importierte Einträge auch in die Cloud schreiben, damit sie für alle sichtbar werden
  importedTours.forEach(t=> saveTourCloud(t).catch(()=>markUnsaved()));
  importedHuts.forEach(h=> saveHutCloud(h).catch(()=>markUnsaved()));
  importedAgenda.forEach(a=> saveAgendaCloud(a).catch(()=>markUnsaved()));
  return {addedTours, updatedTours, addedHuts, updatedHuts, addedAgenda, updatedAgenda};
}

async function submitTourForm(form, existing){
  // Stand vor dem Speichern — für "Rückgängig" im Hinweis danach.
  const undoPrev = snapshotForUndo(existing && existing.id ? state.tours.find(x=>x.id===existing.id) : null);
  const t = (existing && existing.id) ? {...existing} : {id: (form.tourIdForTrack || uid('t')), createdBy: state.myName, createdAt: new Date().toISOString(), conditions:null, status:'entwurf'};
  t.name = form.name.trim();
  t.routeName = form.routeName || '';
  t.difficulty = form.difficulty;
  t.targetAltitude = form.targetAltitude;
  t.elevationGain = form.elevationGain;
  t.elevationLoss = form.elevationLoss;
  t.duration = form.duration;
  t.region = form.region;
  t.subregion = form.subregion || '';
  t.material = form.material || [];
  t.exposition = form.exposition || [];
  t.gefahren = form.gefahren || [];
  t.ropeType = form.ropeType || '';
  t.glacier = form.glacier || 'nein';
  t.ropeLength = form.ropeLength || '';
  t.hutId = form.hutId || '';
  t.gebietId = form.gebietId || '';
  t.tourLink = form.tourLink;
  t.gpxLink = form.gpxLink || '';
  fsApplyLinksFromForm(t, form, existing);
  try{ t.trackSimplified = form.trackSimplified ? JSON.parse(form.trackSimplified) : null; }catch(e){ t.trackSimplified = null; }
  try{ t.manualTrack = form.manualTrack ? JSON.parse(form.manualTrack) : []; }catch(e){ t.manualTrack = []; }
  const routeUploads = fsApplyRoutesFromForm(t, form, existing);
  t.crux = form.crux;
  t.special = form.special;
  t.approach = form.approach;
  t.approachTypes = Array.isArray(form.approachTypes) ? form.approachTypes : [];
  t.stayTypes = Array.isArray(form.stayTypes) ? form.stayTypes : [];
  try{ t.points = form.points ? JSON.parse(form.points) : []; }catch(e){ t.points = []; }
  t.ascent = form.ascent;
  t.descent = form.descent;
  if(form.status==='entwurf' || form.status==='vollstaendig') t.status = form.status;
  t.updatedAt = new Date().toISOString();
  t.updatedBy = state.myName;

  const idx = state.tours.findIndex(x=>x.id===t.id);
  if(idx>=0) state.tours[idx] = t; else state.tours.unshift(t);
  closeModal(false, true, true);
  state.modal = {type:'tour-detail', payload:t.id};
  render();

  const ok = await saveTourCloud(t).catch(()=>false);
  t._unsynced = !ok;
  if(routeUploads.length) Promise.all(routeUploads).then(r=>{ if(r.some(x=>x===false)) showToast('Eine GPX-Originaldatei konnte nicht gespeichert werden (Internet?).', true); });
  // Aus der swisstopo-Skitourenebene übernommen: Original-GPX ablegen (für "GPX herunterladen")
  if(existing && existing._fsPendingGpx && t.trackSimplified){
    const pg = existing._fsPendingGpx;
    fbSet(GPX_TRACKS_PATH + '/' + t.id, { gpx: buildGpxXml(pg.coords, pg.name), uploadedAt: new Date().toISOString(), fileName: (pg.name || 'track') + '.gpx' }).catch(()=>{});
  }
  if(!ok){
    markUnsaved();
    showToast('Tour ist lokal gespeichert, konnte aber nicht synchronisiert werden. Prüfe deine Internetverbindung.', true);
  }else{
    offerUndoAfterSave('Tour gespeichert.', state.tours, undoPrev, saveTourCloud);
  }
  render();
}

function filteredTours(){
  let list = state.tours;
  if(state.onlyFavorites) list = list.filter(t=>isFavorite(t.id));
  if(state.activeDiffFilters.size){
    list = list.filter(t=>state.activeDiffFilters.has(t.difficulty));
  }
  if(state.activeRegionFilters.size){
    list = list.filter(t=>state.activeRegionFilters.has(t.region));
  }
  if(state.activeApproachTypeFilters.size){
    list = list.filter(t=>(t.approachTypes||[]).some(v=>state.activeApproachTypeFilters.has(v)));
  }
  if(state.activeStayTypeFilters.size){
    list = list.filter(t=>(t.stayTypes||[]).some(v=>state.activeStayTypeFilters.has(v)));
  }
  if(state.activeStatusFilters.size){
    list = list.filter(t=>state.activeStatusFilters.has(t.status||'entwurf'));
  }
  if(state.activeGlacierFilter){
    list = list.filter(t=>t.glacier===state.activeGlacierFilter);
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(t=> (t.name||'').toLowerCase().includes(q) || (t.region||'').toLowerCase().includes(q) || (t.subregion||'').toLowerCase().includes(q));
  }
  return sortTours(list);
}

        <div class="field"><label>Gipfel / Bergmassiv *</label><input required name="name" value="${esc(t.name||'')}" placeholder="z. B. Titlis"/></div>
        <div class="field"><label>Route</label><input name="routeName" value="${esc(t.routeName||'')}" placeholder="z. B. von Engstlenalp"/></div>
      </div>
      <div class="field"><label>Schwierigkeit (SAC)</label>
        <select name="difficulty">
          <option value="" ${!t.difficulty?'selected':''}>— keine Angabe —</option>
          ${DIFF_ORDER.map(c=>`<option value="${c}" ${t.difficulty===c?'selected':''}>${c} — ${DIFF[c].label}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Region</label>
        <div class="chips" id="region-chips">
          ${REGIONS.map(r=>`<button type="button" class="chip region-chip ${t.region===r?'on':''}" style="${t.region===r?'background:var(--ice-deep)':''}" data-region="${r}">${r}</button>`).join('')}
          <button type="button" class="chip region-chip ${t.region && !isKnownRegion?'on':''}" style="${t.region && !isKnownRegion?'background:var(--ice-deep)':''}" data-region="__other__">Anderes</button>
        </div>
        <input type="text" id="region-other-input" value="${!isKnownRegion?esc(t.region||''):''}" placeholder="eigene Region eintragen" style="margin-top:8px; ${t.region && !isKnownRegion?'':'display:none;'}"/>
        <input type="hidden" name="region" id="region-hidden-input" value="${esc(t.region||'')}"/>
      </div>
      <div class="field" id="subregion-field" style="${(isKnownRegion && REGION_SUBAREAS[t.region])?'':'display:none;'}">
        <label>Teilgebiet / Pass (optional)</label>
        <div class="chips" id="subregion-chips">${renderSubregionChipsHtml(t.region, t.subregion)}</div>
        <input type="hidden" name="subregion" id="subregion-hidden" value="${esc(t.subregion||'')}"/>
      </div>
      <div class="field"><label>Gletscher</label>
        <div class="chips">
          <button type="button" class="chip glacier-chip ${t.glacier==='ja'?'on':''}" style="${t.glacier==='ja'?'background:var(--ice-deep)':''}" data-value="ja">Ja</button>
          <button type="button" class="chip glacier-chip ${(t.glacier||'nein')==='nein'?'on':''}" style="${(t.glacier||'nein')==='nein'?'background:var(--ice-deep)':''}" data-value="nein">Nein</button>
        </div>
        <input type="hidden" name="glacier" id="glacier-hidden" value="${esc(t.glacier||'nein')}"/>
      </div>
      <div class="field"><label>Exposition</label>
        <div class="chips">
          ${EXPOSITIONS.map(x=>`<button type="button" class="chip exposition-chip ${selectedExposition.includes(x)?'on':''}" style="${selectedExposition.includes(x)?'background:var(--ice-deep)':''}" data-value="${x}">${x}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Gefahren</label>
        <div class="chips">
          ${GEFAHREN_SKI.map(g=>`<button type="button" class="chip gefahren-chip ${selectedGefahren.includes(g)?'on':''}" style="${selectedGefahren.includes(g)?'background:var(--ice-deep)':''}" data-value="${g}">${g}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Material</label>
        <div class="chips">
          ${MATERIAL.map(m=>`<button type="button" class="chip material-chip ${selectedMaterial.includes(m)?'on':''}" style="${selectedMaterial.includes(m)?'background:var(--ice-deep)':''}" data-value="${m}">${m}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Seil – Typ</label>
        <div class="chips" id="rope-type-chips">
          ${ROPE_TYPES_SKI.map(r=>`<button type="button" class="chip rope-type-chip ${t.ropeType===r?'on':''}" style="${t.ropeType===r?'background:var(--ice-deep)':''}" data-rope-type="${r}">${r}</button>`).join('')}
        </div>
        <input type="hidden" name="ropeType" id="rope-type-hidden" value="${esc(t.ropeType||'')}"/>
      </div>
      <div class="field"><label>Seil – Länge</label>
        <div class="chips" id="rope-length-chips">
          ${ROPE_LENGTHS_SKI.map(r=>`<button type="button" class="chip rope-length-chip ${t.ropeLength===r?'on':''}" style="${t.ropeLength===r?'background:var(--ice-deep)':''}" data-rope-length="${r}">${r}</button>`).join('')}
        </div>
        <input type="hidden" name="ropeLength" id="rope-length-hidden" value="${esc(t.ropeLength||'')}"/>
      </div>
      <div class="row2">
        <div class="field"><label>Ziel – Gipfelhöhe (m ü. M.)</label><input name="targetAltitude" value="${esc(t.targetAltitude||'')}" placeholder="z. B. 3020"/></div>
        <div class="field"><label>Zeitbedarf (h)</label><input name="duration" value="${esc(t.duration||'')}" placeholder="z. B. 4–5"/></div>
      </div>
      <div class="row2">
        <div class="field"><label>Aufstieg (Hm)</label><input name="elevationGain" value="${esc(t.elevationGain||'')}" placeholder="z. B. 1200"/></div>
        <div class="field"><label>Abfahrt (Hm, falls abweichend)</label><input name="elevationLoss" value="${esc(t.elevationLoss||'')}" placeholder="z. B. 1600"/></div>
      </div>
      <div class="field"><label>Link zur Tour</label><input type="url" name="tourLink" id="tour-link-input" value="${esc(t.tourLink||'')}" placeholder="https://www.camptocamp.org/..."/>
        <button type="button" class="btn secondary" id="camptocamp-search-toggle-btn" style="margin-top:8px;">🔍 Auf Camptocamp.org suchen</button>
        <div id="camptocamp-search-box" style="margin-top:10px; display:none;"></div>
      </div>
      <div class="field"><label>Link zu einer GPX-Datei (optional)</label><input type="url" name="gpxLink" value="${esc(t.gpxLink||'')}" placeholder="https://.../track.gpx"/></div>
      ${fsMoreLinksFieldHtml(t)}
      <div class="field" id="fs-tracks-field"><label>GPX-Tracks &amp; Routen</label>
        <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml" hidden/>
        <input type="hidden" name="trackSimplified" id="track-simplified-hidden" value='${esc(t.trackSimplified ? JSON.stringify(t.trackSimplified) : "")}'/>
        <input type="hidden" name="tourIdForTrack" id="tour-id-for-track" value="${esc(t.id||'')}"/>
        ${fsRoutesEditorHtml(t)}
        <p id="gpx-upload-status" class="fs-gpx-status"></p>
      </div>
      <div class="field"><label>Schlüsselstelle</label><textarea name="crux" placeholder="z. B. steile Rinne kurz vor dem Gipfel, ausgesetzte Querung …">${esc(t.crux||'')}</textarea></div>
      <div class="field"><label>Spezielles</label><textarea name="special" placeholder="Lawinenhänge, Gletscherspalten, beste Jahreszeit …">${esc(t.special||'')}</textarea></div>
      <div class="field"><label>Aufstieg</label><textarea name="ascent" placeholder="Route, Orientierungspunkte, Gefahrenstellen …">${esc(t.ascent||'')}</textarea></div>
      <div class="field"><label>Art der Anfahrt</label>
        <div class="chips" id="approach-type-chips">
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('auto')?'on':''}" style="${(t.approachTypes||[]).includes('auto')?'background:var(--ice-deep)':''}" data-value="auto">🚗 Auto</button>
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('oev')?'on':''}" style="${(t.approachTypes||[]).includes('oev')?'background:var(--ice-deep)':''}" data-value="oev">🚌 ÖV</button>
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('seilbahn')?'on':''}" style="${(t.approachTypes||[]).includes('seilbahn')?'background:var(--ice-deep)':''}" data-value="seilbahn">🚡 Seilbahn</button>
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('zufuss')?'on':''}" style="${(t.approachTypes||[]).includes('zufuss')?'background:var(--ice-deep)':''}" data-value="zufuss">🥾 Zu Fuss</button>
        </div>
      </div>
      <div class="field"><label>Ausgangspunkt / Aufenthalt</label>
        <div class="chips" id="stay-type-chips">
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('tagestour')?'on':''}" style="${(t.stayTypes||[]).includes('tagestour')?'background:var(--ice-deep)':''}" data-value="tagestour">☀️ Tagestour</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('huette')?'on':''}" style="${(t.stayTypes||[]).includes('huette')?'background:var(--ice-deep)':''}" data-value="huette">🛖 Hütte</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('biwak')?'on':''}" style="${(t.stayTypes||[]).includes('biwak')?'background:var(--ice-deep)':''}" data-value="biwak">⛺ Biwak</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('zelt')?'on':''}" style="${(t.stayTypes||[]).includes('zelt')?'background:var(--ice-deep)':''}" data-value="zelt">🏕️ Zelt</button>
        </div>
      </div>
      <div class="field"><label>Anfahrt — Details</label><textarea name="approach" placeholder="Ausgangspunkt, Parkplatz, ÖV …">${esc(t.approach||'')}</textarea></div>
      <div class="field"><label>Punkte &amp; Linie auf der Karte (Parkplatz, Haltestelle, geplante Route …)</label>
        <button type="button" class="btn secondary" id="points-map-toggle-btn">🗺️ Karte öffnen</button>
        <div class="hint">📍 Punkt setzen: antippen, Bezeichnung eintragen, speichern. ✏️ Linie zeichnen: antippen fügt Wegpunkte zur blauen Linie hinzu.</div>
        <div id="points-map" style="margin-top:10px; display:none;"></div>
        <div id="points-list"></div>
        <input type="hidden" name="points" id="points-hidden" value='${esc(JSON.stringify(t.points || (t.lat && t.lon ? [{label:"Ausgangspunkt", lat:t.lat, lon:t.lon}] : [])))}'/>
        <input type="hidden" name="manualTrack" id="manual-track-hidden" value='${esc(JSON.stringify(t.manualTrack || []))}'/>
      </div>
      <div class="field"><label>Abstieg</label><textarea name="descent" placeholder="Abfahrtsroute, Varianten …">${esc(t.descent||'')}</textarea></div>
      <div class="field"><label>Verknüpfte Hütte</label>
        <select name="hutId"><option value="">— keine —</option>${hutOptions}</select>
        <div class="hint">Fehlt die Hütte? Erst unter „Hütten“ anlegen, dann hier verlinken.</div>
      </div>
      <div class="field"><label>Gebiet (optional)</label>
        <select name="gebietId"><option value="">— keins —</option>${state.gebiete.map(g=>`<option value="${g.id}" ${t.gebietId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>
        <div class="hint">Fasst Touren &amp; Hütten derselben Region zusammen. Fehlt das Gebiet? Erst unter „Gebiete“ anlegen.</div>
      </div>
      <div class="field"><label>Status</label>
        <select name="status">
          <option value="entwurf" ${(!t.status || t.status==='entwurf')?'selected':''}>📝 Entwurf</option>
          <option value="vollstaendig" ${t.status==='vollstaendig'?'selected':''}>✅ Vollständig</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn secondary" data-act="close-modal">Abbrechen</button>
        <button type="button" id="tour-save-btn" class="btn">${isEditing?'Speichern':'Tour anlegen'}</button>
      </div>
      <button type="button" id="tour-fab-save-btn" class="fab-save">✓ Speichern</button>
      ${isEditing ? `
      <div id="delete-tour-zone" style="margin-top:22px; padding-top:16px; border-top:1px solid var(--line); text-align:right;">
        <button type="button" id="delete-tour-trigger" data-id="${t.id}" style="background:none; border:none; color:var(--ink-faint); font-size:12.5px; text-decoration:underline; cursor:pointer;">Tour löschen</button>
        <div id="delete-tour-confirm" style="display:none; margin-top:10px; font-size:13px; color:var(--danger);">
          In den Papierkorb verschieben (${TRASH_RETENTION_DAYS} Tage wiederherstellbar)?
          <button type="button" id="delete-tour-yes" data-id="${t.id}" class="btn danger" style="padding:5px 12px; font-size:12.5px; margin-left:8px;">Ja, löschen</button>
          <button type="button" id="delete-tour-no" style="background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; margin-left:6px;">Abbrechen</button>
        </div>
      </div>` : ''}
    </form>
  </div>`;
}

// "Gipfelziel" gibt es in der Skitour-App nicht als eigene Entität wie bei Hochtour/MSL —
// das Feld "Gipfel / Bergmassiv" (t.name) übernimmt diese Rolle direkt. Touren mit demselben
// Namen (trim/ohne Grossschreibung) werden als Routen zum selben Gipfel behandelt.

// Führt die Punkte/Tracks ALLER Touren mit demselben Gipfelziel auf einer Karte zusammen,
// jede Route in eigener Farbe — analog zur Sektor-/Klettergebiet-Übersichtskarte in der
// Hochtour/MSL-App, hier aber anhand des gemeinsamen Gipfel-/Bergmassiv-Namens gruppiert.

function tourDetailHtml(id){
  const t = state.tours.find(x=>x.id===id);
  if(!t) return `<div class="modal" data-stop="1"><p>Tour nicht gefunden.</p></div>`;
  const d = t.difficulty ? DIFF[t.difficulty] : null;
  const hut = t.hutId ? state.huts.find(h=>h.id===t.hutId) : null;
  const gebiet = t.gebietId ? state.gebiete.find(g=>g.id===t.gebietId) : null;
  return `<div class="modal td fs-onroute" data-stop="1">
    <div class="modal-head">
      <div>
        <div class="detail-badge-row">
        ${d ? `<span class="badge" style="background:${d.color}">${t.difficulty} · ${d.label}</span>` : `<span class="badge" style="background:var(--ink-faint)">unbewertet</span>`}
        ${t.targetAltitude ? `<span class="badge" style="background:var(--ice-deep)">${esc(t.targetAltitude)} m ü. M.</span>` : ''}
      </div>
        <h2 style="color:var(--ice-deep);">${esc(t.name)}</h2>
      </div>
      <div style="display:flex; align-items:flex-start; gap:4px;">
        ${favoriteToggleButtonHtml(t.id)}
        ${editIconButtonHtml('edit-tour', t.id)}
        <button class="x-btn" data-act="close-modal">×</button>
      </div>
    </div>
    ${t.routeName ? `<h2 style="margin:0 0 6px 0; color:var(--ink-soft);">${esc(t.routeName)}</h2>` : ''}
    ${t.region ? `<p style="color:var(--ink-soft); font-size:14px; margin:0 0 6px 0;">${esc(t.region)}${t.subregion ? ' – ' + esc(t.subregion) : ''}</p>` : ''}
    <p class="fs-status-line" style="font-size:13px; color:var(--ink-soft); margin:0 0 10px 0;">${tourStatusLabel(t)}</p>
    <div class="detail-stats">
      <div class="detail-stat"><div class="num">${esc(t.elevationGain||'–')}</div><div class="lbl">Hm Aufstieg</div></div>
      ${t.elevationLoss ? `<div class="detail-stat"><div class="num">${esc(t.elevationLoss)}</div><div class="lbl">Hm Abfahrt</div></div>` : ''}
      ${t.duration ? `<div class="detail-stat"><div class="num">${esc(t.duration)} h</div><div class="lbl">Zeitbedarf</div></div>` : ''}
    </div>
    ${tourGlanceHtml(t.crux, [
      ['Gefahren', (t.gefahren||[]).join(', ')],
      ['Exposition', (t.exposition||[]).join(', ')],
      ['Gletscher', t.glacier==='ja' ? 'Ja' : ''],
      ['Material', (t.material||[]).join(', ')],
      ['Seil', [t.ropeType, t.ropeLength].filter(Boolean).join(' · ')]
    ])}
    ${(hut || gebiet || t.tourLink || fsMoreLinksList(t).length) ? `<div class="fs-links">
      ${fsTourLinkChipHtml(t.tourLink)}${fsMoreLinksChipsHtml(t)}
      ${hut ? `<button class="hut-link-chip" style="border:none; cursor:pointer;" data-act="open-hut" data-id="${hut.id}">🛖 Zur Hütte: ${esc(hut.name)}</button>` : ''}
      ${gebiet ? `<button class="hut-link-chip" style="border:none; cursor:pointer;" data-act="open-gebiet" data-id="${gebiet.id}">⛰️ Zum Gebiet: ${esc(gebiet.name)}</button>` : ''}
    </div>` : ''}
    ${t.special ? `<div class="detail-section"><h4>Spezielles</h4><p>${esc(t.special)}</p></div>` : ''}
    ${t.ascent ? `<div class="detail-section"><h4>Aufstieg</h4><p>${esc(t.ascent)}</p></div>` : ''}
    ${t.descent ? `<div class="detail-section"><h4>Abfahrt</h4><p>${esc(t.descent)}</p></div>` : ''}
    ${((t.approachTypes && t.approachTypes.length) || (t.stayTypes && t.stayTypes.length) || t.approach) ? `<div class="detail-section">
      <h4>Anfahrt</h4>
      ${((t.approachTypes && t.approachTypes.length) || (t.stayTypes && t.stayTypes.length)) ? `<div class="chips" style="margin-bottom:8px;">
        ${(t.approachTypes||[]).map(v=>`<span class="chip" style="background:var(--ice-light); border-color:transparent;">${APPROACH_TYPE_LABELS[v]}</span>`).join('')}
        ${(t.stayTypes||[]).map(v=>`<span class="chip" style="background:var(--ice-light); border-color:transparent;">${STAY_TYPE_LABELS[v]}</span>`).join('')}
      </div>` : ''}
      ${t.approach ? `<p>${esc(t.approach)}</p>` : ''}
    </div>` : ''}
    ${fsTravelHtml(t)}
    <!-- Wetter nach den Infos (Spezielles, Aufstieg, Anfahrt sind beim Planen wichtiger) -->
    ${(t.points && t.points.length) ? `<div id="tour-meteo-${t.id}">${meteoForecastWidgetHtml(t.points[0].lat, t.points[0].lon, t.targetAltitude)}</div>` : ''}
    <div class="detail-section" id="tour-map-section-${t.id}">
      <h4>${fsTourRoutes(t).length ? 'Routen & Standorte' : 'Standort' + (t.points && t.points.length>1?'e':'')}</h4>
      ${(t.points && t.points.length) ? `<div class="chips" style="margin-bottom:8px;">${t.points.map(p=>`<span class="chip" data-act="fs-point-goto" data-lat="${p.lat}" data-lon="${p.lon}" data-label="${esc(p.label||'Punkt')}" role="button" tabindex="0" style="background:var(--ice-light); border-color:transparent; cursor:pointer;">${(MAP_POINT_CATEGORIES[p.category||'']||MAP_POINT_CATEGORIES['']).icon} ${esc(p.label||'Punkt')}</span>`).join('')}</div>` : ''}
      ${fsRoutesListHtml(t)}
      ${(t.points && t.points.length || t.trackSimplified || (t.manualTrack && t.manualTrack.length) || (t.altTracks && t.altTracks.length)) ? `<button type="button" class="btn secondary" style="margin-top:8px;" data-act="show-map" data-points='${esc(JSON.stringify(t.points||[]))}' data-track='${esc(JSON.stringify(t.trackSimplified||[]))}' data-manual-track='${esc(JSON.stringify(t.manualTrack||[]))}' data-alt-tracks='${esc(JSON.stringify(t.altTracks||[]))}' data-offline-id="${t.id}" data-target="map-tour-${t.id}">🗺️ Karte anzeigen</button>` : ''}
      <div id="map-tour-${t.id}" style="margin-top:10px;"></div>
      <button type="button" class="btn secondary" style="margin-top:8px;" id="quick-edit-toggle-${t.id}" data-act="quick-edit-toggle" data-id="${t.id}" data-kind="tour" title="Gedrückt halten, um die Karte zu bearbeiten">Karte bearbeiten</button>
      <div id="quick-edit-list-${t.id}"></div>
      <input type="hidden" id="quick-points-hidden-${t.id}" value='${esc(JSON.stringify(t.points||[]))}'/>
      <input type="hidden" id="quick-manual-track-hidden-${t.id}" value='${esc(JSON.stringify(t.manualTrack||[]))}'/>
      <input type="hidden" id="quick-track-simplified-hidden-${t.id}" value='${esc(t.trackSimplified ? JSON.stringify(t.trackSimplified) : "")}'/>
      <div class="fs-quick-bar" style="display:none;" id="quick-save-btn-${t.id}">
        <button type="button" class="btn secondary" data-act="quick-discard" data-id="${t.id}">Verwerfen</button>
        <button type="button" class="btn" data-act="quick-save" data-id="${t.id}" data-kind="tour">Speichern</button>
      </div>
    </div>
    ${t.gpxLink ? `<div class="detail-section">
      <h4>GPX-Link</h4>
      <p style="margin:0 0 8px 0;"><a href="${esc(t.gpxLink)}" target="_blank" rel="noopener noreferrer">${esc(t.gpxLink)}</a></p>
    </div>` : ''}
    <!-- Aktionen nach den Infos: geplant und angeschaut wird häufiger als heruntergeladen -->
    ${tourActionsHtml(t, [
      t.trackSimplified ? fsMenuItemHtml('download', 'GPX herunterladen', `data-act="download-gpx" data-id="${t.id}" data-name="${esc(t.name)}"`) : '',
      (!t.trackSimplified && t.manualTrack && t.manualTrack.length) ? fsMenuItemHtml('download', 'Route als GPX', `data-act="download-manual-gpx" data-track='${esc(JSON.stringify(t.manualTrack))}' data-name="${esc(t.name)}"`) : '',
      fsMenuItemHtml('upload', 'Exportieren / teilen', `data-act="export-tour" data-id="${t.id}"`),
      fsMenuItemHtml('check', 'Als abgeschlossen markieren', `data-act="open-complete-tour" data-id="${t.id}"`)
    ])}
    ${(() => { const related = findToursSharingPoints(t, state.tours, 300); return related.length ? `<div class="detail-section">
      <h4>Weitere Touren ab hier (${related.length})</h4>
      <div class="grid" style="margin-top:6px;">${related.map(tourCardHtml).join('')}</div>
    </div>` : ''; })()}
    ${(() => {
      const sameGipfel = state.tours.filter(x=> x.id!==t.id && gipfelzielKey(x.name)===gipfelzielKey(t.name));
      if(!sameGipfel.length) return '';
      return `<div class="detail-section">
        <h4>🗺️ Weitere Routen auf ${esc(t.name)} (${sameGipfel.length})</h4>
        <p style="font-size:13px; color:var(--ink-soft); margin:0 0 8px 0;">Alle Routen mit diesem Gipfelziel automatisch zusammengeführt — keine erneute Eingabe nötig.</p>
        <div style="margin-bottom:8px;">${gipfelzielLegendHtml(t.name)}</div>
        <button type="button" class="btn secondary" style="margin-bottom:10px;" data-act="show-gipfelziel-overview-map" data-gipfelziel="${esc(t.name)}" data-target="map-gipfelziel-overview-${t.id}">🗺️ Karte anzeigen</button>
        <div id="map-gipfelziel-overview-${t.id}"></div>
        <div class="grid" style="margin-top:10px;">${sameGipfel.map(tourCardHtml).join('')}</div>
      </div>`;
    })()}

    <div class="detail-section">
      <h4>Abgeschlossen von</h4>
      ${(t.completions && t.completions.length) ? `<div class="cond-box" style="display:flex; flex-direction:column; gap:6px;">
        ${t.completions.map((c,idx)=>`<div style="display:flex; justify-content:space-between; align-items:center; font-size:13.5px;">
          <span>✓ ${esc(c.by||'?')}${c.date ? ' · ' + fmtDateOnly(c.date) : ''}</span>
          <button data-act="remove-completion" data-kind="tour" data-id="${t.id}" data-idx="${idx}" style="background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer;">entfernen</button>
        </div>`).join('')}
      </div>` : `<p class="fs-empty" style="margin:0; font-size:13px; color:var(--ink-soft);">Noch niemand hat diese Tour als abgeschlossen markiert.</p>`}
    </div>

    <div class="meta-line" style="margin-top:16px;">Angelegt von ${esc(t.createdBy||'?')} · ${fmtDate(t.createdAt)}${t.updatedAt && t.updatedAt!==t.createdAt ? ` · zuletzt bearbeitet von ${esc(t.updatedBy||'?')} · ${fmtDate(t.updatedAt)}` : ''}</div>

  </div>`;
}

/* ================= Event wiring ================= */
function wireGlobalHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act');
    if(act==='view-touren') el.onclick = ()=>setView('touren');
    else if(act==='view-gebiete') el.onclick = ()=>setView('gebiete');
    else if(act==='view-huetten') el.onclick = ()=>setView('huetten');
    else if(act==='view-abgeschlossen') el.onclick = ()=>setView('abgeschlossen');
    else if(act==='view-papierkorb') el.onclick = ()=>setView('papierkorb');
    else if(act==='restore-trash-item') el.onclick = ()=>restoreTrashItem(el.getAttribute('data-kind'), el.getAttribute('data-id'));
    else if(act==='purge-trash-item') el.onclick = ()=>purgeTrashItem(el.getAttribute('data-kind'), el.getAttribute('data-id'));
    else if(act==='change-name') el.onclick = ()=>{ state.modal = {type:'name'}; render(); };
    else if(act==='export-data') el.onclick = openExport;
    else if(act==='import-data') el.onclick = openImport;
    else if(act==='add-tour') el.onclick = openAddTour;
    else if(act==='add-hut') el.onclick = openAddHut;
    else if(act==='add-gebiet') el.onclick = openAddGebiet;
    else if(act==='open-gebiet') { el.onclick = ()=>openGebietDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openGebietDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-standalone-map') el.onclick = openStandaloneMap;
    else if(act==='map-strip-toggle') el.onclick = ()=>{
      const id = el.getAttribute('data-id');
      const wasOpen = state._mapStripOpenPinId===id;
      mapStripCloseOpenPopups();
      state._mapStripOpenPinId = wasOpen ? null : id;
      render();
    };
    else if(act==='map-strip-cluster') el.onclick = ()=>{
      const clusterKind = el.getAttribute('data-kind'), id = el.getAttribute('data-id');
      if(mapStripGetView(clusterKind).zoom >= MAP_STRIP_ZOOM_MAX - 0.01){
        const wasOpen = state._mapStripOpenClusterId===id;
        mapStripCloseOpenPopups();
        state._mapStripOpenClusterId = wasOpen ? null : id;
      }else{
        mapStripZoomToPoint(clusterKind, el.closest('.map-strip-canvas'), parseFloat(el.getAttribute('data-cx')), parseFloat(el.getAttribute('data-cy')));
        mapStripCloseOpenPopups();
      }
      render();
    };
    else if(act==='map-strip-reset') el.onclick = ()=>{ mapStripResetView(el.getAttribute('data-kind')); state._mapStripOpenClusterId = null; render(); };
    else if(act==='add-agenda') el.onclick = openAddAgenda;
    else if(act==='open-tour') { el.onclick = ()=>openTourDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openTourDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-hut') { el.onclick = ()=>openHutDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openHutDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-agenda') { el.onclick = ()=>openAgendaDetail(el.getAttribute('data-id')); }
    else if(act==='filter-diff') el.onclick = ()=>toggleDiffFilter(el.getAttribute('data-code'));
    else if(act==='filter-region') el.onclick = ()=>toggleRegionFilter(el.getAttribute('data-region'));
    else if(act==='reset-tour-filters') el.onclick = ()=>resetTourFilters();
    else if(act==='filter-approach-type') el.onclick = ()=>toggleApproachTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-stay-type') el.onclick = ()=>toggleStayTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-status') el.onclick = ()=>toggleStatusFilter(el.getAttribute('data-value'));
    else if(act==='filter-glacier') el.onclick = ()=>toggleGlacierFilter(el.getAttribute('data-value'));
    else if(act==='toggle-favorite') el.onclick = (e)=>{ e.stopPropagation(); toggleFavorite(el.getAttribute('data-id')); };
    else if(act==='toggle-only-favorites') el.onclick = ()=>{ state.onlyFavorites = !state.onlyFavorites; render(); };
    else if(act==='filter-hut-region') el.onclick = ()=>toggleHutRegionFilter(el.getAttribute('data-region'));
    else if(act==='filter-hut-diff') el.onclick = ()=>toggleHutDiffFilter(el.getAttribute('data-code'));
    else if(act==='filter-hut-approach-type') el.onclick = ()=>toggleHutApproachTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-hut-staffed-month') el.onclick = ()=>toggleHutStaffedMonthFilter(el.getAttribute('data-month'));
    else if(act==='filter-hut-winterraum-month') el.onclick = ()=>toggleHutWinterraumMonthFilter(el.getAttribute('data-month'));
    else if(act==='reset-hut-filters') el.onclick = ()=>resetHutFilters();
    else if(act==='sort-by') el.onchange = (e)=>{ const kind=el.getAttribute('data-kind'); if(kind==='tour') state.tourSortBy=e.target.value; else state.hutSortBy=e.target.value; renderListOnly(); };
    else if(act==='sort-dir') el.onclick = ()=>{ const kind=el.getAttribute('data-kind'); if(kind==='tour') state.tourSortDir = state.tourSortDir==='asc'?'desc':'asc'; else state.hutSortDir = state.hutSortDir==='asc'?'desc':'asc'; renderListOnly(); };
    else if(act==='search'){
      el.oninput = (e)=>{ state.search = e.target.value; renderListOnly(); };
      // Enter bestätigt die Suche (steckt eh schon live über oninput) und schliesst vor allem
      // die Bildschirmtastatur — ohne blur() bleibt sie sonst offen, obwohl nichts mehr zu tun ist.
      el.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } };
    }
  });
  const tourFilterToggleBtn = app.querySelector('#tour-filter-toggle-btn');
  if(tourFilterToggleBtn){
    tourFilterToggleBtn.addEventListener('click', ()=>{
      state.tourFilterPanelOpen = !state.tourFilterPanelOpen;
      const panel = app.querySelector('#tour-filter-panel');
      if(panel) panel.style.display = state.tourFilterPanelOpen ? '' : 'none';
    });
  }
  const hutFilterToggleBtn = app.querySelector('#hut-filter-toggle-btn');
  if(hutFilterToggleBtn){
    hutFilterToggleBtn.addEventListener('click', ()=>{
      state.hutFilterPanelOpen = !state.hutFilterPanelOpen;
      const panel = app.querySelector('#hut-filter-panel');
      if(panel) panel.style.display = state.hutFilterPanelOpen ? '' : 'none';
    });
  }
  app.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });
  wireMapStripCanvases();
}

// Lightweight partial re-render for search input to avoid focus loss

function wireModalHandlers(){
  const root = document.getElementById('modal-root');
  dlog('Modal gerendert: ' + (state.modal ? state.modal.type : 'keins'));
  syncModalDirtyTracking();
  wireShareImportModal();
  // Erkennt Änderungen an Text-/Auswahlfeldern sowie Chip-Klicks, um beim Verlassen einer
  // Bearbeiten-Maske gezielt nachfragen zu können, ob ungespeicherte Änderungen verworfen
  // werden sollen. Nur einmal verdrahtet (modal-root bleibt über Renders hinweg bestehen).
  if(!root.dataset.dirtyWired){
    root.dataset.dirtyWired = '1';
    root.addEventListener('input', ()=> markModalDirty());
    root.addEventListener('change', ()=> markModalDirty());
    root.addEventListener('click', (e)=>{ if(e.target.closest('button.chip')) markModalDirty(); });
  }
  const overlay = root.querySelector('.overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  root.querySelectorAll('[data-stop]').forEach(el=> el.addEventListener('click', e=>e.stopPropagation()));

  root.querySelectorAll('[data-act="close-modal"]').forEach(el=> el.onclick = ()=> closeModal());
  root.querySelectorAll('[data-act="toggle-favorite"]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); toggleFavorite(el.getAttribute('data-id')); });

  if(state.modal && state.modal.type==='tour-detail'){
    refreshOfflineSectionUI(state.modal.payload);
  }

  // Event-Delegation für Offline-Download/Löschen/GPS — auf .modal, nicht root, da
  // data-stop/stopPropagation() Klicks innerhalb des Fensters bewusst stoppt (siehe Fixseil).
  const modalEl = root.querySelector('.modal');
  if(modalEl) modalEl.addEventListener('click', (e)=>{
    const downloadOfflineBtn = e.target.closest('[data-act="download-offline"]');
    if(downloadOfflineBtn){
      const offlineId = downloadOfflineBtn.getAttribute('data-offline-id');
      const item = state.tours.find(t=>t.id===offlineId);
      if(!item) return;
      const coords = [];
      (item.points||[]).forEach(p=> coords.push([p.lat, p.lon]));
      (item.trackSimplified||[]).forEach(c=> coords.push(c));
      (item.manualTrack||[]).forEach(c=> coords.push(c));
      downloadOfflineBtn.disabled = true;
      downloadOfflineBtn.textContent = 'Wird heruntergeladen… 0%';
      downloadTourOffline(offlineId, item.name, coords, item.topoImages||[], (done,total)=>{
        downloadOfflineBtn.textContent = `Wird heruntergeladen… ${Math.round(done/total*100)}%`;
      }).then(()=>{
        showToast('Für unterwegs heruntergeladen.');
        refreshOfflineSectionUI(offlineId);
      }).catch(err=>{
        showToast('Fehler beim Herunterladen: ' + (err && err.message ? err.message : err), true);
        downloadOfflineBtn.disabled = false;
        downloadOfflineBtn.textContent = '🔽 Für unterwegs herunterladen';
      });
      return;
    }
    const deleteOfflineBtn = e.target.closest('[data-act="delete-offline"]');
    if(deleteOfflineBtn){
      const offlineId = deleteOfflineBtn.getAttribute('data-offline-id');
      deleteTourOfflineData(offlineId).then(()=>{
        showToast('Offline-Daten gelöscht.');
        refreshOfflineSectionUI(offlineId);
      });
      return;
    }
    const gpsToggleBtn = e.target.closest('[data-act="toggle-live-gps"]');
    if(gpsToggleBtn){
      const offlineId = gpsToggleBtn.getAttribute('data-offline-id');
      const mapInner = (typeof fsCtxMap !== 'undefined' && fsCtxMap) || (window.__activeLeafletMaps && window.__activeLeafletMaps['map-tour-' + offlineId + '-inner']);
      if(!mapInner){
        showToast('Bitte zuerst "🗺️ Karte anzeigen" antippen.', true);
        return;
      }
      // Standort nur auf Tipp: einmal orten und auf der Karte zeigen (kein laufender Standort)
      if(typeof fsSetSheetDetent === 'function' && document.documentElement.classList.contains('fs-ctx-map')) fsSetSheetDetent('peek');
      fsmLocateOnce(mapInner, gpsToggleBtn);
    }
  });

  const gpsFetchBtn = root.querySelector('#gps-fetch-btn');
  if(gpsFetchBtn) gpsFetchBtn.addEventListener('click', startGpsLookup);

  const pointsMapToggleBtn = root.querySelector('#points-map-toggle-btn');
  if(pointsMapToggleBtn) pointsMapToggleBtn.addEventListener('click', ()=>{
    const mapDiv = document.getElementById('points-map');
    if(mapDiv) mapDiv.style.display = '';
    const refTracks = [];
    // Der eigene GPX-Track der Tour (falls vorhanden) wird nicht mehr als starre Referenzlinie
    // gezeigt, sondern direkt in dieser Karte bearbeitbar (siehe gpxConfig unten) — ersetzt die
    // vorherige separate "GPX auf Karte bearbeiten"-Karte.
    const tourTrackHidden = document.getElementById('track-simplified-hidden');
    const pmGpxConfig = tourTrackHidden ? { hiddenId: 'track-simplified-hidden', idHiddenId: 'tour-id-for-track', trackPathPrefix: GPX_TRACKS_PATH, statusId: 'gpx-upload-status' } : null;
    const hutSummerHidden = document.getElementById('track-simplified-summer-hidden');
    if(hutSummerHidden && hutSummerHidden.value){
      try{ const t = JSON.parse(hutSummerHidden.value); if(t && t.length) refTracks.push({coords:t, color:'#E8B93E', label:'🟡 Gelb: Sommer-Zustieg (GPX)'}); }catch(e){}
    }
    const hutWinterHidden = document.getElementById('track-simplified-winter-hidden');
    if(hutWinterHidden && hutWinterHidden.value){
      try{ const t = JSON.parse(hutWinterHidden.value); if(t && t.length) refTracks.push({coords:t, color:'#1565C0', label:'🔵 Blau: Winter-Zustieg (GPX)'}); }catch(e){}
    }
    // Zustiege des Elements immer mit anzeigen, damit auf jeder Karte innerhalb einer Hütte/Tour
    // dasselbe zu sehen ist und nichts beim Wechsel zwischen den Ansichten übersehen wird.
    let editEntity = state.modal && state.modal.payload;
    if(state.modal && state.modal.type==='edit-hut' && editEntity) migrateHutAccessRoutes(editEntity);
    const pmRefTracks = refTracks.concat(siblingRouteRefTracks(editEntity, null));
    // Bei "Route berechnen" Aufstieg/Abfahrt/Zeitbedarf gleich ins Tourformular übernehmen.
    const tourFormForAutofill = document.getElementById('tour-form');
    const pmAutofillFields = tourFormForAutofill ? {
      ascent: tourFormForAutofill.querySelector('[name="elevationGain"]'),
      descent: tourFormForAutofill.querySelector('[name="elevationLoss"]'),
      duration: tourFormForAutofill.querySelector('[name="duration"]')
    } : null;
    renderPointsEditorMap('points-map', 'points-hidden', 'points-list', 'manual-track-hidden', pmRefTracks, undefined, pmAutofillFields, pmGpxConfig);
  });
  // Direkter Sprung von der Übersichtskarte ins Bearbeiten (siehe openTourEditFromMap &Co. in
  // 0-shared.js) öffnet die Punkte-Karte gleich mit, statt den Knopf oben extra antippen zu müssen.
  if(state._openPointsMapOnNextRender && pointsMapToggleBtn){
    state._openPointsMapOnNextRender = false;
    pointsMapToggleBtn.click();
  }

  const camptocampToggleBtn = root.querySelector('#camptocamp-search-toggle-btn');
  if(camptocampToggleBtn) camptocampToggleBtn.addEventListener('click', ()=>{
    const box = document.getElementById('camptocamp-search-box');
    if(!box) return;
    const opening = box.style.display === 'none';
    box.style.display = opening ? '' : 'none';
    if(opening) renderCamptocampSearchBox('camptocamp-search-box', 'tour-link-input');
  });

  // War die Punkte-Karte schon offen, gleich neu zeichnen, damit ein frisch hochgeladener oder
  // entfernter Track sofort dort erscheint/verschwindet, statt erst nach erneutem Antippen von
  // "Karte öffnen".
  function refreshPointsMapIfOpen(){
    const pointsMapDiv = document.getElementById('points-map');
    if(pointsMapDiv && pointsMapDiv.style.display !== 'none' && pointsMapToggleBtn) pointsMapToggleBtn.click();
  }
  if(root.querySelector('#fs-routes-edit')) fsWireRoutesEditor();
  const gpxFileInput = root.querySelector('#gpx-file-input');
  if(gpxFileInput) gpxFileInput.addEventListener('change', ()=>{
    handleGpxFileUpload(gpxFileInput, GPX_TRACKS_PATH, 'tour-id-for-track', 'track-simplified-hidden', 'gpx-upload-status', refreshPointsMapIfOpen);
  });
  const gpxRemoveBtn = root.querySelector('#gpx-remove-btn');
  if(gpxRemoveBtn) gpxRemoveBtn.addEventListener('click', async ()=>{
    await removeGpxTrack(GPX_TRACKS_PATH, 'tour-id-for-track', 'track-simplified-hidden', 'gpx-upload-status', 'gpx-remove-btn');
    refreshPointsMapIfOpen();
  });
  const gpxFileInputHutSummer = root.querySelector('#gpx-file-input-summer');
  if(gpxFileInputHutSummer) gpxFileInputHutSummer.addEventListener('change', ()=>{
    handleGpxFileUpload(gpxFileInputHutSummer, HUT_GPX_SUMMER_PATH, 'hut-id-for-track', 'track-simplified-summer-hidden', 'gpx-upload-status-summer');
  });
  const gpxFileInputHutWinter = root.querySelector('#gpx-file-input-winter');
  if(gpxFileInputHutWinter) gpxFileInputHutWinter.addEventListener('change', ()=>{
    handleGpxFileUpload(gpxFileInputHutWinter, HUT_GPX_WINTER_PATH, 'hut-id-for-track', 'track-simplified-winter-hidden', 'gpx-upload-status-winter');
  });

  root.querySelectorAll('[data-act="show-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-target');

      const trackJson = btn.getAttribute('data-track');
      const manualTrackJson = btn.getAttribute('data-manual-track');
      const altTracksJson = btn.getAttribute('data-alt-tracks');

      try{ track = JSON.parse(trackJson || '[]'); }catch(e){ track = []; }
      try{ manualTrack = JSON.parse(manualTrackJson || '[]'); }catch(e){ manualTrack = []; }
      try{ altTracks = JSON.parse(altTracksJson || '[]'); }catch(e){ altTracks = []; }
      renderTrackDisplayMap(target, pts, track, manualTrack, offlineId, altTracks);
    });
  });

  root.querySelectorAll('[data-act="show-gipfelziel-overview-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      renderGipfelzielOverviewMap(btn.getAttribute('data-target'), btn.getAttribute('data-gipfelziel'));
    });
  });

  root.querySelectorAll('[data-act="download-manual-gpx"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      let track = [];
      try{ track = JSON.parse(btn.getAttribute('data-track') || '[]'); }catch(e){ track = []; }
      downloadTrackAsGpx(track, btn.getAttribute('data-name'));

  root.querySelectorAll('[data-act="download-gpx"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      downloadFullGpx(GPX_TRACKS_PATH, btn.getAttribute('data-id'), btn.getAttribute('data-name'));

  root.querySelectorAll('[data-act="download-alt-gpx"]').forEach(btn=>{

  root.querySelectorAll('[data-act="remove-alt-track"]').forEach(btn=>{

  root.querySelectorAll('[data-act="download-hut-gpx-winter"]').forEach(btn=>{
