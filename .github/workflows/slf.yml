name: SLF-Messstationen

# Holt alle 30 Minuten die aktuellen Werte der SLF-IMIS-Stationen (Schneehöhe, Neuschnee,
# Temperatur, Wind) und legt sie als slf-stationen.json in den Branch «daten». Die App liest die
# Datei über raw.githubusercontent.com — die SLF-Schnittstelle selbst erlaubt keinen Abruf aus
# dem Browser. Dazu das Lawinenbulletin (slf-bulletin.json, tools/slf-bulletin.py), damit die App es
# auch dann hat, wenn der direkte Abruf beim SLF im Browser scheitert. Der Branch wird jedes Mal ersetzt.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: slf-stationen
  cancel-in-progress: true

jobs:
  slf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SLF-Daten holen
        run: python3 tools/slf-stationen.py "$RUNNER_TEMP/slf-stationen.json"
      - name: Lawinenbulletin holen
        # Fehlschlag hier stoppt die Messstationen nicht; die App holt das Bulletin dann direkt beim SLF
        run: python3 tools/slf-bulletin.py "$RUNNER_TEMP/slf-bulletin.json" || true
      - name: In Branch «daten» ablegen
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf daten && mkdir daten && cd daten
          git init -q -b daten
          cp ../slf-stationen.json ../slf-verlauf.json .
          [ -f ../slf-bulletin.json ] && cp ../slf-bulletin.json . || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slf-stationen.json slf-verlauf.json $( [ -f slf-bulletin.json ] && echo slf-bulletin.json )
          git commit -qm "SLF-Messstationen $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daten
