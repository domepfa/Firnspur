name: Wetterbilder

# Prognosebilder für die Wetter-Karte (Niederschlag mit Art, Bewölkung) aus dem 1-km-Modell ICON-CH1
# von MeteoSchweiz (Open Data). Das Modell rechnet alle 3 Stunden 33 Stunden voraus; die Rohdaten sind
# pro Stunde mehrere MB gross – zu viel fürs Handy. tools/wetterbilder.py macht daraus kleine PNG
# (etwa 40 KB pro Stunde) und legt sie in den Branch «wetterbilder». Die App liest sie über
# raw.githubusercontent.com. Läuft stündlich, rechnet aber nur, wenn ein neuer Lauf vollständig da ist.
# Der Branch wird jedes Mal ersetzt (kein Verlauf, das Repository wächst nicht).

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wetterbilder
  cancel-in-progress: false

jobs:
  bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Neuer Modelllauf?
        id: neu
        run: |
          set -euo pipefail
          alt=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/wetterbilder/index.json" | python3 -c 'import json,sys; j=json.load(sys.stdin); print(j["ref"] + ":" + str(j.get("v", 1)))' || echo '')
          neu=$(python3 - <<'PY'
          import json, urllib.request
          body = {'collections': ['ch.meteoschweiz.ogd-forecasting-icon-ch1'], 'limit': 100,
                  'forecast:variable': 'TOT_PREC', 'forecast:perturbed': False, 'forecast:horizon': 'P1DT09H00M00S'}
          req = urllib.request.Request('https://data.geo.admin.ch/api/stac/v1/search', data=json.dumps(body).encode(),
                                       headers={'Content-Type': 'application/json'})
          refs = sorted(f['properties']['forecast:reference_datetime'] for f in json.load(urllib.request.urlopen(req, timeout=60))['features'])
          print(refs[-1] + ':2' if refs else '')  # :2 = Format der Wertebilder (tools/wetterbilder.py)
          PY
          )
          echo "alt=$alt neu=$neu"
          if [ -n "$neu" ] && [ "$neu" != "$alt" ]; then echo "los=1" >> "$GITHUB_OUTPUT"; fi
      - name: Python-Pakete
        if: steps.neu.outputs.los == '1'
        run: pip install --quiet eccodes eccodeslib numpy scipy pillow
      - name: Bilder rechnen
        if: steps.neu.outputs.los == '1'
        run: python3 tools/wetterbilder.py "$RUNNER_TEMP/wetterbilder"
      - name: In Branch «wetterbilder» ablegen
        if: steps.neu.outputs.los == '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wetterbilder"
          git init -q -b wetterbilder
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Wetterbilder $(python3 -c 'import json; print(json.load(open("index.json"))["ref"])')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wetterbilder
