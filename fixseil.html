function renderListOnly(){
  const main = document.querySelector('main');
  if(!main) return;
  main.innerHTML = state.loading ? `<div class="loading">Lade…</div>` : (state.view==='touren' ? tourenViewHtml() : state.view==='msl' ? mslViewHtml() : state.view==='huetten' ? huettenViewHtml() : state.view==='sektoren' ? sektorenViewHtml() : state.view==='agenda' ? agendaViewHtml() : abgeschlossenViewHtml());
  wireGlobalHandlers();
  const input = main.querySelector('.search-input');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

function wireModalHandlers(){
  const root = document.getElementById('modal-root');
  dlog('Modal gerendert: ' + (state.modal ? state.modal.type : 'keins'));
  syncModalDirtyTracking();
  // Erkennt Änderungen an Text-/Auswahlfeldern sowie Chip-Klicks, um beim Verlassen einer
  // Bearbeiten-Maske gezielt nachfragen zu können, ob ungespeicherte Änderungen verworfen
  // werden sollen. Nur einmal verdrahtet (modal-root bleibt über Renders hinweg bestehen).
  if(!root.dataset.dirtyWired){
    root.dataset.dirtyWired = '1';
    root.addEventListener('input', ()=> markModalDirty());
    root.addEventListener('change', ()=> markModalDirty());
    root.addEventListener('click', (e)=>{ if(e.target.closest('button.chip')) markModalDirty(); });
  }
  const overlay = root.querySelector('.overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  root.querySelectorAll('[data-stop]').forEach(el=> el.addEventListener('click', e=>e.stopPropagation()));

  root.querySelectorAll('[data-act="close-modal"]').forEach(el=> el.onclick = ()=> closeModal());

  if(state.modal && state.modal.type==='tour-detail'){
    refreshOfflineSectionUI(state.modal.payload);
  }

  const gpsFetchBtn = root.querySelector('#gps-fetch-btn');
  if(gpsFetchBtn) gpsFetchBtn.addEventListener('click', startGpsLookup);

  const pointsMapToggleBtn = root.querySelector('#points-map-toggle-btn');
  if(pointsMapToggleBtn) pointsMapToggleBtn.addEventListener('click', ()=>{
    const mapDiv = document.getElementById('points-map');
    if(mapDiv) mapDiv.style.display = '';
    const refTracks = [];
    const tourTrackHidden = document.getElementById('track-simplified-hidden');
    if(tourTrackHidden && tourTrackHidden.value){
      try{ const t = JSON.parse(tourTrackHidden.value); if(t && t.length) refTracks.push({coords:t, color:'#E8384F', label:'🔴 Rot: hochgeladener GPX-Track'}); }catch(e){}
    }
    const hutSummerHidden = document.getElementById('track-simplified-summer-hidden');
    if(hutSummerHidden && hutSummerHidden.value){
      try{ const t = JSON.parse(hutSummerHidden.value); if(t && t.length) refTracks.push({coords:t, color:'#E8B93E', label:'🟡 Gelb: Sommer-Zustieg (GPX)'}); }catch(e){}
    }
    const hutWinterHidden = document.getElementById('track-simplified-winter-hidden');
    if(hutWinterHidden && hutWinterHidden.value){
      try{ const t = JSON.parse(hutWinterHidden.value); if(t && t.length) refTracks.push({coords:t, color:'#1565C0', label:'🔵 Blau: Winter-Zustieg (GPX)'}); }catch(e){}
    }
    // Zustiege/Abstiege des Elements immer mit anzeigen, damit auf jeder Karte innerhalb einer
    // Hütte/Tour/eines Sektors dasselbe zu sehen ist und nichts beim Wechsel zwischen den
    // Ansichten übersehen wird.
    let editEntity = state.modal && state.modal.payload;
    if(state.modal && state.modal.type==='edit-hut' && editEntity) migrateHutAccessRoutes(editEntity);
    const pmRefTracks = refTracks.concat(siblingRouteRefTracks(editEntity, null));
    // Bei "Route berechnen" Aufstieg/Abstieg/Zeitbedarf gleich ins Tourformular übernehmen
    // (nur relevant für Touren — Hütten/Sektoren haben diese Felder nicht).
    const tourFormForAutofill = document.getElementById('tour-form');
    const pmAutofillFields = tourFormForAutofill ? {
      ascent: tourFormForAutofill.querySelector('[name="elevationGain"]'),
      descent: tourFormForAutofill.querySelector('[name="elevationLoss"]'),
      duration: tourFormForAutofill.querySelector('[name="duration"]')
    } : null;
    renderPointsEditorMap('points-map', 'points-hidden', 'points-list', 'manual-track-hidden', pmRefTracks, undefined, pmAutofillFields);
  });

  const camptocampToggleBtn = root.querySelector('#camptocamp-search-toggle-btn');
  if(camptocampToggleBtn) camptocampToggleBtn.addEventListener('click', ()=>{
    const box = document.getElementById('camptocamp-search-box');
    if(!box) return;
    const opening = box.style.display === 'none';
    box.style.display = opening ? '' : 'none';
    if(opening) renderCamptocampSearchBox('camptocamp-search-box', 'tour-link-input');
  });

  const gpxFileInput = root.querySelector('#gpx-file-input');
  if(gpxFileInput) gpxFileInput.addEventListener('change', ()=>{
    handleGpxFileUpload(gpxFileInput, GPX_TRACKS_PATH, 'tour-id-for-track', 'track-simplified-hidden', 'gpx-upload-status');
  });
  const gpxFileInputHutSummer = root.querySelector('#gpx-file-input-summer');
  if(gpxFileInputHutSummer) gpxFileInputHutSummer.addEventListener('change', ()=>{
    handleGpxFileUpload(gpxFileInputHutSummer, HUT_GPX_SUMMER_PATH, 'hut-id-for-track', 'track-simplified-summer-hidden', 'gpx-upload-status-summer');
  });
  const gpxFileInputHutWinter = root.querySelector('#gpx-file-input-winter');
  if(gpxFileInputHutWinter) gpxFileInputHutWinter.addEventListener('change', ()=>{
    handleGpxFileUpload(gpxFileInputHutWinter, HUT_GPX_WINTER_PATH, 'hut-id-for-track', 'track-simplified-winter-hidden', 'gpx-upload-status-winter');
  });

  const topoImageInput = root.querySelector('#topo-image-input');
  if(topoImageInput) topoImageInput.addEventListener('change', ()=>{
    handleTopoImageUpload(topoImageInput, 'tour-id-for-track', 'topo-images-hidden', 'topo-image-status');
  });
  // Event-Delegation, da die Miniaturbilder nach Upload/Entfernen dynamisch neu gezeichnet werden.
  // Wichtig: auf .modal verdrahten, nicht auf root — Klicks innerhalb des Fensters werden dort bewusst
  // per data-stop/stopPropagation() gestoppt (damit sie das Fenster nicht schliessen), würden also nie bei root ankommen.
  const modalEl = root.querySelector('.modal');
  if(modalEl) modalEl.addEventListener('click', (e)=>{
    const removeBtn = e.target.closest('[data-act="remove-topo-image-local"]');
    if(removeBtn){
      e.preventDefault();
      removeTopoImageLocal(removeBtn.getAttribute('data-hidden-id'), removeBtn.getAttribute('data-image-id'));
      return;
    }
    const rotateBtn = e.target.closest('[data-act="rotate-topo-image-local"]');
    if(rotateBtn){
      e.preventDefault();
      rotateTopoImageLocal(rotateBtn.getAttribute('data-hidden-id'), rotateBtn.getAttribute('data-image-id'));
      return;
    }
    const viewImg = e.target.closest('[data-act="view-topo-image"]');
    if(viewImg){
      let images = [];
      try{ images = JSON.parse(viewImg.getAttribute('data-images') || '[]'); }catch(err){ images = []; }
      const startIndex = parseInt(viewImg.getAttribute('data-index'), 10) || 0;
      let offlineId = null;
      if(state.modal){
        if(state.modal.type==='tour-detail') offlineId = state.modal.payload;
        else if(state.modal.type==='edit-tour' && state.modal.payload) offlineId = state.modal.payload.id;
      }
      showTopoImageLightbox(images, startIndex, offlineId);
      return;
    }
    const downloadOfflineBtn = e.target.closest('[data-act="download-offline"]');
    if(downloadOfflineBtn){
      const offlineId = downloadOfflineBtn.getAttribute('data-offline-id');
      const item = state.tours.find(t=>t.id===offlineId);
      if(!item) return;
      const coords = [];
      (item.points||[]).forEach(p=> coords.push([p.lat, p.lon]));
      (item.trackSimplified||[]).forEach(c=> coords.push(c));
      (item.manualTrack||[]).forEach(c=> coords.push(c));
      downloadOfflineBtn.disabled = true;
      downloadOfflineBtn.textContent = 'Wird heruntergeladen… 0%';
      downloadTourOffline(offlineId, item.name, coords, item.topoImages||[], (done,total)=>{
        downloadOfflineBtn.textContent = `Wird heruntergeladen… ${Math.round(done/total*100)}%`;
      }).then(()=>{
        showToast('Für unterwegs heruntergeladen.');
        refreshOfflineSectionUI(offlineId);
      }).catch(err=>{
        showToast('Fehler beim Herunterladen: ' + (err && err.message ? err.message : err), true);
        downloadOfflineBtn.disabled = false;
        downloadOfflineBtn.textContent = '🔽 Für unterwegs herunterladen';
      });
      return;
    }
    const deleteOfflineBtn = e.target.closest('[data-act="delete-offline"]');

      closeModal(false, true);
      showToast(onDeletedGoTo + ' gelöscht.');
    });

    render();
  });
  root.querySelectorAll('[data-act="open-sektor-route"]').forEach(el=> el.onclick = ()=>{
    const sektorId = el.getAttribute('data-sektor-id');
    const kind = el.getAttribute('data-kind');
    const routeId = el.getAttribute('data-route-id');
    const sek = state.sektoren.find(x=>x.id===sektorId);
    const field = sektorRouteFieldName(kind);
    const route = sek && sek[field] ? sek[field].find(r=>r.id===routeId) : null;
    if(!route) return;
    state.modal = {type:'sektor-route-detail', payload:{sektorId, kind, route}};
    render();
  });
  root.querySelectorAll('[data-act="edit-sektor-route"]').forEach(el=> el.onclick = ()=>{
    const sektorId = el.getAttribute('data-sektor-id');
    const kind = el.getAttribute('data-kind');
    const routeId = el.getAttribute('data-route-id');
    const sek = state.sektoren.find(x=>x.id===sektorId);
    const field = sektorRouteFieldName(kind);
    const route = sek && sek[field] ? sek[field].find(r=>r.id===routeId) : null;
    if(!route) return;
    state.modal = {type:'edit-sektor-route', payload:{sektorId, kind, route}};
    render();
  });
  root.querySelectorAll('[data-act="show-sektor-routes-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-target');
      let pts = [], routes = [];
      try{ pts = JSON.parse(btn.getAttribute('data-points') || '[]'); }catch(e){ pts = []; }
      try{ routes = JSON.parse(btn.getAttribute('data-routes') || '[]'); }catch(e){ routes = []; }
      renderHutAccessRoutesMap(target, pts, routes);
    });
  });
  root.querySelectorAll('[data-act="show-sektor-route-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-target');
      let track = [], manualTrack = [];
      try{ track = JSON.parse(btn.getAttribute('data-track') || '[]'); }catch(e){ track = []; }
      try{ manualTrack = JSON.parse(btn.getAttribute('data-manual-track') || '[]'); }catch(e){ manualTrack = []; }
      renderTrackDisplayMap(target, [], track, manualTrack);
    });
  });
  root.querySelectorAll('[data-act="show-sektor-overview-map"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      renderSektorOverviewMap(btn.getAttribute('data-target'), btn.getAttribute('data-sektor-id'));
    });
  });

  const sektorRouteForm = document.getElementById('sektor-route-form');
  if(sektorRouteForm){
    const sektorGpxInput = document.getElementById('sektor-route-gpx-input');
    if(sektorGpxInput) sektorGpxInput.addEventListener('change', ()=>{
      const kindField = sektorRouteForm.querySelector('[name="kind"]');
      const kind = kindField ? kindField.value : 'access';
      handleGpxFileUpload(sektorGpxInput, sektorRouteGpxPath(kind), 'sektor-route-id-for-track', 'sektor-route-track-hidden', 'sektor-route-gpx-status');
    });

    const sektorRouteMapToggleBtn = document.getElementById('sektor-route-map-toggle-btn');
    if(sektorRouteMapToggleBtn) sektorRouteMapToggleBtn.addEventListener('click', ()=>{
      const mapDiv = document.getElementById('sektor-route-map');
      if(mapDiv) mapDiv.style.display = '';
      const trackHidden = document.getElementById('sektor-route-track-hidden');
      const refTracks = [];
      if(trackHidden && trackHidden.value){
        try{ const t = JSON.parse(trackHidden.value); if(t && t.length) refTracks.push({coords:t, color:'#E8384F', label:'🔴 Rot: hochgeladener GPX-Track'}); }catch(e){}
      }
      if(!document.getElementById('sektor-route-points-dummy')){
        const dummy = document.createElement('input');
        dummy.type = 'hidden'; dummy.id = 'sektor-route-points-dummy'; dummy.value = '[]';
        document.body.appendChild(dummy);
      }
      // Geschwister-Zustiege/Abstiege sowie der Standort des Sektors selbst als Referenz — damit
      // man sieht, was schon existiert, statt eine neue Linie "blind" über bestehende zu zeichnen.
      const sektorIdField = sektorRouteForm.querySelector('[name="sektorId"]');
      const srRouteIdField = sektorRouteForm.querySelector('[name="routeId"]');
      const srKindField = sektorRouteForm.querySelector('[name="kind"]');
      const sektorForRoute = sektorIdField ? state.sektoren.find(x=>x.id===sektorIdField.value) : null;
      const srRefTracks = refTracks.concat(siblingRouteRefTracks(sektorForRoute, srRouteIdField ? srRouteIdField.value : null));
      const srRefPoints = ownPointRefPoints(sektorForRoute, sektorForRoute ? sektorForRoute.name : 'Sektor', '#4A6B3A');
      // Bei Zustieg füllt der Aufstieg das Höhenmeter-Feld, bei Abstieg der Abstieg (plus ggf. Gegenanstieg).
      const srIsDescent = srKindField && srKindField.value==='descent';
      const srAutofillFields = srIsDescent
        ? { descent: sektorRouteForm.querySelector('[name="elevation"]'), ascent: sektorRouteForm.querySelector('[name="elevationUp"]'), duration: sektorRouteForm.querySelector('[name="duration"]') }
        : { ascent: sektorRouteForm.querySelector('[name="elevation"]'), duration: sektorRouteForm.querySelector('[name="duration"]') };
      renderPointsEditorMap('sektor-route-map', 'sektor-route-points-dummy', 'sektor-route-points-dummy-list', 'sektor-route-manual-track-hidden', srRefTracks, srRefPoints, srAutofillFields);
    });

    const sektorRouteSaveBtn = document.getElementById('sektor-route-save-btn');
    if(sektorRouteSaveBtn) sektorRouteSaveBtn.addEventListener('click', (e)=>{
      e.preventDefault();
      const fd = new FormData(sektorRouteForm);
      const data = Object.fromEntries(fd.entries());
      if(!data.name || !data.name.trim()){
        showFormError('sektor-route-form', 'Bitte einen Namen eingeben.');
        return;
      }
      submitSektorRouteForm(data);
    });

    const deleteSektorRouteBtn = sektorRouteForm.parentElement ? sektorRouteForm.parentElement.querySelector('[data-act="delete-sektor-route"]') : null;
    if(deleteSektorRouteBtn) deleteSektorRouteBtn.addEventListener('click', ()=>{
      if(confirm('Diesen Eintrag wirklich löschen?')){
        deleteSektorRoute(deleteSektorRouteBtn.getAttribute('data-sektor-id'), deleteSektorRouteBtn.getAttribute('data-kind'), deleteSektorRouteBtn.getAttribute('data-route-id'));
      }
    });
  }

  const sektorForm = document.getElementById('sektor-form');
  if(sektorForm){
    const sektorSaveBtn = document.getElementById('sektor-save-btn');
    if(sektorSaveBtn){
      sektorSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        try{
          const fd = new FormData(sektorForm);
          const data = Object.fromEntries(fd.entries());
          if(!data.name || !data.name.trim()){
            showFormError('sektor-form', 'Bitte einen Namen für den Sektor eingeben (ganz oben im Formular).');
            return;
          }
          submitSektorForm(data, state.modal.payload);
        }catch(err){
          showFormError('sektor-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
    const sektorFabSaveBtn = document.getElementById('sektor-fab-save-btn');
    if(sektorFabSaveBtn) sektorFabSaveBtn.addEventListener('click', ()=>{ if(sektorSaveBtn) sektorSaveBtn.click(); });

    // Region-Chips (identisch zum Touren-/Hütten-Formular)
    const sektorRegionHidden = document.getElementById('region-hidden-input');
    const sektorRegionOtherInput = document.getElementById('region-other-input');
    const sektorSubregionField = document.getElementById('subregion-field');
    const sektorSubregionChipsWrap = document.getElementById('subregion-chips');
    const sektorSubregionHidden = document.getElementById('subregion-hidden');
    sektorForm.querySelectorAll('.region-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const wasOn = chip.classList.contains('on');
        sektorForm.querySelectorAll('.region-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){
          sektorRegionOtherInput.style.display = 'none';
          sektorRegionOtherInput.value = '';
          sektorRegionHidden.value = '';
          if(sektorSubregionField){ sektorSubregionField.style.display = 'none'; sektorSubregionHidden.value = ''; }
          return;
        }
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        const region = chip.getAttribute('data-region');
        if(region==='__other__'){
          sektorRegionOtherInput.style.display = '';
          sektorRegionOtherInput.focus();
          sektorRegionHidden.value = sektorRegionOtherInput.value;
          if(sektorSubregionField){ sektorSubregionField.style.display = 'none'; sektorSubregionHidden.value = ''; }
        }else{
          sektorRegionOtherInput.style.display = 'none';
          sektorRegionHidden.value = region;
          if(sektorSubregionField && sektorSubregionChipsWrap){
            const subs = REGION_SUBAREAS[region] || [];
            if(subs.length){
              sektorSubregionChipsWrap.innerHTML = renderSubregionChipsHtml(region, '');
              sektorSubregionHidden.value = '';
              sektorSubregionField.style.display = '';
            }else{
              sektorSubregionField.style.display = 'none';
              sektorSubregionHidden.value = '';
            }
          }
        }
      });
    });
    if(sektorRegionOtherInput) sektorRegionOtherInput.addEventListener('input', ()=>{ sektorRegionHidden.value = sektorRegionOtherInput.value; });
    if(sektorSubregionChipsWrap){
      sektorSubregionChipsWrap.addEventListener('click', (e)=>{
        const btn = e.target.closest('.subregion-chip');
        if(!btn) return;
        const wasOn = btn.classList.contains('on');
        sektorSubregionChipsWrap.querySelectorAll('.subregion-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){ sektorSubregionHidden.value = ''; return; }
        btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
        sektorSubregionHidden.value = btn.getAttribute('data-subregion');
      });
    }
  }
}

/* ================= Global error safety net ================= */
window.addEventListener('error', function(e){
  console.error('Unhandled error', e.error || e.message);
  showToast('Es gab ein unerwartetes Problem: ' + (e.message || 'unbekannter Fehler') + '. Bitte nochmal versuchen.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection', e.reason);
  showToast('Es gab ein unerwartetes Problem beim Speichern. Bitte nochmal versuchen.', true);
});
window.addEventListener('beforeunload', function(e){
  if(state.hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= Init ================= */
try{
  const savedName = localStorage.getItem('fixseil-myname');
  if(savedName) state.myName = savedName;
}catch(e){}
loadAuthFromStorage();
cleanupExpiredOfflineDownloads();
wireAppSwitchSwipe('./index.html');
function toggleEmergencyCard(){
  if(state.modal && state.modal.type==='emergency'){ closeModal(); }
  else{ state.modal = {type:'emergency'}; render(); }
}
const emergencyTab = document.getElementById('emergency-btn');
emergencyTab.addEventListener('click', toggleEmergencyCard);
let emergencySwipeStart = null;
emergencyTab.addEventListener('touchstart', (e)=>{
  emergencySwipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, {passive:true});
emergencyTab.addEventListener('touchend', (e)=>{
  if(!emergencySwipeStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - emergencySwipeStart.x;
  const dy = t.clientY - emergencySwipeStart.y;
  emergencySwipeStart = null;
  // Wegziehen nach rechts oder nach unten öffnet die Karte (kein erneutes Schliessen per Wisch, nur per Klick/erneutem Antippen)
  if((dx > 35 || dy > 35) && !(state.modal && state.modal.type==='emergency')){
    state.modal = {type:'emergency'}; render();
  }
});

if(isLoggedIn()){
  dlog('App gestartet — Version ' + APP_VERSION);
  loadAll();
}else{
  document.getElementById('app').innerHTML = loginScreenHtml();
  wireLoginScreen();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      dlog('Service Worker konnte nicht registriert werden.', 'err');
    });
  });
}
</script>
</body>
</html>
