<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hochtour/MSL — gemeinsam planen</title>
<link rel="manifest" href="./manifest-fixseil.json">
<link rel="icon" href="./IMG-20260816-WA0023.jpg">
<link rel="apple-touch-icon" href="./IMG-20260816-WA0023.jpg">
<meta name="theme-color" content="#4A3524">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1EAE0;
    --paper:#FFFFFF;
    --ink:#2B2019;
    --ink-soft:#6B5B4C;
    --ink-faint:#9C8C7B;
    --ice:#7C5B3E;
    --ice-deep:#4A3524;
    --ice-light:#E6DAC5;
    --signal:#D9A441;
    --signal-deep:#A87A1F;
    --line:#DED0B8;
    --danger:#B0392C;
    --ok:#3C7A52;
    --shadow: 0 2px 10px rgba(43,32,25,0.10);
    --shadow-lg: 0 12px 32px rgba(43,32,25,0.20);
    --radius: 3px;

    --d-L:#6C93AC;
    --d-WS:#4E7A93;
    --d-ZS:#C9A227;
    --d-S:#D97B3E;
    --d-SS:#C2452D;
    --d-AS:#8A2E2E;
    --d-EX:#2B1416;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--ice-deep);}

  /* ===== App-Umschalter ===== */
  .app-switch-bar{
    background:var(--ink); display:flex; justify-content:center; gap:0;
  }
  .app-switch-bar a{
    color:rgba(255,255,255,0.55); text-decoration:none; font-size:13.5px; font-weight:700;
    letter-spacing:0.03em; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; flex:1; max-width:220px; text-transform:uppercase;
    border-bottom:3px solid transparent; transition:background .12s ease, color .12s ease;
  }
  .app-switch-bar a:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .app-switch-bar a.active{color:#fff; border-bottom-color:var(--signal, #F2B705); background:rgba(255,255,255,0.06);}

  /* ===== Fels-Hero ===== */
  .hero{
    color:#fff;
    padding:28px 20px 34px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image: url('IMG_20260811_073051812_HDR.jpg');
    background-size: 115%;
    background-position: center 55%;
    filter: brightness(1.15) contrast(1.05);
    z-index:0;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(74,53,36,0.62) 0%, rgba(124,91,62,0.40) 55%, rgba(159,131,101,0.24) 100%);
    z-index:0;
  }
  .hero-top, .hero .tabs{ position:relative; z-index:1; }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:44px; color:#fff; letter-spacing:1px; font-weight:800;}
  .brand .tag{font-family:'Source Sans 3'; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ice-light); font-style:italic;}
  .who{
    font-size:13px; color:var(--ice-light); text-align:right;
  }
  .who-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .who button{
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:12px; margin-left:6px;
  }
  .who button:hover{background:rgba(255,255,255,0.15);}

  /* ===== Wegweiser-Tabs ===== */
  .tabs{
    max-width:1000px; margin:0 auto; padding:0 20px;
    display:flex; gap:14px; transform:translateY(20px);
    position:relative; z-index:2;
  }
  .tab{
    background:none; border:none; box-shadow:none; clip-path:none;
    color:rgba(255,255,255,0.62);
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    font-size:14px;
    padding:10px 14px 8px 14px;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:#fff; border-bottom-color:var(--signal, #F2B705);}
  .tab:hover{color:#fff;}

  main{max-width:1000px; margin:0 auto; padding:40px 20px 80px 20px;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-input{
    flex:1; min-width:180px;
    padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .btn{
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ice-deep);
    background:var(--ice-deep); color:#fff; font-weight:600; font-size:14px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ice);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.secondary:hover{background:var(--ice-light);}
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--ice-deep); outline-offset:2px;}

  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .sort-control{display:flex; align-items:center; gap:6px;}
  .sort-control select{
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px;
    font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .sort-dir-btn{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff;
    width:32px; height:32px; font-size:15px; cursor:pointer; color:var(--ink);
  }
  .sort-dir-btn:hover{background:var(--ice-light);}
  .chip{
    padding:4px 10px; border-radius:16px; border:1px solid var(--line);
    background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.3;
  }
  .chip.on{color:#fff; border-color:transparent;}

  /* ===== Karten ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ice-light); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-left-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); cursor:pointer; border-left-color:var(--ice);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .agenda-date-row{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em;
    font-weight:700; font-size:15px; color:var(--ice-deep); margin-bottom:2px;
  }
  .card h3{font-size:17px; color:var(--ink); line-height:1.25;}
  .badge{
    flex-shrink:0; font-family:'JetBrains Mono'; font-weight:700; font-size:12px;
    color:#fff; padding:3px 8px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
  .badge.climb{background:var(--ice-deep);}
  .stat-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap;}
  .stat-row .mono{color:var(--ink); font-weight:600;}
  .card p.excerpt{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .hut-link-chip{
    align-self:flex-start; font-size:12px; background:var(--ice-light); color:var(--ice-deep);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .conditions-note{
    font-size:12.5px; background:#F6E9C9; border-left:3px solid var(--signal-deep);
    padding:6px 9px; color:#5B4200; border-radius:2px;
  }
  .meta-line{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty h3{color:var(--ink); font-size:18px; margin-bottom:8px;}
  .empty .btn{margin-top:16px;}

  /* ===== Legende ===== */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .legend .chip{cursor:default; display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(30,22,16,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); width:100%; max-width:620px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:28px; margin:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px;}
  .modal-head h2{font-size:22px;}
  .x-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; padding:2px 6px;}
  .x-btn:hover{color:var(--ink);}

  .field{margin-bottom:9px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:3px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  /* ===== Detailansicht ===== */
  .detail-badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{
    font-family:'Oswald'; text-transform:uppercase; font-size:13px; letter-spacing:0.05em;
    color:var(--ice-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  }
  .detail-section p{font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap; margin:0;}
  .detail-stats{display:flex; gap:22px; flex-wrap:wrap; margin:14px 0;}
  .detail-stat .num{font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--ink);}
  .detail-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .detail-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#FBEAE7;}

  .cond-box{background:var(--ice-light); border-radius:var(--radius); padding:12px; margin-top:14px;}
  .cond-box textarea{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13.5px; min-height:44px;}
  .cond-box .meta-line{margin-top:6px;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-family:'Oswald'; letter-spacing:0.05em; text-transform:uppercase; font-size:13px;}

  .form-error{
    background:#FBEAE7; border:1px solid var(--danger); color:#7A2A1F;
    padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ice-deep); color:#fff; padding:11px 20px; border-radius:20px;
    font-size:13.5px; box-shadow:var(--shadow-lg); z-index:100; max-width:90%; text-align:center;
  }
  .toast.error{background:var(--danger);}
  .btn[disabled]{opacity:0.6; cursor:default;}

  .backup-banner{
    background:#B0392C; color:#fff; padding:12px 20px; text-align:center;
    font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:80;
  }
  .backup-banner button{
    background:#fff; color:#B0392C; border:none; border-radius:20px; padding:6px 16px;
    font-weight:700; font-size:13px;
  }

  .debug-toggle{
    position:fixed; bottom:16px; right:16px; z-index:90;
    background:var(--ink); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12px; font-family:'JetBrains Mono'; opacity:0.55;
    box-shadow:var(--shadow);
  }
  .debug-panel{
    position:fixed; bottom:60px; right:16px; left:16px; max-width:520px; margin:0 auto;
    max-height:50vh; overflow-y:auto; background:#1C1510; color:#E9DFCF;
    border-radius:var(--radius); padding:12px; font-family:'JetBrains Mono'; font-size:11.5px;
    z-index:91; box-shadow:var(--shadow-lg); line-height:1.5;
  }
  .debug-panel .row{border-bottom:1px solid #3A2E22; padding:4px 0;}
  .debug-panel .row.err{color:#FF8A75;}
  .debug-panel .row.ok{color:#8FD9A8;}
  .debug-panel .head{display:flex; justify-content:space-between; margin-bottom:6px;}
  .debug-panel .head button{background:none; border:1px solid #554435; color:#E9DFCF; border-radius:4px; padding:2px 8px; font-size:11px;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .brand h1{font-size:32px;}
    .hero{padding-bottom:30px;}
    .tabs{transform:translateY(16px);}
    .tab{padding:8px 16px 8px 14px; font-size:12.5px;}
  }
</style>
</head>

<div class="app-switch-bar">
  <a href="./index.html">🎿 Skitour</a>
  <a href="./fixseil.html" class="active">🧗 Hochtour/MSL</a>
</div>
<div id="app"></div>
<button class="debug-toggle" id="debug-toggle-btn" onclick="toggleDebugPanel()">Diagnose v1</button>
<div id="debug-panel-root"></div>

<script>
/* ================= Debug log (in-app, browser-independent) ================= */
const APP_VERSION = 'v15-subregions-compact';
let debugLog = [];
let debugPanelOpen = false;
function dlog(message, kind){
  const entry = {t: new Date().toLocaleTimeString('de-CH'), message, kind: kind||'info'};
  debugLog.push(entry);
  if(debugLog.length > 60) debugLog.shift();
  if(kind==='err') console.error(message); else console.log(message);
  if(debugPanelOpen) renderDebugPanel();
}
function toggleDebugPanel(){
  debugPanelOpen = !debugPanelOpen;
  renderDebugPanel();
}
function renderDebugPanel(){
  const root = document.getElementById('debug-panel-root');
  if(!debugPanelOpen){ root.innerHTML = ''; return; }
  const rows = debugLog.slice().reverse().map(e=>
    `<div class="row ${e.kind==='err'?'err':(e.kind==='ok'?'ok':'')}">[${e.t}] ${esc(e.message)}</div>`
  ).join('') || '<div class="row">Noch keine Einträge.</div>';
  root.innerHTML = `<div class="debug-panel">
    <div class="head"><strong>Diagnose-Log</strong><button onclick="debugLog=[];renderDebugPanel();">leeren</button></div>
    ${rows}
  </div>`;
}

/* =================================================================
   Speicherung: Diese Version läuft als eigenständige Webseite (nicht
   im Claude-Artefakt), daher funktioniert echter Netzwerkzugriff zu
   Firebase. Alle Touren/Hütten werden live in Firebase Realtime
   Database gespeichert und zwischen allen Nutzern synchronisiert.
   Fixseil nutzt einen eigenen, vollständig getrennten Datenpfad
   (fixseil/tours, fixseil/huts), sodass die Daten in keiner Weise
   mit Firnspur vermischt werden. Als Sicherheitsnetz bei fehlender
   Internetverbindung bleibt der Export/Import weiterhin verfügbar.
   ================================================================= */
const FIREBASE_URL = 'https://firnspur-default-rtdb.europe-west1.firebasedatabase.app';
const TOURS_PATH = 'fixseil/tours';
const HUTS_PATH = 'fixseil/huts';
/* Agenda ist app-übergreifend geteilt zwischen Firnspur und Fixseil. */
const AGENDA_PATH = 'agenda';
const OWN_TOURS_PATH = 'fixseil/tours';
const OTHER_TOURS_PATH = 'tours';
const OWN_APP_LABEL = '🧗 Hochtour';
const OTHER_APP_LABEL = '🎿 Skitour';

async function fbGet(path){
  try{
    const res = await fetch(FIREBASE_URL + '/' + path + '.json');
    if(!res.ok){ dlog('Firebase GET fehlgeschlagen ('+res.status+'): '+path, 'err'); return null; }
    const data = await res.json();
    return data;
  }catch(e){
    dlog('Firebase GET Fehler für "'+path+'": '+(e && e.message ? e.message : e), 'err');
    return null;
  }
}
async function fbSet(path, value){
  try{
    const res = await fetch(FIREBASE_URL + '/' + path + '.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
    if(!res.ok){ dlog('Firebase PUT fehlgeschlagen ('+res.status+'): '+path, 'err'); return false; }
    return true;
  }catch(e){
    dlog('Firebase PUT Fehler für "'+path+'": '+(e && e.message ? e.message : e), 'err');
    return false;
  }
}
async function fbDelete(path){
  try{
    const res = await fetch(FIREBASE_URL + '/' + path + '.json', {method:'DELETE'});
    if(!res.ok){ dlog('Firebase DELETE fehlgeschlagen ('+res.status+'): '+path, 'err'); return false; }
    return true;
  }catch(e){
    dlog('Firebase DELETE Fehler für "'+path+'": '+(e && e.message ? e.message : e), 'err');
    return false;
  }
}

/* ================= Fachliche Daten ================= */
const DIFF = {
  'L':   {label:'Leicht',  color:'var(--d-L)',  desc:'Einfaches Gehgelände, Gletscher ohne grössere Spalten, kein Kletterbedarf.'},
  'WS-': {label:'Wenig schwierig −', color:'var(--d-WS)', desc:'Leichte Kletterstellen (I), einfache Firn- und Gletscherpassagen.'},
  'WS':  {label:'Wenig schwierig', color:'var(--d-WS)', desc:'Kletterstellen bis II, mässig steile Firn- und Eishänge.'},
  'WS+': {label:'Wenig schwierig +', color:'var(--d-WS)', desc:'Kletterstellen bis II+, anspruchsvollere Gletscherpassagen, kurze Grate.'},
  'ZS-': {label:'Ziemlich schwierig −', color:'var(--d-ZS)', desc:'Kletterstellen bis III−, steile Firn-/Eishänge, ausgesetzte Gratstücke.'},
  'ZS':  {label:'Ziemlich schwierig', color:'var(--d-ZS)', desc:'Kletterstellen bis III, längere ausgesetzte Passagen, gute Orientierung nötig.'},
  'ZS+': {label:'Ziemlich schwierig +', color:'var(--d-ZS)', desc:'Kletterstellen bis III+, anhaltend steiles, kombiniertes Gelände.'},
  'S-':  {label:'Schwierig −', color:'var(--d-S)', desc:'Kletterstellen bis IV−, steile Eis-/Firnflanken über 45°.'},
  'S':   {label:'Schwierig', color:'var(--d-S)', desc:'Kletterstellen bis IV, anhaltend schwierige Kletterei kombiniert mit Eis.'},
  'S+':  {label:'Schwierig +', color:'var(--d-S)', desc:'Kletterstellen bis IV+, hohe konditionelle und technische Anforderungen.'},
  'SS':  {label:'Sehr schwierig', color:'var(--d-SS)', desc:'Kletterstellen bis V, äusserst anspruchsvolle, lange und ausgesetzte Touren.'}
};
const DIFF_ORDER = ['L','WS-','WS','WS+','ZS-','ZS','ZS+','S-','S','S+','SS'];

const CLIMB_ORDER = ['1','2a-','2a','2a+','2b-','2b','2b+','2c-','2c','2c+',
  '3a-','3a','3a+','3b-','3b','3b+','3c-','3c','3c+',
  '4a-','4a','4a+','4b-','4b','4b+','4c-','4c','4c+',
  '5a-','5a','5a+','5b-','5b','5b+','5c-','5c','5c+',
  '6a-','6a','6a+','6b-','6b','6b+','6c-','6c','6c+','7a'];

const EXPOSITIONS = ['N','NE','E','SE','S','SW','W','NW'];
const REGION_SUBAREAS = {
  'Wallis': ['Nikolaital/Zermatt','Saastal','Val d\'Anniviers','Lötschental','Goms','Unterwallis','Nufenenpass','Grimselpass','Furkapass','Simplonpass','Grosser St. Bernhard'],
  'Berner Oberland': ['Lauterbrunnental','Haslital','Kandertal','Diemtigtal','Justistal','Saanenland/Gstaad','Grimselpass','Sustenpass','Jochpass','Grosse Scheidegg'],
  'Graubünden': ['Engadin','Prättigau','Albula','Surselva','Bergell','Puschlav','Julierpass','Albulapass','Flüelapass','Ofenpass','Splügenpass','Berninapass'],

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){

}

function cacheLocalSnapshot(){
  try{
    localStorage.setItem('fixseil-cache', JSON.stringify({
      tours: state.tours, huts: state.huts, agenda: state.agenda, cachedAt: new Date().toISOString()
    }));
  }catch(e){ /* z. B. Safari privater Modus – dann halt kein Offline-Cache */ }
}
function loadLocalSnapshot(){
  try{
    const raw = localStorage.getItem('fixseil-cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function loadAll(){
  state.loading = true; render();
  const [toursObj, hutsObj, agendaObj] = await Promise.all([ fbGet(TOURS_PATH), fbGet(HUTS_PATH), fbGet(AGENDA_PATH) ]);

  if(!toursObj && !hutsObj && !agendaObj){
    // Keine Verbindung zur Datenbank – auf lokalen Offline-Cache zurückgreifen
    const cached = loadLocalSnapshot();
    state.loading = false;
    if(cached){
      state.tours = cached.tours || [];
      state.huts = cached.huts || [];
      state.agenda = cached.agenda || [];
      state.offlineMode = true;
      state.offlineCachedAt = cached.cachedAt;
      showToast('Offline – zeigt den zuletzt gespeicherten Stand vom ' + fmtDate(cached.cachedAt), true);
    }else{
      showToast('Konnte nicht mit der Datenbank verbinden. Prüfe deine Internetverbindung.', true);
    }
    render();
    return;
  }

  const tours = (toursObj ? Object.values(toursObj) : []).filter(t=>t && t.id);
  const huts = (hutsObj ? Object.values(hutsObj) : []).filter(h=>h && h.id);
  const agenda = (agendaObj ? Object.values(agendaObj) : []).filter(a=>a && a.id).map(migrateAgendaStatus);
  tours.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  huts.sort((a,b)=> a.name.localeCompare(b.name, 'de'));

  const unsyncedTours = state.tours.filter(x=>x._unsynced && !tours.find(y=>y.id===x.id));
  const unsyncedHuts = state.huts.filter(x=>x._unsynced && !huts.find(y=>y.id===x.id));
  const unsyncedAgenda = state.agenda.filter(x=>x._unsynced && !agenda.find(y=>y.id===x.id));

  state.tours = [...unsyncedTours, ...tours];
  state.huts = [...unsyncedHuts, ...huts];
  state.agenda = [...unsyncedAgenda, ...agenda];
  state.loading = false;
  state.offlineMode = false;
  render();
}

function mergeImportedData(json){
  let data;
  try{ data = JSON.parse(json); }
  catch(e){ throw new Error('Das eingefügte Format ist kein gültiges JSON.'); }
  const importedTours = Array.isArray(data.tours) ? data.tours : [];
  const importedHuts = Array.isArray(data.huts) ? data.huts : [];
  let addedTours = 0, updatedTours = 0, addedHuts = 0, updatedHuts = 0;
  importedTours.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    const idx = state.tours.findIndex(x=>x.id===t.id);
    if(idx>=0){ state.tours[idx] = t; updatedTours++; }
    else { state.tours.unshift(t); addedTours++; }
  });
  importedHuts.forEach(h=>{
    if(!h || !h.id || !h.name) return;
    const idx = state.huts.findIndex(x=>x.id===h.id);
    if(idx>=0){ state.huts[idx] = h; updatedHuts++; }
    else { state.huts.push(h); addedHuts++; }
  });
  importedTours.forEach(t=> saveTourCloud(t).catch(()=>markUnsaved()));
  importedHuts.forEach(h=> saveHutCloud(h).catch(()=>markUnsaved()));
  return {addedTours, updatedTours, addedHuts, updatedHuts};
}

/* ================= Sortierung ================= */
function compareValues(a, b, dir){
  const aEmpty = (a===null || a===undefined || a==='');
  const bEmpty = (b===null || b===undefined || b==='');
  if(aEmpty && bEmpty) return 0;
  if(aEmpty) return 1;
  if(bEmpty) return -1;
  let cmp;
  if(typeof a === 'string' && typeof b === 'string') cmp = a.localeCompare(b, 'de');
  else cmp = a - b;
  return dir==='asc' ? cmp : -cmp;
}
function parseDurationHours(s){
  if(!s) return null;
  const hm = String(s).match(/(\d+):(\d{2})/);
  if(hm) return parseInt(hm[1],10) + parseInt(hm[2],10)/60;
  const num = String(s).match(/[\d.]+/);
  return num ? parseFloat(num[0]) : null;
}
function tourSortKey(t, by){
  if(by==='date') return t.createdAt || '';
  if(by==='name') return (t.name||'').toLowerCase();
  if(by==='region') return (t.region||'').toLowerCase();
  if(by==='difficulty'){ const i = t.difficulty ? DIFF_ORDER.indexOf(t.difficulty) : -1; return i>=0 ? i : null; }
  if(by==='crux'){ const i = t.cruxDifficulty ? CLIMB_ORDER.indexOf(t.cruxDifficulty) : -1; return i>=0 ? i : null; }
  if(by==='elevation'){ const n = parseFloat(t.elevationGain); return isNaN(n) ? null : n; }
  if(by==='duration') return parseDurationHours(t.duration);
  return '';
}
function sortTours(list, sortBy, sortDir){
  const by = sortBy || state.tourSortBy, dir = sortDir || state.tourSortDir;
  return [...list].sort((a,b)=> compareValues(tourSortKey(a,by), tourSortKey(b,by), dir));
}
function hutSortKey(h, by){
  if(by==='date') return h.createdAt || '';
  if(by==='name') return (h.name||'').toLowerCase();
  if(by==='region') return (h.region||'').toLowerCase();
  if(by==='altitude'){ const n = parseFloat(h.altitude); return isNaN(n) ? null : n; }
  return '';
}
function sortHuts(list){
  const by = state.hutSortBy, dir = state.hutSortDir;
  return [...list].sort((a,b)=> compareValues(hutSortKey(a,by), hutSortKey(b,by), dir));
}

/* ================= MSL view ================= */
function filteredMslTours(){
  let list = state.tours.filter(t=> t.tourCategory==='msl');
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(t=> (t.name||'').toLowerCase().includes(q) || (t.region||'').toLowerCase().includes(q) || (t.subregion||'').toLowerCase().includes(q));
  }
  return sortTours(list);
}

function mslViewHtml(){
  const list = filteredMslTours();
  return `
    <div class="toolbar">
      <input class="search-input" type="text" placeholder="Tour oder Region suchen…" value="${esc(state.search)}" data-act="search"/>
      <button class="btn" data-act="add-msl">+ Neue MSL-Tour</button>
    </div>
    <div class="toolbar" style="margin-bottom:14px;">
      <span style="font-size:13px; color:var(--ink-soft);">Sortieren nach</span>
      ${sortControlHtml('msl', MSL_SORT_OPTIONS, state.tourSortBy, state.tourSortDir)}
    </div>
    ${list.length ? `<div class="grid">${list.map(tourCardHtml).join('')}</div>` : emptyMsl()}
  `;
}

function emptyMsl(){
  const hasAny = state.tours.filter(t=>t.tourCategory==='msl').length>0;
  return `<div class="empty">
    <h3>${hasAny ? 'Keine Tour passt zur Suche' : 'Noch keine MSL-Tour erfasst'}</h3>
    <p>${hasAny ? 'Suche anpassen oder eine neue Tour hinzufügen.' : 'Trag die erste Mehrseillängen-Klettertour ein — Schlüsselstelle, Seillängen und Absicherung reichen für den Anfang.'}</p>
    <button class="btn" data-act="add-msl">+ Neue MSL-Tour</button>
  </div>`;
}

function tourCardHtml(t){
  const isMsl = t.tourCategory==='msl';
  const d = t.difficulty ? DIFF[t.difficulty] : null;
  const hut = t.hutId ? state.huts.find(h=>h.id===t.hutId) : null;
  const done = (t.completions && t.completions.length) || t.completed;
  const last = latestCompletion(t.completions);
  return `
  <div class="card" data-act="open-tour" data-id="${t.id}" tabindex="0" role="button">
    <div class="agenda-date-row" style="font-size:12px; margin-bottom:6px;">${isMsl ? '🧗 MSL — Mehrseillängen' : '🏔️ Hochtour'}</div>
    <div class="card-top">
      <h3>${done ? '✓ ' : ''}${esc(t.name)}</h3>
      <div class="badge-row">
        ${isMsl
          ? `${t.mandatoryDifficulty ? `<span class="badge climb">${esc(t.mandatoryDifficulty)}</span>` : ''}`
          : `${d ? `<span class="badge" style="background:${d.color}">${t.difficulty}</span>` : ''}${t.climbGrade ? `<span class="badge climb">🧗 ${esc(t.climbGrade)}</span>` : ''}`
        }
        ${t.targetAltitude ? `<span class="badge" style="background:var(--ice-deep)">${esc(t.targetAltitude)} m</span>` : ''}
      </div>
    </div>
    ${t.routeName ? `<p class="excerpt" style="font-style:italic;">${esc(t.routeName)}</p>` : ''}
    <div class="stat-row">
      <span>↑ <span class="mono">${esc(t.elevationGain||'–')}</span> Hm</span>
      ${t.elevationLoss ? `<span>↓ <span class="mono">${esc(t.elevationLoss)}</span> Hm</span>` : ''}
      ${t.duration ? `<span>⏱ <span class="mono">${esc(t.duration)} h</span></span>` : ''}
    </div>
    ${t.region ? `<p class="excerpt">${esc(t.region)}${t.subregion ? ' – ' + esc(t.subregion) : ''}</p>` : ''}
    ${hut ? `<span class="hut-link-chip">🛖 ${esc(hut.name)}</span>` : ''}
    ${last ? `<span class="hut-link-chip" style="background:#E3EFE6; color:#2F6B44;">✓ ${esc(last.by)} · ${esc(fmtDateOnly(last.date))}${t.completions.length>1 ? ` (+${t.completions.length-1})` : ''}</span>` : ''}
    ${t.crux ? `<div class="conditions-note">⚠ ${esc(t.crux)}</div>` : ''}
    ${t._unsynced ? `<span class="hut-link-chip" style="background:#FBEAE7; color:#B0392C;">⚠ nicht synchronisiert</span>` : ''}
    <div class="meta-line">von ${esc(t.createdBy||'?')} · ${fmtDate(t.createdAt)}</div>
  </div>`;
}

/* ================= Hütten view ================= */
function filteredHuts(){
  let list = state.huts;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(h=> (h.name||'').toLowerCase().includes(q) || (h.region||'').toLowerCase().includes(q));
  }
  return sortHuts(list);
}

function huettenViewHtml(){
  const list = filteredHuts();
  return `
    <div class="toolbar">
      <input class="search-input" type="text" placeholder="Hütte oder Region suchen…" value="${esc(state.search)}" data-act="search"/>
      <button class="btn" data-act="add-hut">+ Neue Hütte</button>
    </div>
    <div class="toolbar" style="margin-bottom:14px;">
      <span style="font-size:13px; color:var(--ink-soft);">Sortieren nach</span>
      ${sortControlHtml('hut', HUT_SORT_OPTIONS, state.hutSortBy, state.hutSortDir)}
    </div>
    ${list.length ? `<div class="grid">${list.map(hutCardHtml).join('')}</div>` : emptyHuts()}
  `;
}

function emptyHuts(){
  const hasAny = state.huts.length>0;
  return `<div class="empty">
    <h3>${hasAny ? 'Keine Hütte passt zu diesem Filter' : 'Noch keine Hütte erfasst'}</h3>
    <p>${hasAny ? 'Suche anpassen oder eine neue Hütte hinzufügen.' : 'Trag eine Hütte ein — Zustieg, Öffnungszeitraum und ob und wann sie bewartet ist.'}</p>
    <button class="btn" data-act="add-hut">+ Neue Hütte</button>
  </div>`;
}

function hutCardHtml(h){
  const linkedCount = state.tours.filter(t=>t.hutId===h.id).length;
  const ad = h.accessDifficulty ? (DIFF[h.accessDifficulty] || DIFF.L) : null;
  const done = (h.completions && h.completions.length) || h.completed;
  const last = latestCompletion(h.completions);
  return `
  <div class="card" data-act="open-hut" data-id="${h.id}" tabindex="0" role="button">
    <div class="card-top">
      <h3>🛖 ${done ? '✓ ' : ''}${esc(h.name)}</h3>
      ${h.altitude ? `<span class="badge" style="background:var(--ice-deep)">${esc(h.altitude)} m</span>` : ''}
    </div>
    ${h.region ? `<p class="excerpt">${esc(h.region)}</p>` : ''}
    ${(h.accessElevation || h.accessDuration || ad) ? `<div class="stat-row">
      ${h.accessElevation ? `<span>↑ <span class="mono">${esc(h.accessElevation)}</span> Hm Zustieg</span>` : ''}
      ${h.accessDuration ? `<span>⏱ <span class="mono">${esc(h.accessDuration)}</span></span>` : ''}
      ${ad ? `<span class="badge" style="background:${ad.color}">${h.accessDifficulty}</span>` : ''}
    </div>` : ''}
    <div class="stat-row">
      ${h.openingPeriod ? `<span>📅 ${esc(h.openingPeriod)}</span>` : ''}
    </div>
    ${h.staffedPeriod ? `<div class="stat-row"><span>👤 bewartet: ${esc(h.staffedPeriod)}</span></div>` : `<div class="stat-row"><span>👤 unbewartet</span></div>`}
    <span class="hut-link-chip">${linkedCount} Tour${linkedCount===1?'':'en'} ab hier</span>
    ${last ? `<span class="hut-link-chip" style="background:#E3EFE6; color:#2F6B44;">✓ ${esc(last.by)} · ${esc(fmtDateOnly(last.date))}${h.completions.length>1 ? ` (+${h.completions.length-1})` : ''}</span>` : ''}
    ${h._unsynced ? `<span class="hut-link-chip" style="background:#FBEAE7; color:#B0392C;">⚠ nicht synchronisiert</span>` : ''}
    <div class="meta-line">von ${esc(h.createdBy||'?')} · ${fmtDate(h.createdAt)}</div>
  </div>`;
}

/* ================= Modal rendering ================= */
function renderModal(){
  const root = document.getElementById('modal-root');
  const m = state.modal;
  let inner = '';
  if(m.type==='name') inner = nameModalHtml();
  else if(m.type==='edit-tour') inner = tourFormHtml(m.payload);
  else if(m.type==='tour-detail') inner = tourDetailHtml(m.payload);
  else if(m.type==='edit-hut') inner = hutFormHtml(m.payload);
  else if(m.type==='hut-detail') inner = hutDetailHtml(m.payload);
  else if(m.type==='export') inner = exportModalHtml();
  else if(m.type==='import') inner = importModalHtml();
  else if(m.type==='add-agenda') inner = agendaFormHtml();
  else if(m.type==='agenda-detail') inner = agendaDetailHtml(m.payload);
  else if(m.type==='add-completion') inner = completionModalHtml(m.payload);
  root.innerHTML = `<div class="overlay" data-act="overlay-close">${inner}</div>`;
  wireModalHandlers();
}

function exportModalHtml(){
  const data = {tours: state.tours, huts: state.huts};
  const json = JSON.stringify(data, null, 2);
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>Exportieren</h2><button class="x-btn" data-act="close-modal">×</button></div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 12px 0;">Lade eine Datei herunter und teile sie mit deinen Freunden (z. B. per WhatsApp/E-Mail) — oder kopiere den Text. Sie importieren die Datei/den Text, um eure Sammlungen zusammenzuführen.</p>
    <div class="form-actions" style="margin-bottom:12px;">
      <button class="btn" data-act="download-export">📥 Als Datei herunterladen</button>
      <button class="btn secondary" data-act="copy-export">In Zwischenablage kopieren</button>
    </div>
    <textarea readonly style="width:100%; min-height:180px; font-family:'JetBrains Mono'; font-size:11.5px;" id="export-text">${esc(json)}</textarea>
    <div class="form-actions">
      <button class="btn secondary" data-act="close-modal">Schliessen</button>
    </div>
  </div>`;
}

function importModalHtml(){
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>Importieren</h2><button class="x-btn" data-act="close-modal">×</button></div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 12px 0;">Wähle eine Datei, die dir jemand geschickt hat, oder füge den Text ein. Bestehende Einträge mit gleicher ID werden aktualisiert, neue werden hinzugefügt.</p>
    <div class="field">
      <label>Datei wählen</label>
      <input type="file" id="import-file" accept="application/json,.json,.txt"/>
    </div>
    <p style="font-size:12.5px; color:var(--ink-soft); margin:10px 0 6px 0;">— oder Text einfügen —</p>
    <textarea placeholder="{ &quot;tours&quot;: [...], &quot;huts&quot;: [...] }" style="width:100%; min-height:160px; font-family:'JetBrains Mono'; font-size:11.5px;" id="import-text"></textarea>
    <div class="form-error" id="import-error" style="display:none;"></div>
    <div class="form-actions">
      <button class="btn secondary" data-act="close-modal">Abbrechen</button>
      <button class="btn" data-act="do-import">Importieren</button>
    </div>

}

function completionModalHtml(payload){
  const today = new Date().toISOString().slice(0,10);
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>Als erledigt markieren</h2><button class="x-btn" data-act="close-modal">×</button></div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 14px 0;">Trag ein, wer die Tour/Hütte wann erledigt hat. Das lässt sich beliebig oft wiederholen, z. B. wenn mehrere Leute sie machen.</p>
    <div class="field"><label>Name</label><input type="text" id="completion-name" value="${esc(state.myName||'')}" placeholder="z. B. Simone" autofocus/></div>
    <div class="field"><label>Datum</label><input type="date" id="completion-date" value="${today}"/></div>
    <div class="form-error" id="completion-error" style="display:none;"></div>
    <div class="form-actions">
      <button class="btn secondary" data-act="close-modal">Abbrechen</button>
      <button class="btn" data-act="submit-completion" data-kind="${payload.kind}" data-id="${payload.id}">Eintragen</button>
    </div>
  </div>`;
}

function nameModalHtml(){
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>Wie heisst du?</h2></div>
    <p style="font-size:14px; color:var(--ink-soft); margin:0 0 14px 0;">Dein Name wird bei Touren und Hütten angezeigt, die du hinzufügst oder bearbeitest. Er wird nur auf diesem Gerät gespeichert.</p>
    <div class="field"><label>Name</label><input type="text" id="name-input" placeholder="z. B. Simone" autofocus/></div>
    <div class="form-actions">
      <button class="btn secondary" data-act="close-modal">Abbrechen</button>
      <button class="btn" data-act="submit-name">Weiter</button>
    </div>
  </div>`;
}

function tourFormHtml(existing){
  const t = existing || {};
  const hutOptions = state.huts.map(h=>`<option value="${h.id}" ${t.hutId===h.id?'selected':''}>${esc(h.name)}</option>`).join('');
  const REGIONS = ['Wallis','Berner Oberland','Graubünden','Tessin','Zentralschweiz','Jura','Freiburger Alpen','Waadtländer Alpen'];
  const isKnownRegion = REGIONS.includes(t.region);
  const selectedMaterial = Array.isArray(t.material) ? t.material : [];
  const ROPE_TYPES = ['Gletscherseil','Einfachseil','Halbseilstrang','Zwillingsseil'];
  const ROPE_LENGTHS = ['30m','40m','50m','60m','70m'];
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>${(existing&&existing.id)?'Tour bearbeiten':'Neue Tour'}</h2><button class="x-btn" data-act="close-modal">×</button></div>
    <form id="tour-form" novalidate>
      <div class="field"><label>Tourtyp</label>
        <div class="chips">
          <button type="button" class="chip type-chip ${(t.tourCategory||'hochtour')==='hochtour'?'on':''}" style="${(t.tourCategory||'hochtour')==='hochtour'?'background:var(--ice-deep)':''}" data-type="hochtour">🏔️ Hochtour</button>
          <button type="button" class="chip type-chip ${t.tourCategory==='msl'?'on':''}" style="${t.tourCategory==='msl'?'background:var(--ice-deep)':''}" data-type="msl">🧗 MSL</button>
        </div>
        <input type="hidden" name="tourCategory" id="tourcategory-hidden" value="${esc(t.tourCategory||'hochtour')}"/>
      </div>
      <div class="row2">
        <div class="field"><label>Gipfel / Bergmassiv *</label><input required name="name" value="${esc(t.name||'')}" placeholder="z. B. Unnerbächhorn"/></div>
        <div class="field"><label>Route</label><input name="routeName" value="${esc(t.routeName||'')}" placeholder="z. B. Südgrat"/></div>
      </div>
      <div class="field"><label>Region</label>
        <div class="chips" id="region-chips">
          ${REGIONS.map(r=>`<button type="button" class="chip region-chip ${t.region===r?'on':''}" style="${t.region===r?'background:var(--ice-deep)':''}" data-region="${r}">${r}</button>`).join('')}
          <button type="button" class="chip region-chip ${t.region && !isKnownRegion?'on':''}" style="${t.region && !isKnownRegion?'background:var(--ice-deep)':''}" data-region="__other__">Anderes</button>
        </div>
        <input type="text" id="region-other-input" value="${!isKnownRegion?esc(t.region||''):''}" placeholder="eigene Region eintragen" style="margin-top:8px; ${t.region && !isKnownRegion?'':'display:none;'}"/>
        <input type="hidden" name="region" id="region-hidden-input" value="${esc(t.region||'')}"/>
      </div>
      <div class="field" id="subregion-field" style="${(isKnownRegion && REGION_SUBAREAS[t.region])?'':'display:none;'}">
        <label>Teilgebiet / Pass (optional)</label>
        <div class="chips" id="subregion-chips">${renderSubregionChipsHtml(t.region, t.subregion)}</div>
        <input type="hidden" name="subregion" id="subregion-hidden" value="${esc(t.subregion||'')}"/>
      </div>

      <h3 style="font-size:15px; margin:16px 0 5px 0; padding-top:10px; border-top:1px solid var(--line);">Schwierigkeit &amp; Sicherheit</h3>

      <div id="hochtour-safety-fields" style="${(t.tourCategory||'hochtour')==='hochtour'?'':'display:none;'}">
        <div class="row2">
          <div class="field"><label>Schwierigkeit (SAC)</label>
            <select name="difficulty">
              <option value="" ${!t.difficulty?'selected':''}>— keine Angabe —</option>
              ${DIFF_ORDER.map(c=>`<option value="${c}" ${t.difficulty===c?'selected':''}>${c} — ${DIFF[c].label}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Maximale Felsschwierigkeit</label>
            <select name="climbGrade">
              <option value="" ${!t.climbGrade?'selected':''}>— keine —</option>

          </div>
          <input type="hidden" name="glacier" id="glacier-hidden" value="${esc(t.glacier||'nein')}"/>
        </div>
        <div class="field"><label>Spaltenrisiko</label>
          <div class="chips">
            <button type="button" class="chip crevasse-chip ${(t.crevasseRisk||'nein')==='nein'?'on':''}" style="${(t.crevasseRisk||'nein')==='nein'?'background:var(--ice-deep)':''}" data-value="nein">Nein</button>
            <button type="button" class="chip crevasse-chip ${t.crevasseRisk==='moeglich'?'on':''}" style="${t.crevasseRisk==='moeglich'?'background:var(--ice-deep)':''}" data-value="moeglich">Möglich</button>

        <div class="field"><label>Absicherung</label>

          <input type="hidden" name="protection" id="protection-hidden" value="${esc(t.protection||'')}"/>
        </div>
        <div class="field"><label>Abstieg</label>
          <div class="chips">
            ${DESCENT_TYPES.map(d=>`<button type="button" class="chip descent-chip ${t.descentType===d?'on':''}" style="${t.descentType===d?'background:var(--ice-deep)':''}" data-value="${d}">${d}</button>`).join('')}
          </div>
          <input type="hidden" name="descentType" id="descent-hidden" value="${esc(t.descentType||'')}"/>
        </div>
        <div class="field"><label>Exposition</label>
          <div class="chips">
            ${EXPOSITIONS.map(x=>`<label class="chip" style="cursor:pointer; ${(t.exposition||[]).includes(x)?'background:var(--ice-deep); color:#fff; border-color:transparent;':''}"><input type="checkbox" name="expositionMsl" value="${x}" ${(t.exposition||[]).includes(x)?'checked':''} style="margin-right:5px;"/>${x}</label>`).join('')}
          </div>
        </div>
        <div class="field"><label>Gefahren</label>
          <div class="chips">
            ${GEFAHREN_MSL.map(g=>`<label class="chip" style="cursor:pointer; ${(t.gefahren||[]).includes(g)?'background:var(--ice-deep); color:#fff; border-color:transparent;':''}"><input type="checkbox" name="gefahrenMsl" value="${g}" ${(t.gefahren||[]).includes(g)?'checked':''} style="margin-right:5px;"/>${g}</label>`).join('')}
          </div>
        </div>
      </div>

      <h3 style="font-size:15px; margin:16px 0 5px 0; padding-top:10px; border-top:1px solid var(--line);">Material</h3>
      <div class="field"><label>Tourenspezifisches Material</label>
        <div class="chips">
          ${MATERIAL_FIXSEIL.map(m=>`<label class="chip" style="cursor:pointer; ${selectedMaterial.includes(m)?'background:var(--ice-deep); color:#fff; border-color:transparent;':''}"><input type="checkbox" name="material" value="${m}" ${selectedMaterial.includes(m)?'checked':''} style="margin-right:5px;"/>${m}</label>`).join('')}

/* ================= Agenda ================= */
function fmtDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtWeekday(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('de-CH', {weekday:'short'});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isPastAgendaItem(item){
  const ref = item.endDate || item.startDate;
  if(!ref) return false;
  return ref < todayStr();
}

/* ================= Agenda: Status-Workflow ================= */
const AGENDA_STATUS_ORDER = ['idee','termin-gesucht','geplant','bestaetigt','abgesagt','durchgefuehrt'];
const AGENDA_STATUS_LABELS = {
  'idee':'Idee', 'termin-gesucht':'Termin gesucht', 'geplant':'Geplant',
  'bestaetigt':'Bestätigt', 'abgesagt':'Abgesagt', 'durchgefuehrt':'Durchgeführt'
};
function migrateAgendaStatus(a){
  if(!a.status){
    a.status = a.cancelled ? 'abgesagt' : (isPastAgendaItem(a) ? 'durchgefuehrt' : 'geplant');
  }
  return a;
}

function agendaViewHtml(){
  const groups = {};
  AGENDA_STATUS_ORDER.forEach(s=> groups[s] = []);
  state.agenda.forEach(a=>{ (groups[a.status] || groups['geplant']).push(a); });
  const descStatuses = ['abgesagt','durchgefuehrt'];
  AGENDA_STATUS_ORDER.forEach(s=>{
    groups[s].sort((a,b)=> descStatuses.includes(s)
      ? (b.startDate||'').localeCompare(a.startDate||'')
      : (a.startDate||'').localeCompare(b.startDate||''));
  });
  return `
    <div class="toolbar">
      <div></div>
      <button class="btn" data-act="add-agenda">+ Neuer Termin</button>
    </div>
    ${state.agenda.length===0 ? `<div class="empty">
      <h3>Noch keine Termine geplant</h3>
      <p>Schlag einen Zeitraum und eine Tour vor — andere können sich direkt eintragen.</p>
      <button class="btn" data-act="add-agenda">+ Neuer Termin</button>
    </div>` : AGENDA_STATUS_ORDER.map(s=>`
    <div class="detail-section" style="margin-bottom:24px;">
      <h4>${AGENDA_STATUS_LABELS[s]} (${groups[s].length})</h4>
      ${groups[s].length ? `<div class="grid" style="margin-top:6px;">${groups[s].map(agendaCardHtml).join('')}</div>` : `<p style="font-size:13px; color:var(--ink-faint); margin:4px 0 0 0;">—</p>`}
    </div>`).join('')}
  `;
}

function agendaStatusSelectHtml(a){
  return `<select class="agenda-status-select" data-id="${a.id}" style="margin-top:8px; width:auto; padding:6px 10px; font-size:13px;">
    ${AGENDA_STATUS_ORDER.map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${AGENDA_STATUS_LABELS[s]}</option>`).join('')}
  </select>`;
}

function agendaCardHtml(a){
  const dateLabel = a.endDate && a.endDate!==a.startDate
    ? `${fmtWeekday(a.startDate)}, ${fmtDateShort(a.startDate)} – ${fmtWeekday(a.endDate)}, ${fmtDateShort(a.endDate)}`
    : `${fmtWeekday(a.startDate)}, ${fmtDateShort(a.startDate)}`;
  const dim = (a.status==='abgesagt') ? 'opacity:0.55;' : '';
  return `
  <div class="card" data-id="${a.id}" style="${dim}">
    <div class="agenda-date-row" data-act="open-agenda" data-id="${a.id}" style="cursor:pointer;">📅 ${dateLabel}</div>
    <div class="card-top" data-act="open-agenda" data-id="${a.id}" style="cursor:pointer;">
      <h3>${a.status==='abgesagt' ? '❌ ' : ''}${esc(a.tourName || 'Termin')}</h3>
      <span class="badge" style="background:${a.type==='hochtour'?'var(--ice-deep)':'var(--ice)'}">${a.type==='hochtour'?'🧗 Hochtour':'🎿 Skitour'}</span>

async function submitAgendaForm(form){
  const startDate = form.startDate;
  if(!startDate){ showFormError('agenda-form', 'Bitte ein Startdatum wählen.'); return; }
  let tourName = '';
  if(form.tourChoice && form.tourChoice!=='custom'){
    const [src, refId] = form.tourChoice.split(':');
    const list = src==='own' ? state.tours : state.otherAppTours;
    const ref = list.find(t=>t.id===refId);
    tourName = ref ? ref.name : (form.customName||'').trim();
  }else{
    tourName = (form.customName||'').trim();
  }
  if(!tourName){ showFormError('agenda-form', 'Bitte eine Tour auswählen oder einen Vorschlag eintragen.'); return; }

  const a = {
    id: uid('a'), createdBy: state.myName, createdAt: new Date().toISOString(),
    type: form.type||'ski', startDate, endDate: form.endDate||'',
    tourName, meetingPoint: form.meetingPoint||'', note: form.note||'',
    participants: [{by: state.myName, joinedAt: new Date().toISOString()}],
    status: 'geplant'
  };
  state.agenda.unshift(a);
  closeModal();
  state.modal = {type:'agenda-detail', payload:a.id};
  render();
  const ok = await saveAgendaCloud(a).catch(()=>false);
  a._unsynced = !ok;
  if(!ok){ markUnsaved(); showToast('Termin lokal gespeichert, aber nicht synchronisiert.', true); }
  else{ showToast('Termin vorgeschlagen.'); }
  render();
}

async function toggleParticipation(id){
  ensureName(async ()=>{
    const a = state.agenda.find(x=>x.id===id);
    if(!a) return;
    a.participants = a.participants || [];
    const idx = a.participants.findIndex(p=>p.by===state.myName);
    if(idx>=0) a.participants.splice(idx,1);
    else a.participants.push({by: state.myName, joinedAt: new Date().toISOString()});
    render();
    const ok = await saveAgendaCloud(a).catch(()=>false);
    a._unsynced = !ok;
    if(!ok) markUnsaved();
    render();
  });
}

async function setAgendaStatus(id, status){
  const a = state.agenda.find(x=>x.id===id);
  if(!a || !AGENDA_STATUS_ORDER.includes(status)) return;
  a.status = status;
  render();
  const ok = await saveAgendaCloud(a).catch(()=>false);
  a._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
}

/* ================= Abgeschlossen view ================= */
function buildPersonGroups(){
  const groups = {};
  state.tours.forEach(t=>{
    (t.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].tours.find(x=>x.id===t.id)) groups[name].tours.push(t);
    });
  });
  state.huts.forEach(h=>{
    (h.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].huts.find(x=>x.id===h.id)) groups[name].huts.push(h);
    });
  });
  return groups;
}

function abgeschlossenViewHtml(){
  const groups = buildPersonGroups();
  const names = Object.keys(groups);
  if(!names.length){
    return `<div class="empty">
      <h3>Noch nichts als erledigt markiert</h3>
      <p>Öffne eine Tour oder Hütte und tippe auf "Als erledigt markieren", um Name und Datum einzutragen.</p>
    </div>`;
  }
  names.sort((a,b)=>{
    if(state.myName){
      if(a===state.myName) return -1;
      if(b===state.myName) return 1;
    }
    return a.localeCompare(b, 'de');
  });
  return names.map(name=>{
    const g = groups[name];
    const isMe = state.myName && name===state.myName;
    const total = g.tours.length + g.huts.length;
    return `<div class="detail-section" style="margin-bottom:28px;">
      <h4>${isMe ? '⭐ Meine Liste' : esc(name)} (${total})</h4>
      ${g.tours.length ? `<div class="grid" style="margin-top:6px;">${g.tours.map(tourCardHtml).join('')}</div>` : ''}
      ${g.huts.length ? `<div class="grid" style="margin-top:${g.tours.length?12:6}px;">${g.huts.map(hutCardHtml).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function openMarkDone(kind, id){
  state.modal = {type:'add-completion', payload:{kind, id}};
  render();
}

async function submitCompletion(kind, id, name, date){
  const n = (name||'').trim();
  if(!n){
    const box = document.getElementById('completion-error');
    if(box){ box.style.display='block'; box.textContent = 'Bitte einen Namen eingeben.'; }
    return;
  }
  const entry = {by:n, date: date || new Date().toISOString().slice(0,10), addedAt: new Date().toISOString()};
  if(kind==='tour'){
    const t = state.tours.find(x=>x.id===id);
    if(!t) return;
    t.completions = t.completions || [];
    t.completions.push(entry);
    closeModal();
    state.modal = {type:'tour-detail', payload:id};
    render();
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(!ok){ markUnsaved(); showToast('Eintrag lokal gespeichert, aber nicht synchronisiert.', true); }
    else{ showToast('Als erledigt eingetragen.'); }
    render();
  }else{
    const h = state.huts.find(x=>x.id===id);
    if(!h) return;
    h.completions = h.completions || [];
    h.completions.push(entry);
    closeModal();
    state.modal = {type:'hut-detail', payload:id};
    render();
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(!ok){ markUnsaved(); showToast('Eintrag lokal gespeichert, aber nicht synchronisiert.', true); }
    else{ showToast('Als erledigt eingetragen.'); }
    render();
  }
}

/* ================= Event wiring ================= */
function wireGlobalHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act');
    if(act==='view-touren') el.onclick = ()=>setView('touren');
    else if(act==='view-msl') el.onclick = ()=>setView('msl');
    else if(act==='view-huetten') el.onclick = ()=>setView('huetten');
    else if(act==='view-agenda') el.onclick = ()=>setView('agenda');
    else if(act==='view-abgeschlossen') el.onclick = ()=>setView('abgeschlossen');
    else if(act==='change-name') el.onclick = ()=>{ state.modal = {type:'name'}; render(); };
    else if(act==='export-data') el.onclick = openExport;
    else if(act==='import-data') el.onclick = openImport;
    else if(act==='add-tour') el.onclick = openAddTour;
    else if(act==='add-msl') el.onclick = openAddMsl;
    else if(act==='add-hut') el.onclick = openAddHut;
    else if(act==='add-agenda') el.onclick = openAddAgenda;
    else if(act==='open-tour') { el.onclick = ()=>openTourDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openTourDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-hut') { el.onclick = ()=>openHutDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openHutDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-agenda') { el.onclick = ()=>{ state.modal={type:'agenda-detail', payload:el.getAttribute('data-id')}; render(); }; }
    else if(act==='filter-diff') el.onclick = ()=>toggleDiffFilter(el.getAttribute('data-code'));
    else if(act==='filter-category') el.onclick = ()=>{ state.tourCategoryFilter = el.getAttribute('data-cat'); render(); };
    else if(act==='sort-by') el.onchange = (e)=>{ const kind=el.getAttribute('data-kind'); if(kind==='hut') state.hutSortBy=e.target.value; else state.tourSortBy=e.target.value; renderListOnly(); };
    else if(act==='sort-dir') el.onclick = ()=>{ const kind=el.getAttribute('data-kind'); if(kind==='hut') state.hutSortDir = state.hutSortDir==='asc'?'desc':'asc'; else state.tourSortDir = state.tourSortDir==='asc'?'desc':'asc'; renderListOnly(); };
    else if(act==='search') el.oninput = (e)=>{ state.search = e.target.value; renderListOnly(); };
  });
  app.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });
}

function renderListOnly(){
  const main = document.querySelector('main');
  if(!main) return;
  main.innerHTML = state.loading ? `<div class="loading">Lade…</div>` : (state.view==='touren' ? tourenViewHtml() : state.view==='msl' ? mslViewHtml() : state.view==='huetten' ? huettenViewHtml() : state.view==='agenda' ? agendaViewHtml() : abgeschlossenViewHtml());
  wireGlobalHandlers();
  const input = main.querySelector('.search-input');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

function wireModalHandlers(){
  const root = document.getElementById('modal-root');
  dlog('Modal gerendert: ' + (state.modal ? state.modal.type : 'keins'));
  const overlay = root.querySelector('.overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  root.querySelectorAll('[data-stop]').forEach(el=> el.addEventListener('click', e=>e.stopPropagation()));

  root.querySelectorAll('[data-act="close-modal"]').forEach(el=> el.onclick = closeModal);

  const markDoneBtn = root.querySelector('[data-act="mark-done"]');
  if(markDoneBtn) markDoneBtn.onclick = ()=> openMarkDone(markDoneBtn.getAttribute('data-kind'), markDoneBtn.getAttribute('data-id'));

  const submitCompletionBtn = root.querySelector('[data-act="submit-completion"]');
  if(submitCompletionBtn) submitCompletionBtn.onclick = ()=>{
    const name = document.getElementById('completion-name').value;
    const date = document.getElementById('completion-date').value;
    submitCompletion(submitCompletionBtn.getAttribute('data-kind'), submitCompletionBtn.getAttribute('data-id'), name, date);
  };

  const toggleParticipationBtn = root.querySelector('[data-act="toggle-participation"]');
  if(toggleParticipationBtn) toggleParticipationBtn.onclick = ()=> toggleParticipation(toggleParticipationBtn.getAttribute('data-id'));
  root.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });

  const agendaForm = document.getElementById('agenda-form');
  if(agendaForm){
    const tourSelect = document.getElementById('agenda-tour-select');
    const customField = document.getElementById('agenda-custom-field');
    function syncCustomFieldVisibility(){
      customField.style.display = (tourSelect.value==='custom') ? '' : 'none';
    }
    if(tourSelect){ tourSelect.addEventListener('change', syncCustomFieldVisibility); syncCustomFieldVisibility(); }
    const agendaSaveBtn = document.getElementById('agenda-save-btn');
    if(agendaSaveBtn){
      agendaSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        const fd = new FormData(agendaForm);
        const data = Object.fromEntries(fd.entries());
        submitAgendaForm(data);
      });
    }
  }

  const copyExportBtn = root.querySelector('[data-act="copy-export"]');
  if(copyExportBtn) copyExportBtn.onclick = async ()=>{
    const ta = document.getElementById('export-text');
    try{
      await navigator.clipboard.writeText(ta.value);
      showToast('In Zwischenablage kopiert.');
    }catch(e){
      ta.select();
      showToast('Automatisches Kopieren nicht möglich — Text ist markiert, bitte manuell kopieren.', true);
    }
  };

  const downloadExportBtn = root.querySelector('[data-act="download-export"]');
  if(downloadExportBtn) downloadExportBtn.onclick = ()=>{
    try{
      const ta = document.getElementById('export-text');
      const blob = new Blob([ta.value], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `fixseil-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      markSaved();
      render();
      showToast('Datei heruntergeladen. Jetzt mit deinen Freunden teilen!');
    }catch(e){
      showToast('Download fehlgeschlagen: '+(e&&e.message?e.message:e), true);
    }
  };

  const importFileInput = root.querySelector('#import-file');
  if(importFileInput) importFileInput.addEventListener('change', ()=>{
    const file = importFileInput.files && importFileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ document.getElementById('import-text').value = reader.result; };
    reader.onerror = ()=>{ showToast('Datei konnte nicht gelesen werden.', true); };
    reader.readAsText(file);
  });

  const doImportBtn = root.querySelector('[data-act="do-import"]');
  if(doImportBtn) doImportBtn.onclick = ()=>{
    const val = document.getElementById('import-text').value;
    const errBox = document.getElementById('import-error');
    try{
      const res = mergeImportedData(val);
      closeModal();
      render();
      showToast(`Importiert: ${res.addedTours} neue Touren, ${res.updatedTours} aktualisiert, ${res.addedHuts} neue Hütten, ${res.updatedHuts} aktualisiert.`);
    }catch(e){
      errBox.style.display = 'block';
      errBox.textContent = e.message || 'Import fehlgeschlagen.';
    }
  };
  const submitNameBtn = root.querySelector('[data-act="submit-name"]');
  if(submitNameBtn) submitNameBtn.onclick = ()=>{
    const val = document.getElementById('name-input').value;
    submitName(val);
  };
  const nameInput = document.getElementById('name-input');
  if(nameInput) nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitName(nameInput.value); } });

  const tourForm = document.getElementById('tour-form');
  dlog('tour-form im DOM gefunden: ' + !!tourForm);
  if(tourForm){
    // Tourtyp-Chips (Hochtour / MSL) — blendet passenden Sicherheits-Block ein/aus
    const hochtourFields = document.getElementById('hochtour-safety-fields');
    const mslFields = document.getElementById('msl-safety-fields');
    tourForm.querySelectorAll('.type-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const type = chip.getAttribute('data-type');
        tourForm.querySelectorAll('.type-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        document.getElementById('tourcategory-hidden').value = type;
        if(hochtourFields) hochtourFields.style.display = (type==='hochtour') ? '' : 'none';
        if(mslFields) mslFields.style.display = (type==='msl') ? '' : 'none';
      });
    });
    // Generische Single-Select-Chip-Gruppe (Gletscher, Spaltenrisiko, Absicherung, Abstieg)
    function wireSingleSelectChips(className, hiddenId){
      const hidden = document.getElementById(hiddenId);
      const buttons = tourForm.querySelectorAll('.'+className);
      buttons.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          buttons.forEach(b=>{ b.classList.remove('on'); b.style.background=''; });
          btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
          if(hidden) hidden.value = btn.getAttribute('data-value');
        });
      });
    }
    wireSingleSelectChips('glacier-chip', 'glacier-hidden');
    wireSingleSelectChips('crevasse-chip', 'crevasse-hidden');
    wireSingleSelectChips('protection-chip', 'protection-hidden');
    wireSingleSelectChips('descent-chip', 'descent-hidden');
    // Gletscher "Ja" → Spaltenrettungsset im Material automatisch anhaken
    function checkMaterialCheckbox(name){
      const cb = tourForm.querySelector(`input[name="material"][value="${name}"]`);
      if(!cb || cb.checked) return;
      cb.checked = true;
      const label = cb.closest('label.chip');
      if(label){ label.style.background='var(--ice-deep)'; label.style.color='#fff'; label.style.borderColor='transparent'; }
    }
    tourForm.querySelectorAll('.glacier-chip').forEach(btn=>{
      if(btn.getAttribute('data-value')==='ja'){
        btn.addEventListener('click', ()=> checkMaterialCheckbox('Spaltenrettungsset'));
      }
    });
    // Region-Chips
    const regionHidden = document.getElementById('region-hidden-input');
    const regionOtherInput = document.getElementById('region-other-input');
    const subregionField = document.getElementById('subregion-field');
    const subregionChipsWrap = document.getElementById('subregion-chips');
    const subregionHidden = document.getElementById('subregion-hidden');
    tourForm.querySelectorAll('.region-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        tourForm.querySelectorAll('.region-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        const region = chip.getAttribute('data-region');
        if(region==='__other__'){
          regionOtherInput.style.display = '';
          regionOtherInput.focus();
          regionHidden.value = regionOtherInput.value;
          if(subregionField){ subregionField.style.display = 'none'; subregionHidden.value = ''; }
        }else{
          regionOtherInput.style.display = 'none';
          regionHidden.value = region;
          if(subregionField && subregionChipsWrap){
            const subs = REGION_SUBAREAS[region] || [];
            if(subs.length){
              subregionChipsWrap.innerHTML = renderSubregionChipsHtml(region, '');
              subregionHidden.value = '';
              subregionField.style.display = '';
            }else{
              subregionField.style.display = 'none';
              subregionHidden.value = '';
            }
          }
        }
      });
    });
    if(regionOtherInput) regionOtherInput.addEventListener('input', ()=>{ regionHidden.value = regionOtherInput.value; });
    // Teilgebiet-Chips (Event-Delegation, da dynamisch neu erzeugt)
    if(subregionChipsWrap){
      subregionChipsWrap.addEventListener('click', (e)=>{
        const btn = e.target.closest('.subregion-chip');
        if(!btn) return;
        subregionChipsWrap.querySelectorAll('.subregion-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
        subregionHidden.value = btn.getAttribute('data-subregion');
      });
    }
    // Seil-Chips
    const ropeTypeHidden = document.getElementById('rope-type-hidden');
    tourForm.querySelectorAll('.rope-type-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        tourForm.querySelectorAll('.rope-type-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        ropeTypeHidden.value = chip.getAttribute('data-rope-type');
      });
    });
    const ropeLengthHidden = document.getElementById('rope-length-hidden');
    tourForm.querySelectorAll('.rope-length-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        tourForm.querySelectorAll('.rope-length-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        ropeLengthHidden.value = chip.getAttribute('data-rope-length');
      });
    });

    const tourSaveBtn = document.getElementById('tour-save-btn');
    if(tourSaveBtn){
      tourSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        dlog('Klick auf Tour-Speichern-Button registriert — speichere direkt (ohne Formular-Submit)');
        try{
          const fd = new FormData(tourForm);
          const data = Object.fromEntries(fd.entries());
          data.material = fd.getAll('material');
          data.expositionHochtour = fd.getAll('expositionHochtour');
          data.gefahrenHochtour = fd.getAll('gefahrenHochtour');
          data.expositionMsl = fd.getAll('expositionMsl');
          data.gefahrenMsl = fd.getAll('gefahrenMsl');
          if(!data.name || !data.name.trim()){
            dlog('Validierung fehlgeschlagen: Name fehlt', 'err');
            showFormError('tour-form', 'Bitte einen Namen für die Tour eingeben (ganz oben im Formular).');
            return;
          }
          dlog('Validierung ok, rufe submitTourForm auf für "'+data.name+'"');
          submitTourForm(data, state.modal.payload);
        }catch(err){
          dlog('Unerwarteter Fehler beim Speichern: '+(err && err.message ? err.message : err), 'err');
          showFormError('tour-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
  }

  const hutForm = document.getElementById('hut-form');
  if(hutForm){
    const hutSaveBtn = document.getElementById('hut-save-btn');
    if(hutSaveBtn){
      hutSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        dlog('Klick auf Hütte-Speichern-Button registriert — speichere direkt (ohne Formular-Submit)');
        try{
          const fd = new FormData(hutForm);
          const data = Object.fromEntries(fd.entries());
          if(!data.name || !data.name.trim()){
            dlog('Validierung fehlgeschlagen: Name fehlt', 'err');
            showFormError('hut-form', 'Bitte einen Namen für die Hütte eingeben (ganz oben im Formular).');
            return;
          }
          dlog('Validierung ok, rufe submitHutForm auf für "'+data.name+'"');
          submitHutForm(data, state.modal.payload);
        }catch(err){
          dlog('Unerwarteter Fehler beim Speichern: '+(err && err.message ? err.message : err), 'err');
          showFormError('hut-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
  }

  // Dezente Löschen-Funktion mit zweistufiger Bestätigung (Tour & Hütte)
  function wireDeleteConfirm(prefix, removeFn, onDeletedGoTo){
    const trigger = document.getElementById(`delete-${prefix}-trigger`);
    const confirmBox = document.getElementById(`delete-${prefix}-confirm`);
    const yesBtn = document.getElementById(`delete-${prefix}-yes`);
    const noBtn = document.getElementById(`delete-${prefix}-no`);
    if(!trigger) return;
    trigger.addEventListener('click', ()=>{
      trigger.style.display = 'none';
      confirmBox.style.display = '';
    });
    if(noBtn) noBtn.addEventListener('click', ()=>{
      confirmBox.style.display = 'none';
      trigger.style.display = '';
    });
    if(yesBtn) yesBtn.addEventListener('click', ()=>{
      removeFn(yesBtn.getAttribute('data-id'));
      closeModal();
      showToast(onDeletedGoTo + ' gelöscht.');
    });
  }
  wireDeleteConfirm('tour', removeTour, 'Tour');
  wireDeleteConfirm('hut', removeHut, 'Hütte');

  root.querySelectorAll('[data-act="edit-tour"]').forEach(el=> el.onclick = ()=>openEditTour(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="edit-hut"]').forEach(el=> el.onclick = ()=>openEditHut(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-hut"]').forEach(el=> el.onclick = ()=>openHutDetail(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-tour"]').forEach(el=> el.onclick = ()=>openTourDetail(el.getAttribute('data-id')));
}

/* ================= Global error safety net ================= */
window.addEventListener('error', function(e){
  console.error('Unhandled error', e.error || e.message);
  showToast('Es gab ein unerwartetes Problem: ' + (e.message || 'unbekannter Fehler') + '. Bitte nochmal versuchen.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection', e.reason);
  showToast('Es gab ein unerwartetes Problem beim Speichern. Bitte nochmal versuchen.', true);
});
window.addEventListener('beforeunload', function(e){
  if(state.hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= Init ================= */
try{
  const savedName = localStorage.getItem('fixseil-myname');
  if(savedName) state.myName = savedName;
}catch(e){}
dlog('App gestartet — Version ' + APP_VERSION);
loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      dlog('Service Worker konnte nicht registriert werden.', 'err');
    });
  });
}
</script>
</body>
