<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="./IMG-20260816-WA0023.jpg">
<link rel="apple-touch-icon" href="./IMG-20260816-WA0023.jpg">
<meta name="theme-color" content="#4A3524">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1EAE0;
    --paper:#FFFFFF;
    --ink:#2B2019;
    --ink-soft:#6B5B4C;
    --ink-faint:#9C8C7B;
    --ice:#7C5B3E;
    --ice-deep:#4A3524;
    --ice-light:#E6DAC5;
    --signal:#D9A441;
    --signal-deep:#A87A1F;
    --line:#DED0B8;
    --danger:#B0392C;
    --ok:#3C7A52;
    --shadow: 0 2px 10px rgba(43,32,25,0.10);
    --shadow-lg: 0 12px 32px rgba(43,32,25,0.20);
    --radius: 3px;

    --d-L:#6C93AC;
    --d-WS:#4E7A93;
    --d-ZS:#C9A227;
    --d-S:#D97B3E;
    --d-SS:#C2452D;
    --d-AS:#8A2E2E;
    --d-EX:#2B1416;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--ice-deep);}

  /* ===== App-Umschalter ===== */
  .app-switch-bar{
    background:var(--ink); display:flex; justify-content:center; gap:0;
  }
  .app-switch-bar a{
    color:rgba(255,255,255,0.55); text-decoration:none; font-size:13.5px; font-weight:700;
    letter-spacing:0.03em; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; flex:1; max-width:220px; text-transform:uppercase;
    border-bottom:3px solid transparent; transition:background .12s ease, color .12s ease;
  }
  .app-switch-bar a:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .app-switch-bar a.active{color:#fff; border-bottom-color:var(--signal, #F2B705); background:rgba(255,255,255,0.06);}

  /* ===== Fels-Hero ===== */
  .hero{
    color:#fff;
    padding:28px 20px 34px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image: url('IMG_20260811_073051812_HDR.jpg');
    background-size: 115%;
    background-position: center 55%;
    filter: brightness(1.15) contrast(1.05);
    z-index:0;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(74,53,36,0.62) 0%, rgba(124,91,62,0.40) 55%, rgba(159,131,101,0.24) 100%);
    z-index:0;
  }
  .hero-top, .hero .tabs{ position:relative; z-index:1; }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:44px; color:#fff; letter-spacing:1px; font-weight:800;}
  .brand .tag{font-family:'Source Sans 3'; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ice-light); font-style:italic;}
  .who{
    font-size:13px; color:var(--ice-light); text-align:right;
  }
  .who-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .who button{
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:12px; margin-left:6px;
  }
  .who button:hover{background:rgba(255,255,255,0.15);}

  /* ===== Wegweiser-Tabs ===== */
  .tabs{
    max-width:1000px; margin:0 auto; padding:0 20px;
    display:flex; gap:14px; transform:translateY(20px);
    position:relative; z-index:2;
  }
  .tab{
    background:none; border:none; box-shadow:none; clip-path:none;
    color:rgba(255,255,255,0.62);
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    font-size:14px;
    padding:10px 14px 8px 14px;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:#fff; border-bottom-color:var(--signal, #F2B705);}
  .tab:hover{color:#fff;}

  main{max-width:1000px; margin:0 auto; padding:40px 20px 80px 20px;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-input{
    flex:1; min-width:180px;
    padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .btn{
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ice-deep);
    background:var(--ice-deep); color:#fff; font-weight:600; font-size:14px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ice);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.secondary:hover{background:var(--ice-light);}
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--ice-deep); outline-offset:2px;}

  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .sort-control{display:flex; align-items:center; gap:6px;}
  .sort-control select{
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px;
    font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .sort-dir-btn{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff;
    width:32px; height:32px; font-size:15px; cursor:pointer; color:var(--ink);
  }
  .sort-dir-btn:hover{background:var(--ice-light);}
  .chip{
    padding:4px 10px; border-radius:16px; border:1px solid var(--line);
    background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.3;
  }
  .chip.on{color:#fff; border-color:transparent;}

  /* ===== Karten ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ice-light); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-left-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); cursor:pointer; border-left-color:var(--ice);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .agenda-date-row{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em;
    font-weight:700; font-size:15px; color:var(--ice-deep); margin-bottom:2px;
  }
  .card h3{font-size:17px; color:var(--ink); line-height:1.25;}
  .badge{
    flex-shrink:0; font-family:'JetBrains Mono'; font-weight:700; font-size:12px;
    color:#fff; padding:3px 8px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
  .badge.climb{background:var(--ice-deep);}
  .stat-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap;}
  .stat-row .mono{color:var(--ink); font-weight:600;}
  .card p.excerpt{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .hut-link-chip{
    align-self:flex-start; font-size:12px; background:var(--ice-light); color:var(--ice-deep);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .conditions-note{
    font-size:12.5px; background:#F6E9C9; border-left:3px solid var(--signal-deep);
    padding:6px 9px; color:#5B4200; border-radius:2px;
  }
  .meta-line{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty h3{color:var(--ink); font-size:18px; margin-bottom:8px;}
  .empty .btn{margin-top:16px;}

  /* ===== Legende ===== */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .legend .chip{cursor:default; display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(30,22,16,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); width:100%; max-width:620px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:28px; margin:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px;}
  .modal-head h2{font-size:22px;}
  .x-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; padding:2px 6px;}
  .x-btn:hover{color:var(--ink);}

  .field{margin-bottom:9px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:3px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .fab-save{
    position:fixed; bottom:20px; right:20px; z-index:70;
    background:var(--ice-deep); color:#fff; border:none; border-radius:50px;
    padding:14px 24px; font-weight:700; font-size:14px; box-shadow:var(--shadow-lg);
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .fab-save:hover{background:var(--ice);}
  .fab-save[disabled]{opacity:0.6; cursor:default;}
  .emergency-tab{
    position:fixed; top:50%; left:0; transform:translateY(-50%); z-index:70;
    background:var(--danger); color:#fff; border:none;
    padding:12px 5px; border-radius:0 8px 8px 0;
    font-family:'Oswald'; font-size:11px; font-weight:700; letter-spacing:0.08em;
    writing-mode:vertical-rl; text-orientation:mixed;
    box-shadow:var(--shadow); cursor:pointer; opacity:0.72;
    touch-action:none;
  }
  .emergency-tab:hover{opacity:1;}

  /* ===== Detailansicht ===== */
  .detail-badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{
    font-family:'Oswald'; text-transform:uppercase; font-size:13px; letter-spacing:0.05em;
    color:var(--ice-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  }
  .detail-section p{font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap; margin:0;}
  .detail-stats{display:flex; gap:22px; flex-wrap:wrap; margin:14px 0;}
  .detail-stat .num{font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--ink);}
  .detail-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .detail-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#FBEAE7;}

  .cond-box{background:var(--ice-light); border-radius:var(--radius); padding:12px; margin-top:14px;}
  .cond-box textarea{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13.5px; min-height:44px;}
  .cond-box .meta-line{margin-top:6px;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-family:'Oswald'; letter-spacing:0.05em; text-transform:uppercase; font-size:13px;}

  .form-error{
    background:#FBEAE7; border:1px solid var(--danger); color:#7A2A1F;
    padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ice-deep); color:#fff; padding:11px 20px; border-radius:20px;
    font-size:13.5px; box-shadow:var(--shadow-lg); z-index:100; max-width:90%; text-align:center;
  }
  .toast.error{background:var(--danger);}
  .btn[disabled]{opacity:0.6; cursor:default;}

  .backup-banner{
    background:#B0392C; color:#fff; padding:12px 20px; text-align:center;
    font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:80;
  }
  .backup-banner button{
    background:#fff; color:#B0392C; border:none; border-radius:20px; padding:6px 16px;
    font-weight:700; font-size:13px;
  }

  .debug-toggle{
    display:none;
    position:fixed; bottom:16px; right:16px; z-index:90;
    background:var(--ink); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12px; font-family:'JetBrains Mono'; opacity:0.55;
    box-shadow:var(--shadow);
  }
  .debug-panel{
    position:fixed; bottom:60px; right:16px; left:16px; max-width:520px; margin:0 auto;
    max-height:50vh; overflow-y:auto; background:#1C1510; color:#E9DFCF;
    border-radius:var(--radius); padding:12px; font-family:'JetBrains Mono'; font-size:11.5px;
    z-index:91; box-shadow:var(--shadow-lg); line-height:1.5;
  }
  .debug-panel .row{border-bottom:1px solid #3A2E22; padding:4px 0;}
  .debug-panel .row.err{color:#FF8A75;}
  .debug-panel .row.ok{color:#8FD9A8;}
  .debug-panel .head{display:flex; justify-content:space-between; margin-bottom:6px;}
  .debug-panel .head button{background:none; border:1px solid #554435; color:#E9DFCF; border-radius:4px; padding:2px 8px; font-size:11px;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .brand h1{font-size:32px;}
    .hero{padding-bottom:30px;}
    .tabs{transform:translateY(16px);}
    .tab{padding:8px 16px 8px 14px; font-size:12.5px;}
  }
</style>
</head>

/* =================================================================
   Speicherung: Diese Version läuft als eigenständige Webseite (nicht
   im Claude-Artefakt), daher funktioniert echter Netzwerkzugriff zu
   Firebase. Alle Touren/Hütten werden live in Firebase Realtime
   Database gespeichert und zwischen allen Nutzern synchronisiert.

/* ================= Lokaler Offline-Cache ================= */
function cacheLocalSnapshot(){
  try{
    localStorage.setItem('fixseil-cache', JSON.stringify({
      tours: state.tours, huts: state.huts, agenda: state.agenda, cachedAt: new Date().toISOString()
    }));
  }catch(e){ /* z. B. Safari privater Modus – dann halt kein Offline-Cache */ }
}
function loadLocalSnapshot(){
  try{
    const raw = localStorage.getItem('fixseil-cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function loadAll(){
  state.loading = true; render();
  const [toursObj, hutsObjResult, agendaObj] = await Promise.all([ fbGet(TOURS_PATH), fbGet(HUTS_PATH), fbGet(AGENDA_PATH) ]);
  let hutsObj = hutsObjResult;
  const cached = loadLocalSnapshot();

  // Einmalige Migration: alte, getrennte Fixseil-Hütten in die neue,
  // gemeinsame Sammlung übernehmen (nur solange noch nicht geschehen).
  if(!localStorage.getItem('fixseil-huts-migrated')){
    try{
      const legacyObj = await fbGet(LEGACY_HUTS_PATH);
      const legacyHuts = legacyObj ? Object.values(legacyObj).filter(h=>h && h.id) : [];
      const currentIds = new Set(Object.keys(hutsObj || {}));
      const toMigrate = legacyHuts.filter(h=>!currentIds.has(h.id));
      if(toMigrate.length){
        await Promise.all(toMigrate.map(h=> fbSet(HUTS_PATH+'/'+h.id, h)));
        if(!hutsObj) hutsObj = {};
        toMigrate.forEach(h=>{ hutsObj[h.id] = h; });
        dlog('Migration: ' + toMigrate.length + ' Hütte(n) aus altem Fixseil-Bestand übernommen.');
      }
      localStorage.setItem('fixseil-huts-migrated', '1');
    }catch(e){ dlog('Hütten-Migration fehlgeschlagen (versuche es beim nächsten Laden erneut): ' + (e&&e.message?e.message:e), 'err'); }
  }

  if(!toursObj && !hutsObj && !agendaObj){
    // Keine Verbindung zur Datenbank – auf lokalen Offline-Cache zurückgreifen
    state.loading = false;
    if(cached){
      state.tours = cached.tours || [];
      state.huts = cached.huts || [];
      state.agenda = cached.agenda || [];
      state.offlineMode = true;
      state.offlineCachedAt = cached.cachedAt;
      showToast('Offline – zeigt den zuletzt gespeicherten Stand vom ' + fmtDate(cached.cachedAt), true);
    }else{
      showToast('Konnte nicht mit der Datenbank verbinden. Prüfe deine Internetverbindung.', true);
    }
    render();
    return;
  }

  const tours = (toursObj ? Object.values(toursObj) : []).filter(t=>t && t.id);
  const huts = (hutsObj ? Object.values(hutsObj) : []).filter(h=>h && h.id);
  const agenda = (agendaObj ? Object.values(agendaObj) : []).filter(a=>a && a.id).map(migrateAgendaStatus);
  tours.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  huts.sort((a,b)=> a.name.localeCompare(b.name, 'de'));

  // Lokale, noch nicht synchronisierte Einträge nicht verlieren — sowohl aus dem
  // aktuellen Speicher als auch aus dem lokalen Cache (wichtig nach einem
  // Seiten-Neuladen, da der Speicher dann leer ist, der Cache aber nicht).
  const unsyncedTours = dedupeById([
    ...state.tours.filter(x=>x._unsynced),
    ...((cached && cached.tours) ? cached.tours.filter(x=>x._unsynced) : [])
  ]).filter(x=>!tours.find(y=>y.id===x.id));
  const unsyncedHuts = dedupeById([
    ...state.huts.filter(x=>x._unsynced),
    ...((cached && cached.huts) ? cached.huts.filter(x=>x._unsynced) : [])
  ]).filter(x=>!huts.find(y=>y.id===x.id));
  const unsyncedAgenda = dedupeById([
    ...state.agenda.filter(x=>x._unsynced),
    ...((cached && cached.agenda) ? cached.agenda.filter(x=>x._unsynced) : [])
  ]).filter(x=>!agenda.find(y=>y.id===x.id));

  state.tours = [...unsyncedTours, ...tours];
  state.huts = [...unsyncedHuts, ...huts];
  state.agenda = [...unsyncedAgenda, ...agenda];
  state.loading = false;
  state.offlineMode = false;
  render();

  // Wiedergefundene, noch nicht synchronisierte Einträge jetzt automatisch
  // erneut versuchen hochzuladen, da offenbar wieder eine Verbindung besteht.
  unsyncedTours.forEach(async t=>{
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(ok) render();
  });
  unsyncedHuts.forEach(async h=>{
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(ok) render();
  });
  unsyncedAgenda.forEach(async a=>{
    const ok = await saveAgendaCloud(a).catch(()=>false);
    a._unsynced = !ok;
    if(ok) render();
  });
}

function mergeImportedData(json){
  let data;
  try{ data = JSON.parse(json); }
  catch(e){ throw new Error('Das eingefügte Format ist kein gültiges JSON.'); }
  const importedTours = Array.isArray(data.tours) ? data.tours : [];
  const importedHuts = Array.isArray(data.huts) ? data.huts : [];
  let addedTours = 0, updatedTours = 0, addedHuts = 0, updatedHuts = 0;
  importedTours.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    const idx = state.tours.findIndex(x=>x.id===t.id);
    if(idx>=0){ state.tours[idx] = t; updatedTours++; }
    else { state.tours.unshift(t); addedTours++; }
  });
  importedHuts.forEach(h=>{
    if(!h || !h.id || !h.name) return;
    const idx = state.huts.findIndex(x=>x.id===h.id);
    if(idx>=0){ state.huts[idx] = h; updatedHuts++; }
    else { state.huts.push(h); addedHuts++; }
  });
  importedTours.forEach(t=> saveTourCloud(t).catch(()=>markUnsaved()));
  importedHuts.forEach(h=> saveHutCloud(h).catch(()=>markUnsaved()));
  return {addedTours, updatedTours, addedHuts, updatedHuts};
}

function setFormBusy(formId, busy){
  const form = document.getElementById(formId);
  if(!form) return;
  const btnId = formId==='tour-form' ? 'tour-save-btn' : 'hut-save-btn';
  const btn = document.getElementById(btnId);
  if(btn){
    btn.disabled = busy;
    if(busy){ btn.dataset.origText = btn.textContent; btn.textContent = 'Speichert…'; }
    else if(btn.dataset.origText){ btn.textContent = btn.dataset.origText; }
  }
}

function showFormError(formId, message){
  const form = document.getElementById(formId);
  if(!form) return;
  let box = form.querySelector('.form-error');
  if(!box){
    box = document.createElement('div');
    box.className = 'form-error';
    const actions = form.querySelector('.form-actions');
    if(actions) form.insertBefore(box, actions);
    else form.appendChild(box);
  }
  box.textContent = message;
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ================= Modal rendering ================= */
function renderModal(){
  pushModalHistoryIfNeeded();
  const root = document.getElementById('modal-root');
  const m = state.modal;
  let inner = '';
  if(m.type==='name') inner = nameModalHtml();
  else if(m.type==='edit-tour') inner = tourFormHtml(m.payload);
  else if(m.type==='tour-detail') inner = tourDetailHtml(m.payload);
  else if(m.type==='edit-hut') inner = hutFormHtml(m.payload);
  else if(m.type==='hut-detail') inner = hutDetailHtml(m.payload);
  else if(m.type==='export') inner = exportModalHtml();
  else if(m.type==='import') inner = importModalHtml();
  else if(m.type==='vorlagen') inner = vorlagenModalHtml(TOUR_VORLAGE_JSON);
  else if(m.type==='add-agenda') inner = agendaFormHtml();
  else if(m.type==='agenda-detail') inner = agendaDetailHtml(m.payload);
  else if(m.type==='emergency') inner = emergencyCardHtml();
  else if(m.type==='add-completion') inner = completionModalHtml(m.payload);
  root.innerHTML = `<div class="overlay" data-act="overlay-close">${inner}</div>`;
  wireModalHandlers();
}

    <p style="font-size:14px; color:var(--ink-soft); margin:0 0 14px 0;">Dein Name wird bei Touren und Hütten angezeigt, die du hinzufügst oder bearbeitest. Er wird nur auf diesem Gerät gespeichert.</p>
    <div class="field"><label>Name</label><input type="text" id="name-input" placeholder="z. B. Simone" autofocus/></div>
    <div class="form-actions">
      <button class="btn secondary" data-act="close-modal">Abbrechen</button>
      <button class="btn" data-act="submit-name">Weiter</button>
    </div>
  </div>`;
}

          </div>
          <input type="hidden" name="descentType" id="descent-hidden" value="${esc(t.descentType||'')}"/>
        </div>
        <div class="field"><label>Exposition</label>
          <div class="chips">
            ${EXPOSITIONS.map(x=>`<button type="button" class="chip exposition-msl-chip ${(t.exposition||[]).includes(x)?'on':''}" style="${(t.exposition||[]).includes(x)?'background:var(--ice-deep)':''}" data-value="${x}">${x}</button>`).join('')}

        </div>
        <div class="field"><label>Gefahren</label>
          <div class="chips">
            ${GEFAHREN_MSL.map(g=>`<button type="button" class="chip gefahren-msl-chip ${(t.gefahren||[]).includes(g)?'on':''}" style="${(t.gefahren||[]).includes(g)?'background:var(--ice-deep)':''}" data-value="${g}">${g}</button>`).join('')}

          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('biwak')?'on':''}" style="${(t.stayTypes||[]).includes('biwak')?'background:var(--ice-deep)':''}" data-value="biwak">⛺ Biwak</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('zelt')?'on':''}" style="${(t.stayTypes||[]).includes('zelt')?'background:var(--ice-deep)':''}" data-value="zelt">🏕️ Zelt</button>

      </div>
      <div class="field"><label>Anfahrt — Details</label><textarea name="approach" placeholder="Ausgangspunkt, Parkplatz, ÖV …">${esc(t.approach||'')}</textarea></div>

          <button type="button" id="delete-tour-no" style="background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; margin-left:6px;">Abbrechen</button>
        </div>
      </div>` : ''}
    </form>
  </div>`;
}

function tourDetailHtml(id){
  const t = state.tours.find(x=>x.id===id);
  if(!t) return `<div class="modal" data-stop="1"><p>Tour nicht gefunden.</p></div>`;
  const isMsl = t.tourCategory==='msl';
  const d = t.difficulty ? DIFF[t.difficulty] : null;
  const hut = t.hutId ? state.huts.find(h=>h.id===t.hutId) : null;
  const protectionInfo = t.protection ? PROTECTION_LEVELS.find(p=>p.value===t.protection) : null;
  return `<div class="modal" data-stop="1">
    <div class="modal-head">
      <div>
        <div class="agenda-date-row" style="font-size:12.5px;">${isMsl ? '🧗 MSL — Mehrseillängen-Klettertour' : '🏔️ Hochtour'}</div>
        <div class="detail-badge-row">
          ${isMsl ? `
            ${t.mandatoryDifficulty ? `<span class="badge climb">obligatorisch ${esc(t.mandatoryDifficulty)}</span>` : ''}
            ${t.cruxDifficulty ? `<span class="badge climb">Schlüssel ${esc(t.cruxDifficulty)}</span>` : ''}
          ` : `
            ${d ? `<span class="badge" style="background:${d.color}">${t.difficulty} · ${d.label}</span>` : `<span class="badge" style="background:var(--ink-faint)">unbewertet</span>`}
            ${t.climbGrade ? `<span class="badge climb">🧗 ${esc(t.climbGrade)}</span>` : ''}
          `}
          ${t.targetAltitude ? `<span class="badge" style="background:var(--ice-deep)">${esc(t.targetAltitude)} m ü. M.</span>` : ''}
        </div>
        <h2>${esc(t.name)}</h2>
      </div>
      <button class="x-btn" data-act="close-modal">×</button>
    </div>
    ${t.routeName ? `<p style="color:var(--ink-soft); font-size:14px; font-style:italic; margin:0 0 4px 0;">${esc(t.routeName)}</p>` : ''}
    ${t.region ? `<p style="color:var(--ink-soft); font-size:14px; margin:0 0 6px 0;">${esc(t.region)}${t.subregion ? ' – ' + esc(t.subregion) : ''}</p>` : ''}
    <button type="button" class="btn secondary" style="font-size:12.5px; padding:6px 12px; margin-bottom:10px;" data-act="toggle-tour-status" data-id="${t.id}">${tourStatusLabel(t)} — antippen zum Ändern</button>
    <div class="detail-stats">
      <div class="detail-stat"><div class="num">${esc(t.elevationGain||'–')}</div><div class="lbl">Hm Aufstieg</div></div>
      ${t.elevationLoss ? `<div class="detail-stat"><div class="num">${esc(t.elevationLoss)}</div><div class="lbl">Hm Abstieg</div></div>` : ''}
      ${t.duration ? `<div class="detail-stat"><div class="num">${esc(t.duration)} h</div><div class="lbl">Zeitbedarf</div></div>` : ''}
      ${isMsl && t.pitchCount ? `<div class="detail-stat"><div class="num">${esc(t.pitchCount)}</div><div class="lbl">Seillängen</div></div>` : ''}
      ${isMsl && t.longestPitch ? `<div class="detail-stat"><div class="num">${esc(t.longestPitch)}</div><div class="lbl">Längste SL</div></div>` : ''}
    </div>
    ${hut ? `<button class="hut-link-chip" style="border:none; cursor:pointer;" data-act="open-hut" data-id="${hut.id}">🛖 Zustieg über: ${esc(hut.name)}</button>` : ''}

    ${!isMsl && (t.glacier==='ja' || t.crevasseRisk!=='nein') ? `<div class="detail-section"><h4>Gletscher &amp; Spalten</h4><p>${t.glacier==='ja'?'Gletscher: Ja':''}${t.glacier==='ja' && t.crevasseRisk && t.crevasseRisk!=='nein' ? ' · ' : ''}${t.crevasseRisk==='moeglich'?'Spaltenrisiko: möglich':t.crevasseRisk==='ausgepraegt'?'Spaltenrisiko: ausgeprägt':''}</p></div>` : ''}

/* ================= Abgeschlossen view ================= */
function buildPersonGroups(){
  const groups = {};
  state.tours.forEach(t=>{
    (t.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].tours.find(x=>x.id===t.id)) groups[name].tours.push(t);
    });
  });
  state.huts.forEach(h=>{
    (h.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].huts.find(x=>x.id===h.id)) groups[name].huts.push(h);
    });
  });
  return groups;
}

function abgeschlossenViewHtml(){
  const groups = buildPersonGroups();
  const names = Object.keys(groups);
  if(!names.length){
    return `<div class="empty">
      <h3>Noch nichts als erledigt markiert</h3>
      <p>Öffne eine Tour oder Hütte und tippe auf "Als erledigt markieren", um Name und Datum einzutragen.</p>
    </div>`;
  }
  names.sort((a,b)=>{
    if(state.myName){
      if(a===state.myName) return -1;
      if(b===state.myName) return 1;
    }
    return a.localeCompare(b, 'de');
  });
  return names.map(name=>{
    const g = groups[name];
    const isMe = state.myName && name===state.myName;
    const total = g.tours.length + g.huts.length;
    return `<div class="detail-section" style="margin-bottom:28px;">
      <h4>${isMe ? '⭐ Meine Liste' : esc(name)} (${total})</h4>
      ${g.tours.length ? `<div class="grid" style="margin-top:6px;">${g.tours.map(tourCardHtml).join('')}</div>` : ''}
      ${g.huts.length ? `<div class="grid" style="margin-top:${g.tours.length?12:6}px;">${g.huts.map(hutCardHtml).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function openMarkDone(kind, id){
  state.modal = {type:'add-completion', payload:{kind, id}};
  render();
}

async function submitCompletion(kind, id, name, date){
  const n = (name||'').trim();
  if(!n){
    const box = document.getElementById('completion-error');
    if(box){ box.style.display='block'; box.textContent = 'Bitte einen Namen eingeben.'; }
    return;
  }
  const entry = {by:n, date: date || new Date().toISOString().slice(0,10), addedAt: new Date().toISOString()};
  if(kind==='tour'){
    const t = state.tours.find(x=>x.id===id);
    if(!t) return;
    t.completions = t.completions || [];
    t.completions.push(entry);
    closeModal();
    state.modal = {type:'tour-detail', payload:id};
    render();
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(!ok){ markUnsaved(); showToast('Eintrag lokal gespeichert, aber nicht synchronisiert.', true); }
    else{ showToast('Als erledigt eingetragen.'); }
    render();
  }else{
    const h = state.huts.find(x=>x.id===id);
    if(!h) return;
    h.completions = h.completions || [];
    h.completions.push(entry);
    closeModal();
    state.modal = {type:'hut-detail', payload:id};
    render();
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(!ok){ markUnsaved(); showToast('Eintrag lokal gespeichert, aber nicht synchronisiert.', true); }
    else{ showToast('Als erledigt eingetragen.'); }
    render();
  }
}

/* ================= Event wiring ================= */
function wireGlobalHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act');
    if(act==='view-touren') el.onclick = ()=>setView('touren');
    else if(act==='view-msl') el.onclick = ()=>setView('msl');
    else if(act==='view-huetten') el.onclick = ()=>setView('huetten');
    else if(act==='view-agenda') el.onclick = ()=>setView('agenda');
    else if(act==='view-abgeschlossen') el.onclick = ()=>setView('abgeschlossen');
    else if(act==='change-name') el.onclick = ()=>{ state.modal = {type:'name'}; render(); };
    else if(act==='export-data') el.onclick = openExport;
    else if(act==='import-data') el.onclick = openImport;
    else if(act==='add-tour') el.onclick = openAddTour;
    else if(act==='add-msl') el.onclick = openAddMsl;
    else if(act==='add-hut') el.onclick = openAddHut;
    else if(act==='add-agenda') el.onclick = openAddAgenda;
    else if(act==='open-tour') { el.onclick = ()=>openTourDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openTourDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-hut') { el.onclick = ()=>openHutDetail(el.getAttribute('data-id')); el.onkeydown=(e)=>{if(e.key==='Enter')openHutDetail(el.getAttribute('data-id'));}; }
    else if(act==='open-agenda') { el.onclick = ()=>{ state.modal={type:'agenda-detail', payload:el.getAttribute('data-id')}; render(); }; }
    else if(act==='filter-diff') el.onclick = ()=>toggleDiffFilter(el.getAttribute('data-code'));
    else if(act==='filter-region') el.onclick = ()=>toggleRegionFilter(el.getAttribute('data-region'));
    else if(act==='reset-tour-filters') el.onclick = ()=>resetTourFilters();
    else if(act==='filter-approach-type') el.onclick = ()=>toggleApproachTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-stay-type') el.onclick = ()=>toggleStayTypeFilter(el.getAttribute('data-value'));
    else if(act==='filter-status') el.onclick = ()=>toggleStatusFilter(el.getAttribute('data-value'));
    else if(act==='filter-glacier') el.onclick = ()=>toggleGlacierFilter(el.getAttribute('data-value'));
    else if(act==='filter-category') el.onclick = ()=>{ state.tourCategoryFilter = el.getAttribute('data-cat'); render(); };
    else if(act==='sort-by') el.onchange = (e)=>{ const kind=el.getAttribute('data-kind'); if(kind==='hut') state.hutSortBy=e.target.value; else state.tourSortBy=e.target.value; renderListOnly(); };
    else if(act==='sort-dir') el.onclick = ()=>{ const kind=el.getAttribute('data-kind'); if(kind==='hut') state.hutSortDir = state.hutSortDir==='asc'?'desc':'asc'; else state.tourSortDir = state.tourSortDir==='asc'?'desc':'asc'; renderListOnly(); };
    else if(act==='search') el.oninput = (e)=>{ state.search = e.target.value; renderListOnly(); };
  });
  const tourFilterToggleBtn = app.querySelector('#tour-filter-toggle-btn');
  if(tourFilterToggleBtn){
    tourFilterToggleBtn.addEventListener('click', ()=>{
      const panel = app.querySelector('#tour-filter-panel');
      if(panel) panel.style.display = (panel.style.display==='none') ? '' : 'none';
    });
  }
  app.querySelectorAll('.agenda-status-select').forEach(sel=>{
    sel.addEventListener('click', e=> e.stopPropagation());
    sel.addEventListener('change', ()=> setAgendaStatus(sel.getAttribute('data-id'), sel.value));
  });
}

function renderListOnly(){
  const main = document.querySelector('main');
  if(!main) return;
  main.innerHTML = state.loading ? `<div class="loading">Lade…</div>` : (state.view==='touren' ? tourenViewHtml() : state.view==='msl' ? mslViewHtml() : state.view==='huetten' ? huettenViewHtml() : state.view==='agenda' ? agendaViewHtml() : abgeschlossenViewHtml());
  wireGlobalHandlers();
  const input = main.querySelector('.search-input');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

        btn.addEventListener('click', ()=>{
          const wasOn = btn.classList.contains('on');

          if(wasOn){
            if(hidden) hidden.value = '';
          }else{
            btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
            if(hidden) hidden.value = btn.getAttribute('data-value');
          }
        });
      });
    }
    wireSingleSelectChips('glacier-chip', 'glacier-hidden');
    wireSingleSelectChips('crevasse-chip', 'crevasse-hidden');
    wireSingleSelectChips('protection-chip', 'protection-hidden');
    wireSingleSelectChips('descent-chip', 'descent-hidden');
    // Mehrfachauswahl-Chips (Material, Exposition, Gefahren) — Klick schaltet "on" um
    function wireMultiToggleChips(className){
      tourForm.querySelectorAll('.'+className).forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const isOn = btn.classList.toggle('on');
          btn.style.background = isOn ? 'var(--ice-deep)' : '';
        });
      });
    }
    wireMultiToggleChips('material-chip');
    wireMultiToggleChips('exposition-hochtour-chip');
    wireMultiToggleChips('gefahren-hochtour-chip');
    wireMultiToggleChips('exposition-msl-chip');
    wireMultiToggleChips('gefahren-msl-chip');
    wireMultiToggleChips('approach-type-chip');
    wireMultiToggleChips('stay-type-chip');
    // Gletscher "Ja" → Spaltenrettungsset im Material automatisch anhaken, "Nein" → wieder abhaken
    function checkMaterialCheckbox(name){
      const btn = Array.from(tourForm.querySelectorAll('.material-chip')).find(b=>b.getAttribute('data-value')===name);

      btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';

      const btn = Array.from(tourForm.querySelectorAll('.material-chip')).find(b=>b.getAttribute('data-value')===name);

      btn.classList.remove('on'); btn.style.background = '';
    }
    tourForm.querySelectorAll('.glacier-chip').forEach(btn=>{

        if(jaBtn && jaBtn.classList.contains('on')){

    // Teilgebiet-Chips (Event-Delegation, da dynamisch neu erzeugt)

    const tourSaveBtn = document.getElementById('tour-save-btn');

      tourSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        dlog('Klick auf Tour-Speichern-Button registriert — speichere direkt (ohne Formular-Submit)');
        try{
          const fd = new FormData(tourForm);
          const data = Object.fromEntries(fd.entries());

          data.expositionMsl = Array.from(tourForm.querySelectorAll('.exposition-msl-chip.on')).map(b=>b.getAttribute('data-value'));
          data.gefahrenMsl = Array.from(tourForm.querySelectorAll('.gefahren-msl-chip.on')).map(b=>b.getAttribute('data-value'));

          data.stayTypes = Array.from(tourForm.querySelectorAll('.stay-type-chip.on')).map(b=>b.getAttribute('data-value'));

          }
          dlog('Validierung ok, rufe submitTourForm auf für "'+data.name+'"');
          submitTourForm(data, state.modal.payload);
        }catch(err){
          dlog('Unerwarteter Fehler beim Speichern: '+(err && err.message ? err.message : err), 'err');
          showFormError('tour-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
    const tourFabSaveBtn = document.getElementById('tour-fab-save-btn');
    if(tourFabSaveBtn) tourFabSaveBtn.addEventListener('click', ()=>{ if(tourSaveBtn) tourSaveBtn.click(); });
  }

  const hutForm = document.getElementById('hut-form');
  if(hutForm){
    const hutSaveBtn = document.getElementById('hut-save-btn');
    if(hutSaveBtn){
      hutSaveBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        dlog('Klick auf Hütte-Speichern-Button registriert — speichere direkt (ohne Formular-Submit)');
        try{
          const fd = new FormData(hutForm);
          const data = Object.fromEntries(fd.entries());
          data.approachTypes = Array.from(hutForm.querySelectorAll('.approach-type-chip.on')).map(b=>b.getAttribute('data-value'));
          if(!data.name || !data.name.trim()){
            dlog('Validierung fehlgeschlagen: Name fehlt', 'err');
            showFormError('hut-form', 'Bitte einen Namen für die Hütte eingeben (ganz oben im Formular).');
            return;
          }
          dlog('Validierung ok, rufe submitHutForm auf für "'+data.name+'"');
          submitHutForm(data, state.modal.payload);
        }catch(err){
          dlog('Unerwarteter Fehler beim Speichern: '+(err && err.message ? err.message : err), 'err');
          showFormError('hut-form', 'Unerwarteter Fehler: ' + (err.message || err));
        }
      });
    }
    const hutFabSaveBtn = document.getElementById('hut-fab-save-btn');
    if(hutFabSaveBtn) hutFabSaveBtn.addEventListener('click', ()=>{ if(hutSaveBtn) hutSaveBtn.click(); });

    // Art der Anfahrt (Mehrfachauswahl)
    hutForm.querySelectorAll('.approach-type-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const isOn = chip.classList.toggle('on');
        chip.style.background = isOn ? 'var(--ice-deep)' : '';
      });
    });

    // Region-Chips (identisch zum Touren-Formular)
    const hutRegionHidden = document.getElementById('region-hidden-input');
    const hutRegionOtherInput = document.getElementById('region-other-input');
    const hutSubregionField = document.getElementById('subregion-field');
    const hutSubregionChipsWrap = document.getElementById('subregion-chips');
    const hutSubregionHidden = document.getElementById('subregion-hidden');
    hutForm.querySelectorAll('.region-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const wasOn = chip.classList.contains('on');
        hutForm.querySelectorAll('.region-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){
          hutRegionOtherInput.style.display = 'none';
          hutRegionOtherInput.value = '';
          hutRegionHidden.value = '';
          if(hutSubregionField){ hutSubregionField.style.display = 'none'; hutSubregionHidden.value = ''; }
          return;
        }
        chip.classList.add('on'); chip.style.background = 'var(--ice-deep)';
        const region = chip.getAttribute('data-region');
        if(region==='__other__'){
          hutRegionOtherInput.style.display = '';
          hutRegionOtherInput.focus();
          hutRegionHidden.value = hutRegionOtherInput.value;
          if(hutSubregionField){ hutSubregionField.style.display = 'none'; hutSubregionHidden.value = ''; }
        }else{
          hutRegionOtherInput.style.display = 'none';
          hutRegionHidden.value = region;
          if(hutSubregionField && hutSubregionChipsWrap){
            const subs = REGION_SUBAREAS[region] || [];
            if(subs.length){
              hutSubregionChipsWrap.innerHTML = renderSubregionChipsHtml(region, '');
              hutSubregionHidden.value = '';
              hutSubregionField.style.display = '';
            }else{
              hutSubregionField.style.display = 'none';
              hutSubregionHidden.value = '';
            }
          }
        }
      });
    });
    if(hutRegionOtherInput) hutRegionOtherInput.addEventListener('input', ()=>{ hutRegionHidden.value = hutRegionOtherInput.value; });
    if(hutSubregionChipsWrap){
      hutSubregionChipsWrap.addEventListener('click', (e)=>{
        const btn = e.target.closest('.subregion-chip');
        if(!btn) return;
        const wasOn = btn.classList.contains('on');
        hutSubregionChipsWrap.querySelectorAll('.subregion-chip').forEach(c=>{ c.classList.remove('on'); c.style.background=''; });
        if(wasOn){ hutSubregionHidden.value = ''; return; }
        btn.classList.add('on'); btn.style.background = 'var(--ice-deep)';
        hutSubregionHidden.value = btn.getAttribute('data-subregion');
      });
    }
  }

  // Dezente Löschen-Funktion mit zweistufiger Bestätigung (Tour & Hütte)
  function wireDeleteConfirm(prefix, removeFn, onDeletedGoTo){
    const trigger = document.getElementById(`delete-${prefix}-trigger`);
    const confirmBox = document.getElementById(`delete-${prefix}-confirm`);
    const yesBtn = document.getElementById(`delete-${prefix}-yes`);
    const noBtn = document.getElementById(`delete-${prefix}-no`);
    if(!trigger) return;
    trigger.addEventListener('click', ()=>{
      trigger.style.display = 'none';
      confirmBox.style.display = '';
    });
    if(noBtn) noBtn.addEventListener('click', ()=>{
      confirmBox.style.display = 'none';
      trigger.style.display = '';
    });
    if(yesBtn) yesBtn.addEventListener('click', ()=>{
      removeFn(yesBtn.getAttribute('data-id'));
      closeModal();
      showToast(onDeletedGoTo + ' gelöscht.');
    });
  }
  wireDeleteConfirm('tour', removeTour, 'Tour');
  wireDeleteConfirm('hut', removeHut, 'Hütte');
  wireDeleteConfirm('agenda', removeAgendaItem, 'Termin');

  root.querySelectorAll('[data-act="edit-tour"]').forEach(el=> el.onclick = ()=>openEditTour(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="edit-hut"]').forEach(el=> el.onclick = ()=>openEditHut(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-hut"]').forEach(el=> el.onclick = ()=>openHutDetail(el.getAttribute('data-id')));
  root.querySelectorAll('[data-act="open-tour"]').forEach(el=> el.onclick = ()=>openTourDetail(el.getAttribute('data-id')));
}

/* ================= Global error safety net ================= */
window.addEventListener('error', function(e){
  console.error('Unhandled error', e.error || e.message);
  showToast('Es gab ein unerwartetes Problem: ' + (e.message || 'unbekannter Fehler') + '. Bitte nochmal versuchen.', true);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection', e.reason);
  showToast('Es gab ein unerwartetes Problem beim Speichern. Bitte nochmal versuchen.', true);
});
window.addEventListener('beforeunload', function(e){
  if(state.hasUnsavedChanges){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= Init ================= */
try{
  const savedName = localStorage.getItem('fixseil-myname');
  if(savedName) state.myName = savedName;
}catch(e){}
loadAuthFromStorage();
wireAppSwitchSwipe('./index.html');
function toggleEmergencyCard(){
  if(state.modal && state.modal.type==='emergency'){ closeModal(); }
  else{ state.modal = {type:'emergency'}; render(); }
}
const emergencyTab = document.getElementById('emergency-btn');
emergencyTab.addEventListener('click', toggleEmergencyCard);
let emergencySwipeStart = null;
emergencyTab.addEventListener('touchstart', (e)=>{
  emergencySwipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, {passive:true});
emergencyTab.addEventListener('touchend', (e)=>{
  if(!emergencySwipeStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - emergencySwipeStart.x;
  const dy = t.clientY - emergencySwipeStart.y;
  emergencySwipeStart = null;
  // Wegziehen nach rechts oder nach unten öffnet die Karte (kein erneutes Schliessen per Wisch, nur per Klick/erneutem Antippen)
  if((dx > 35 || dy > 35) && !(state.modal && state.modal.type==='emergency')){
    state.modal = {type:'emergency'}; render();
  }
});

if(isLoggedIn()){
  dlog('App gestartet — Version ' + APP_VERSION);
  loadAll();
}else{
  document.getElementById('app').innerHTML = loginScreenHtml();
  wireLoginScreen();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      dlog('Service Worker konnte nicht registriert werden.', 'err');
    });
  });
}
</script>
