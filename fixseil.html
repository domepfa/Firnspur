<meta name="theme-color" content="#4A3524">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1EAE0;
    --paper:#FFFFFF;
    --ink:#2B2019;
    --ink-soft:#6B5B4C;
    --ink-faint:#9C8C7B;
    --ice:#7C5B3E;
    --ice-deep:#4A3524;
    --ice-light:#E6DAC5;
    --signal:#D9A441;
    --signal-deep:#A87A1F;
    --line:#DED0B8;
    --danger:#B0392C;
    --ok:#3C7A52;
    --shadow: 0 2px 10px rgba(43,32,25,0.10);
    --shadow-lg: 0 12px 32px rgba(43,32,25,0.20);
    --radius: 3px;

    --d-L:#6C93AC;
    --d-WS:#4E7A93;
    --d-ZS:#C9A227;
    --d-S:#D97B3E;
    --d-SS:#C2452D;
    --d-AS:#8A2E2E;
    --d-EX:#2B1416;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--ice-deep);}

  /* ===== App-Umschalter ===== */
  .app-switch-bar{
    background:var(--ink); display:flex; justify-content:center; gap:0;
  }
  .app-switch-bar a, .app-switch-bar button{
    color:rgba(255,255,255,0.55); text-decoration:none; font-size:13.5px; font-weight:700;
    letter-spacing:0.03em; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; flex:1; max-width:220px; text-transform:uppercase;
    border-bottom:3px solid transparent; transition:background .12s ease, color .12s ease;
    background:none; border-left:none; border-right:none; border-top:none; font-family:inherit; cursor:pointer;
  }
  .app-switch-bar a:hover, .app-switch-bar button:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .app-switch-bar a.active{color:#fff; border-bottom-color:var(--signal, #F2B705); background:rgba(255,255,255,0.06);}

  /* ===== Fels-Hero ===== */
  .hero{
    color:#fff;
    padding:28px 20px 34px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image: url('IMG_20260811_073051812_HDR.jpg');
    background-size: 115%;
    background-position: center 55%;
    filter: brightness(1.15) contrast(1.05);
    z-index:0;
  }
  .hero.hero-msl::before{
    background-image: url('msl-hero.jpg');
    background-position: center 60%;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(74,53,36,0.62) 0%, rgba(124,91,62,0.40) 55%, rgba(159,131,101,0.24) 100%);
    z-index:0;
  }
  .hero-top, .hero .tabs{ position:relative; z-index:1; }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:1000px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:44px; color:#fff; letter-spacing:1px; font-weight:800;}
  .brand .tag{font-family:'Source Sans 3'; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ice-light); font-style:italic;}
  .who{
    font-size:13px; color:var(--ice-light); text-align:right;
  }
  .who-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .who button{
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:3px 9px; border-radius:20px; font-size:12px; margin-left:6px;
  }
  .who button:hover{background:rgba(255,255,255,0.15);}

  /* ===== Wegweiser-Tabs ===== */
  .tabs{
    max-width:1000px; margin:0 auto; padding:0 20px;
    transform:translateY(20px);
    position:relative; z-index:2;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs-inner{
    display:flex; gap:14px; width:max-content; margin:0 auto;
  }
  .route-waypoint-label{ background:none; border:none; box-shadow:none; color:#fff; font-weight:700; font-size:11px; }
  .tab{
    background:none; border:none; box-shadow:none; clip-path:none;
    color:rgba(255,255,255,0.62);
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    font-size:14px;
    padding:10px 14px 8px 14px;
    border-bottom:2px solid transparent;
    flex-shrink:0; white-space:nowrap;
  }
  .tab.active{color:#fff; border-bottom-color:var(--signal, #F2B705);}
  .tab:hover{color:#fff;}

  main{max-width:1000px; margin:0 auto; padding:40px 20px 80px 20px;}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-input{
    flex:1; min-width:180px;
    padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .btn{
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ice-deep);
    background:var(--ice-deep); color:#fff; font-weight:600; font-size:14px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ice);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.secondary:hover{background:var(--ice-light);}
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--ice-deep); outline-offset:2px;}

  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .sort-control{display:flex; align-items:center; gap:6px;}
  .sort-control select{
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px;
    font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .sort-dir-btn{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff;
    width:32px; height:32px; font-size:15px; cursor:pointer; color:var(--ink);
  }
  .sort-dir-btn:hover{background:var(--ice-light);}
  .chip{
    padding:4px 10px; border-radius:16px; border:1px solid var(--line);
    background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.3;
  }
  .chip.on{color:#fff; border-color:transparent;}

  /* ===== Karten ===== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ice-light); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); text-align:left; width:100%;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-left-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); cursor:pointer; border-left-color:var(--ice);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .agenda-date-row{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em;
    font-weight:700; font-size:15px; color:var(--ice-deep); margin-bottom:2px;
  }
  .card h3{font-size:17px; color:var(--ink); line-height:1.25;}
  .badge{
    flex-shrink:0; font-family:'JetBrains Mono'; font-weight:700; font-size:12px;
    color:#fff; padding:3px 8px; border-radius:2px; letter-spacing:0.02em;
  }
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;}
  .badge.climb{background:var(--ice-deep);}
  .stat-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap;}
  .stat-row .mono{color:var(--ink); font-weight:600;}
  .card p.excerpt{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .hut-link-chip{
    align-self:flex-start; font-size:12px; background:var(--ice-light); color:var(--ice-deep);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .conditions-note{
    font-size:12.5px; background:#F6E9C9; border-left:3px solid var(--signal-deep);
    padding:6px 9px; color:#5B4200; border-radius:2px;
  }
  .meta-line{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty h3{color:var(--ink); font-size:18px; margin-bottom:8px;}
  .empty .btn{margin-top:16px;}

  /* ===== Legende ===== */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .legend .chip{cursor:default; display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(30,22,16,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); width:100%; max-width:620px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:28px; margin:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px;}
  .modal-head h2{font-size:22px;}
  .x-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; padding:2px 6px;}
  .x-btn:hover{color:var(--ink);}

  .field{margin-bottom:9px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:3px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--ice); outline-offset:1px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .fab-save{
    position:fixed; bottom:20px; right:20px; z-index:70;
    background:var(--ice-deep); color:#fff; border:none; border-radius:50px;
    padding:14px 24px; font-weight:700; font-size:14px; box-shadow:var(--shadow-lg);
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .fab-save:hover{background:var(--ice);}
  .fab-save[disabled]{opacity:0.6; cursor:default;}
  .emergency-tab{
    position:fixed; top:50%; left:0; transform:translateY(-50%); z-index:70;
    background:var(--danger); color:#fff; border:none;
    padding:12px 5px; border-radius:0 8px 8px 0;
    font-family:'Oswald'; font-size:11px; font-weight:700; letter-spacing:0.08em;
    writing-mode:vertical-rl; text-orientation:mixed;
    box-shadow:var(--shadow); cursor:pointer; opacity:0.72;
    touch-action:none;
  }
  .emergency-tab:hover{opacity:1;}

  /* ===== Detailansicht ===== */
  .detail-badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{
    font-family:'Oswald'; text-transform:uppercase; font-size:13px; letter-spacing:0.05em;
    color:var(--ice-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px;
  }
  .detail-section p{font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap; margin:0;}
  .detail-stats{display:flex; gap:22px; flex-wrap:wrap; margin:14px 0;}
  .detail-stat .num{font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--ink);}
  .detail-stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .detail-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:#FBEAE7;}

  .cond-box{background:var(--ice-light); border-radius:var(--radius); padding:12px; margin-top:14px;}
  .cond-box textarea{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13.5px; min-height:44px;}
  .cond-box .meta-line{margin-top:6px;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-family:'Oswald'; letter-spacing:0.05em; text-transform:uppercase; font-size:13px;}

  .form-error{
    background:#FBEAE7; border:1px solid var(--danger); color:#7A2A1F;
    padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ice-deep); color:#fff; padding:11px 20px; border-radius:20px;
    font-size:13.5px; box-shadow:var(--shadow-lg); z-index:100; max-width:90%; text-align:center;
  }
  .toast.error{background:var(--danger);}
  .btn[disabled]{opacity:0.6; cursor:default;}

  .backup-banner{
    background:#B0392C; color:#fff; padding:12px 20px; text-align:center;
    font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:80;
  }
  .backup-banner button{
    background:#fff; color:#B0392C; border:none; border-radius:20px; padding:6px 16px;
    font-weight:700; font-size:13px;
  }

  .debug-toggle{
    display:none;
    position:fixed; bottom:16px; right:16px; z-index:90;
    background:var(--ink); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12px; font-family:'JetBrains Mono'; opacity:0.55;
    box-shadow:var(--shadow);
  }
  .debug-panel{
    position:fixed; bottom:60px; right:16px; left:16px; max-width:520px; margin:0 auto;
    max-height:50vh; overflow-y:auto; background:#1C1510; color:#E9DFCF;
    border-radius:var(--radius); padding:12px; font-family:'JetBrains Mono'; font-size:11.5px;
    z-index:91; box-shadow:var(--shadow-lg); line-height:1.5;
  }
  .debug-panel .row{border-bottom:1px solid #3A2E22; padding:4px 0;}
  .debug-panel .row.err{color:#FF8A75;}
  .debug-panel .row.ok{color:#8FD9A8;}
  .debug-panel .head{display:flex; justify-content:space-between; margin-bottom:6px;}
  .debug-panel .head button{background:none; border:1px solid #554435; color:#E9DFCF; border-radius:4px; padding:2px 8px; font-size:11px;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .brand h1{font-size:32px;}
    .hero{padding-bottom:30px;}
    .tabs{transform:translateY(16px);}
    .tab{padding:8px 16px 8px 14px; font-size:12.5px;}
  }
</style>
</head>

function cacheLocalSnapshot(){
  try{
    localStorage.setItem('fixseil-cache', JSON.stringify({
      tours: state.tours, huts: state.huts, sektoren: state.sektoren, agenda: state.agenda, cachedAt: new Date().toISOString()
    }));
  }catch(e){ /* z. B. Safari privater Modus – dann halt kein Offline-Cache */ }
}
function loadLocalSnapshot(){
  try{
    const raw = localStorage.getItem('fixseil-cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function loadAll(){
  state.loading = true; render();
  const [toursObj, hutsObjResult, agendaObj, sektorenObj] = await Promise.all([ fbGet(TOURS_PATH), fbGet(HUTS_PATH), fbGet(AGENDA_PATH), fbGet(SEKTOREN_PATH) ]);
  let hutsObj = hutsObjResult;
  const cached = loadLocalSnapshot();

  // Einmalige Migration: alte, getrennte Fixseil-Hütten in die neue,
  // gemeinsame Sammlung übernehmen (nur solange noch nicht geschehen).
  if(!localStorage.getItem('fixseil-huts-migrated')){
    try{
      const legacyObj = await fbGet(LEGACY_HUTS_PATH);
      const legacyHuts = legacyObj ? Object.values(legacyObj).filter(h=>h && h.id) : [];
      const currentIds = new Set(Object.keys(hutsObj || {}));
      const toMigrate = legacyHuts.filter(h=>!currentIds.has(h.id));
      if(toMigrate.length){
        await Promise.all(toMigrate.map(h=> fbSet(HUTS_PATH+'/'+h.id, h)));
        if(!hutsObj) hutsObj = {};
        toMigrate.forEach(h=>{ hutsObj[h.id] = h; });
        dlog('Migration: ' + toMigrate.length + ' Hütte(n) aus altem Fixseil-Bestand übernommen.');
      }
      localStorage.setItem('fixseil-huts-migrated', '1');
    }catch(e){ dlog('Hütten-Migration fehlgeschlagen (versuche es beim nächsten Laden erneut): ' + (e&&e.message?e.message:e), 'err'); }
  }

  if(!toursObj && !hutsObj && !agendaObj && !sektorenObj){
    // Keine Verbindung zur Datenbank – auf lokalen Offline-Cache zurückgreifen
    state.loading = false;
    if(cached){
      state.tours = cached.tours || [];
      state.huts = cached.huts || [];
      state.sektoren = cached.sektoren || [];
      state.agenda = cached.agenda || [];
      state.offlineMode = true;
      state.offlineCachedAt = cached.cachedAt;
      showToast('Offline – zeigt den zuletzt gespeicherten Stand vom ' + fmtDate(cached.cachedAt), true);
    }else{
      showToast('Konnte nicht mit der Datenbank verbinden. Prüfe deine Internetverbindung.', true);
    }
    render();
    return;
  }

  const tours = (toursObj ? Object.values(toursObj) : []).filter(t=>t && t.id);
  const huts = (hutsObj ? Object.values(hutsObj) : []).filter(h=>h && h.id);
  const sektoren = (sektorenObj ? Object.values(sektorenObj) : []).filter(s=>s && s.id);
  const agenda = (agendaObj ? Object.values(agendaObj) : []).filter(a=>a && a.id).map(migrateAgendaStatus);
  tours.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  huts.sort((a,b)=> a.name.localeCompare(b.name, 'de'));
  sektoren.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'de'));

  // Lokale, noch nicht synchronisierte Einträge nicht verlieren — sowohl aus dem
  // aktuellen Speicher als auch aus dem lokalen Cache (wichtig nach einem
  // Seiten-Neuladen, da der Speicher dann leer ist, der Cache aber nicht).
  const unsyncedTours = dedupeById([
    ...state.tours.filter(x=>x._unsynced),
    ...((cached && cached.tours) ? cached.tours.filter(x=>x._unsynced) : [])
  ]).filter(x=>!tours.find(y=>y.id===x.id));
  const unsyncedHuts = dedupeById([
    ...state.huts.filter(x=>x._unsynced),
    ...((cached && cached.huts) ? cached.huts.filter(x=>x._unsynced) : [])
  ]).filter(x=>!huts.find(y=>y.id===x.id));
  const unsyncedSektoren = dedupeById([
    ...state.sektoren.filter(x=>x._unsynced),
    ...((cached && cached.sektoren) ? cached.sektoren.filter(x=>x._unsynced) : [])
  ]).filter(x=>!sektoren.find(y=>y.id===x.id));
  const unsyncedAgenda = dedupeById([
    ...state.agenda.filter(x=>x._unsynced),
    ...((cached && cached.agenda) ? cached.agenda.filter(x=>x._unsynced) : [])
  ]).filter(x=>!agenda.find(y=>y.id===x.id));

  state.tours = [...unsyncedTours, ...tours];
  state.huts = [...unsyncedHuts, ...huts];
  state.sektoren = [...unsyncedSektoren, ...sektoren];
  state.agenda = [...unsyncedAgenda, ...agenda];
  state.loading = false;
  state.offlineMode = false;
  render();

  // Wiedergefundene, noch nicht synchronisierte Einträge jetzt automatisch
  // erneut versuchen hochzuladen, da offenbar wieder eine Verbindung besteht.
  unsyncedTours.forEach(async t=>{
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(ok) render();
  });
  unsyncedHuts.forEach(async h=>{
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(ok) render();
  });
  unsyncedSektoren.forEach(async s=>{
    const ok = await saveSektorCloud(s).catch(()=>false);
    s._unsynced = !ok;
    if(ok) render();
  });
  unsyncedAgenda.forEach(async a=>{
    const ok = await saveAgendaCloud(a).catch(()=>false);
    a._unsynced = !ok;
    if(ok) render();
  });
}

function closeModal(fromPopstate, skipDirtyCheck, keepHistoryLayer){
  if(!skipDirtyCheck && !confirmDiscardIfDirty()){
    // Nutzer will weiter bearbeiten — nichts schliessen. Bei der Hardware-/Browser-Zurück-Taste
    // wurde der History-Eintrag bereits konsumiert; render() stellt ihn über
    // pushModalHistoryIfNeeded() automatisch wieder her.
    render();
    return;
  }
  stopLiveGpsOnMap();
  // Zustiege/Abstiege sind "verschachtelt" unter einer Hütte / Tour / Sektor — beim
  // Schliessen zurück zur jeweiligen Detailansicht statt ganz zur Übersicht, damit
  // man nicht jedes Mal neu hinein navigieren muss. Ein Klick auf X/Zurück (oder die
  // Hardware-Zurück-Taste) schliesst dadurch immer nur die zuoberst offene Ebene.
  if(state.modal && (state.modal.type==='access-route-detail' || state.modal.type==='edit-access-route') && state.modal.payload && state.modal.payload.hutId){
    state.modal = {type:'hut-detail', payload: state.modal.payload.hutId};
  }else if(state.modal && (state.modal.type==='tour-route-detail' || state.modal.type==='edit-tour-route') && state.modal.payload && state.modal.payload.tourId){
    state.modal = {type:'tour-detail', payload: state.modal.payload.tourId};
  }else if(state.modal && (state.modal.type==='sektor-route-detail' || state.modal.type==='edit-sektor-route') && state.modal.payload && state.modal.payload.sektorId){
    state.modal = {type:'sektor-detail', payload: state.modal.payload.sektorId};
  }else{
    state.modal = null;
  }
  render();
  // keepHistoryLayer: der Aufrufer öffnet direkt im Anschluss ein neues Modal (z. B. nach dem
  // Speichern zur Detailansicht) — dann ist die Modal-"Ebene" aus Sicht der Browser-Historie nie
  // wirklich geschlossen worden, also darf hier kein history.back() ausgelöst werden. Das wäre
  // sonst ein synchrones history.back() gefolgt von einem sofortigen history.pushState() (beim
  // Öffnen des neuen Modals) — genau diese Kombination verhält sich browserübergreifend
  // inkonsistent und kann die Historie verwirren, sodass eine spätere Zurück-Aktion zu weit
  // zurückspringt (bis auf die andere App).
  // Wurde diese Detailansicht von der Vollbild-Übersichtskarte aus geöffnet (siehe
  // openTourFromMap() etc. in 0-shared.js), landet man beim endgültigen Schliessen wieder auf der
  // Karte statt auf der normalen Übersicht darunter. Wichtig: hier NICHT zusätzlich
  // consumeHistoryEntry() (history.back()) aufrufen, bevor openStandaloneMap() gleich seinerseits
  // einen neuen History-Eintrag pusht — genau dieses synchrone back()+pushState() ist der Fehler,
  // der oben bei keepHistoryLayer bereits vermieden wird.
  if(!state.modal && !keepHistoryLayer && modalOpenedFromStandaloneMap){
    modalOpenedFromStandaloneMap = false;
    modalHistoryPushed = false;
    openStandaloneMap();
  }else if(!state.modal && modalHistoryPushed && !keepHistoryLayer){
    modalHistoryPushed = false;
    if(!fromPopstate) consumeHistoryEntry();
  }
}

function mergeImportedData(json){
  let data;
  try{ data = JSON.parse(json); }
  catch(e){ throw new Error('Das eingefügte Format ist kein gültiges JSON.'); }
  const importedTours = Array.isArray(data.tours) ? data.tours : [];
  const importedHuts = Array.isArray(data.huts) ? data.huts : [];
  const importedSektoren = Array.isArray(data.sektoren) ? data.sektoren : [];
  const importedAgenda = Array.isArray(data.agenda) ? data.agenda : [];
  let addedTours = 0, updatedTours = 0, addedHuts = 0, updatedHuts = 0, addedSektoren = 0, updatedSektoren = 0, addedAgenda = 0, updatedAgenda = 0;
  importedTours.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    const idx = state.tours.findIndex(x=>x.id===t.id);
    if(idx>=0){ state.tours[idx] = t; updatedTours++; }
    else { state.tours.unshift(t); addedTours++; }
  });
  importedHuts.forEach(h=>{
    if(!h || !h.id || !h.name) return;
    const idx = state.huts.findIndex(x=>x.id===h.id);
    if(idx>=0){ state.huts[idx] = h; updatedHuts++; }
    else { state.huts.push(h); addedHuts++; }
  });
  importedSektoren.forEach(sek=>{
    if(!sek || !sek.id || !sek.name) return;
    const idx = state.sektoren.findIndex(x=>x.id===sek.id);
    if(idx>=0){ state.sektoren[idx] = sek; updatedSektoren++; }
    else { state.sektoren.unshift(sek); addedSektoren++; }
  });
  importedAgenda.forEach(a=>{
    if(!a || !a.id || !a.tourName) return;
    const idx = state.agenda.findIndex(x=>x.id===a.id);
    if(idx>=0){ state.agenda[idx] = a; updatedAgenda++; }
    else { state.agenda.unshift(a); addedAgenda++; }
  });
  importedTours.forEach(t=> saveTourCloud(t).catch(()=>markUnsaved()));
  importedHuts.forEach(h=> saveHutCloud(h).catch(()=>markUnsaved()));
  importedSektoren.forEach(sek=> saveSektorCloud(sek).catch(()=>markUnsaved()));
  importedAgenda.forEach(a=> saveAgendaCloud(a).catch(()=>markUnsaved()));
  return {addedTours, updatedTours, addedHuts, updatedHuts, addedSektoren, updatedSektoren, addedAgenda, updatedAgenda};
}

/* ================= Sektor-Vorschläge: gleicher Gipfel/gemeinsamer Ausgangspunkt =================
   Erkennt MSL-Touren, die noch keinem Sektor zugeordnet sind, aber vermutlich zusammengehören
   (gleicher Gipfelname und/oder ein Punkt in der Nähe eines Punkts von currentTour). Dient als
   Vorschlag in der Tour-Detailansicht, nie automatisch — der Nutzer bestätigt die Zusammenlegung. */
function findSektorCandidateTours(currentTour, allTours, maxMeters){
  maxMeters = maxMeters || 300;
  if(currentTour.tourCategory!=='msl' || currentTour.sektorId) return [];
  const myName = (currentTour.name||'').trim().toLowerCase();
  const myPoints = currentTour.points || [];
  return allTours.filter(t=>{
    if(t.id===currentTour.id || t.tourCategory!=='msl' || t.sektorId) return false;
    const sameName = myName && (t.name||'').trim().toLowerCase()===myName;
    const otherPoints = t.points || [];
    const sharesPoint = myPoints.length && otherPoints.length && myPoints.some(mp=>otherPoints.some(op=>haversineMeters(mp.lat,mp.lon,op.lat,op.lon)<=maxMeters));
    return sameName || sharesPoint;
  });
}
async function createSektorFromTours(tourIds){
  const tours = tourIds.map(id=>state.tours.find(t=>t.id===id)).filter(Boolean);
  if(tours.length<2) return;
  const base = tours[0];
  const names = tours.map(t=>'„'+t.name+(t.routeName?' – '+t.routeName:'')+'"').join(', ');
  if(!confirm('Sektor „'+base.name+'" aus '+tours.length+' Touren erstellen?\n\n'+names+'\n\nDie Touren werden mit dem neuen Sektor verknüpft; bereits erfasste eigene Zustiege/Abstiege der ersten Tour werden in den Sektor übernommen.')) return;
  const sek = {
    id: uid('sek'), name: base.name, region: base.region||'', subregion: base.subregion||'',
    description: '', points: base.points||[], manualTrack: [],
    accessRoutes: (base.accessRoutes||[]).slice(), descentRoutes: (base.descentRoutes||[]).slice(),
    createdBy: state.myName, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), updatedBy: state.myName
  };
  state.sektoren.unshift(sek);
  tours.forEach(t=>{ t.sektorId = sek.id; t.accessRoutes = []; t.descentRoutes = []; t.updatedAt = new Date().toISOString(); t.updatedBy = state.myName; });
  closeModal(false, true, true);
  state.modal = {type:'sektor-detail', payload:sek.id};
  render();
  const ok = await saveSektorCloud(sek).catch(()=>false);
  if(!ok) markUnsaved();
  await Promise.all(tours.map(t=> saveTourCloud(t).catch(()=>{ t._unsynced = true; markUnsaved(); })));
  showToast(ok ? 'Sektor erstellt und Touren verknüpft.' : 'Sektor lokal erstellt, aber nicht synchronisiert.', !ok);
  render();
}

   Zustiege/Abstiege (analog zum Hütten-Zustiegssystem bzw. den MSL-Touren-Zustiegen oben) —
   verlinkte Touren zeigen automatisch diese statt eigener (siehe tourDetailHtml). */
async function submitSektorForm(form, existing){
  const s = (existing && existing.id) ? {...existing} : {id: uid('sek'), createdBy: state.myName, createdAt: new Date().toISOString()};
  s.name = form.name.trim();
  s.region = form.region || '';
  s.subregion = form.subregion || '';
  s.description = form.description || '';
  try{ s.points = form.points ? JSON.parse(form.points) : []; }catch(e){ s.points = []; }
  try{ s.manualTrack = form.manualTrack ? JSON.parse(form.manualTrack) : []; }catch(e){ s.manualTrack = []; }
  ensureSektorRouteArrays(s);
  s.updatedAt = new Date().toISOString();
  s.updatedBy = state.myName;

  const idx = state.sektoren.findIndex(x=>x.id===s.id);
  if(idx>=0) state.sektoren[idx] = s; else state.sektoren.unshift(s);
  closeModal(false, true, true);
  state.modal = {type:'sektor-detail', payload:s.id};
  render();

  const ok = await saveSektorCloud(s).catch(()=>false);
  s._unsynced = !ok;
  if(!ok){
    markUnsaved();
    showToast('Sektor ist lokal gespeichert, konnte aber nicht synchronisiert werden. Prüfe deine Internetverbindung.', true);
  }else{
    showToast('Sektor gespeichert und synchronisiert.');
  }
  render();
}

// Zentrale Sektor-Übersichtskarte: fasst die Punkte/Tracks des Sektors selbst UND aller
// verlinkten Touren auf einer Karte zusammen — liest live aus state, keine Doppel-Eingabe nötig.
function renderSektorOverviewMap(containerId, sektorId){
  const el = document.getElementById(containerId);
  if(el){ el.innerHTML = '<p style="font-size:13px; color:var(--ink-soft);">Karte wird geladen…</p>'; }
  ensureLeafletLoaded().then(()=>{
    const el2 = document.getElementById(containerId);
    if(!el2) return;
    const sek = state.sektoren.find(x=>x.id===sektorId);
    if(!sek){ el2.innerHTML = ''; return; }
    const linkedTours = state.tours.filter(t=>t.sektorId===sektorId);
    const tourEntries = linkedTours.map((t,i)=>({ tour:t, color: ACCESS_ROUTE_COLORS[i % ACCESS_ROUTE_COLORS.length] }));
    const hasSektorPoints = sek.points && sek.points.length;
    const hasAny = hasSektorPoints || tourEntries.some(e=> (e.tour.points && e.tour.points.length) || (e.tour.trackSimplified && e.tour.trackSimplified.length) || (e.tour.manualTrack && e.tour.manualTrack.length));
    if(!hasAny){
      el2.innerHTML = '<p style="font-size:13px; color:var(--ink-soft);">Noch keine Kartendaten — weder beim Sektor noch bei den verlinkten Touren.</p>';
      return;
    }
    const mapDivId = containerId + '-inner';
    destroyExistingMap(mapDivId);
    el2.innerHTML = '';
    const isFullscreen = containerId === 'fullscreen-map-container';
    const mapDiv = document.createElement('div');
    mapDiv.id = mapDivId;
    mapDiv.style.cssText = isFullscreen
      ? 'height:100%; border-radius:0; overflow:hidden;'
      : 'height:280px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);';
    el2.appendChild(mapDiv);
    const firstTourPoint = tourEntries.map(e=> e.tour.points && e.tour.points.length ? e.tour.points[0] : null).find(Boolean);
    const startPoint = hasSektorPoints ? sek.points[0] : firstTourPoint;
    const map = L.map(mapDivId).setView(startPoint ? [startPoint.lat, startPoint.lon] : [46.8182, 8.2275], startPoint ? 13 : 8);
    registerMap(mapDivId, map);
    addBaseLayerSwitcher(map);
    const boundsItems = [];
    if(hasSektorPoints){
      sek.points.forEach(p=>{
        try{
          const m = L.marker([p.lat, p.lon], {icon: makeCategoryIcon(p.category)}).addTo(map).bindPopup(`<strong>${esc(sek.name)}</strong><br/>${esc(p.label||'Punkt')}`);
          boundsItems.push(m);
        }catch(e){ /* einzelner fehlerhafter Punkt überspringen */ }
      });
    }
    tourEntries.forEach(({tour:t, color})=>{
      const track = (t.trackSimplified && t.trackSimplified.length) ? t.trackSimplified : (t.manualTrack && t.manualTrack.length ? t.manualTrack : null);
      if(track){
        try{
          L.polyline(track, {color:'#ffffff', weight:6, opacity:0.7}).addTo(map);
          const line = L.polyline(track, {color, weight:3.5, opacity:1}).addTo(map);
          boundsItems.push(line);
        }catch(e){ /* einzelnen fehlerhaften Track überspringen */ }
      }
      (t.points||[]).forEach(p=>{
        try{
          const m = L.circleMarker([p.lat, p.lon], {radius:8, color:'#fff', weight:2, fillColor:color, fillOpacity:1}).addTo(map)
            .bindPopup(`<strong>${esc(t.name)}</strong>${t.routeName ? ' – '+esc(t.routeName) : ''}<br/>${esc(p.label||'Punkt')}`);
          boundsItems.push(m);
        }catch(e){ /* einzelnen fehlerhaften Punkt überspringen */ }
      });
    });
    if(boundsItems.length){
      map.fitBounds(L.featureGroup(boundsItems).getBounds(), {padding:[30,30]});
    }
    if(!isFullscreen){
      const btn = makeFullscreenButton(function(id){ renderSektorOverviewMap(id, sektorId); });
      el2.appendChild(btn);
    }
  }).catch(err=>{
    const el3 = document.getElementById(containerId);
    if(el3) el3.innerHTML = '<p style="font-size:13px; color:var(--ink-soft);">Karte konnte nicht geladen werden (keine Internetverbindung?).</p>';
  });
}

async function submitSektorRouteForm(form){
  const sek = state.sektoren.find(x=>x.id===form.sektorId);
  if(!sek) return;
  ensureSektorRouteArrays(sek);
  const kind = form.kind;
  const field = sektorRouteFieldName(kind);
  let track = null;
  try{ track = form.trackSimplified ? JSON.parse(form.trackSimplified) : null; }catch(e){ track = null; }
  let manual = [];
  try{ manual = form.manualTrack ? JSON.parse(form.manualTrack) : []; }catch(e){ manual = []; }
  const routeData = {
    id: form.routeId || uid('sr'),
    name: (form.name||'').trim(),
    elevation: form.elevation||'',
    elevationUp: form.elevationUp||'',
    duration: form.duration||'',
    difficultyT: form.difficultyT||'',
    description: form.description||'',
    gpxLink: form.gpxLink||'',
    trackSimplified: track,
    manualTrack: manual
  };
  const idx = sek[field].findIndex(r=>r.id===routeData.id);
  if(idx>=0) sek[field][idx] = routeData; else sek[field].push(routeData);
  sek.updatedAt = new Date().toISOString();
  sek.updatedBy = state.myName;
  closeModal(false, true, true);
  state.modal = {type:'sektor-detail', payload:sek.id};
  render();
  const ok = await saveSektorCloud(sek).catch(()=>false);
  sek._unsynced = !ok;
  if(!ok){ markUnsaved(); showToast(sektorRouteTitle(kind)+' lokal gespeichert, aber nicht synchronisiert.', true); }
  else{ showToast(sektorRouteTitle(kind)+' gespeichert.'); }
  render();
}

async function deleteSektorRoute(sektorId, kind, routeId){
  const sek = state.sektoren.find(x=>x.id===sektorId);
  if(!sek) return;
  const field = sektorRouteFieldName(kind);
  sek[field] = (sek[field]||[]).filter(r=>r.id!==routeId);
  sek.updatedAt = new Date().toISOString();
  sek.updatedBy = state.myName;
  closeModal(false, true, true);
  state.modal = {type:'sektor-detail', payload:sektorId};
  render();
  const ok = await saveSektorCloud(sek).catch(()=>false);
  sek._unsynced = !ok;
  if(!ok) markUnsaved();
  render();
  showToast(sektorRouteTitle(kind)+' gelöscht.');
}

function setFormBusy(formId, busy){
  const form = document.getElementById(formId);
  if(!form) return;
  const btnId = formId==='tour-form' ? 'tour-save-btn' : 'hut-save-btn';
  const btn = document.getElementById(btnId);
  if(btn){
    btn.disabled = busy;
    if(busy){ btn.dataset.origText = btn.textContent; btn.textContent = 'Speichert…'; }
    else if(btn.dataset.origText){ btn.textContent = btn.dataset.origText; }
  }
}
function showFormError(formId, message){
  const form = document.getElementById(formId);
  if(!form) return;
  let box = form.querySelector('.form-error');
  if(!box){
    box = document.createElement('div');
    box.className = 'form-error';
    const actions = form.querySelector('.form-actions');
    if(actions) form.insertBefore(box, actions);
    else form.appendChild(box);
  }
  box.textContent = message;
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ================= Hütten view ================= */
function filteredHuts(){
  let list = state.huts;
  if(state.activeHutRegionFilters.size){
    list = list.filter(h=>state.activeHutRegionFilters.has(h.region));
  }
  if(state.activeHutDiffFilters.size){
    list = list.filter(h=>state.activeHutDiffFilters.has(h.accessDifficultySummer) || state.activeHutDiffFilters.has(h.accessDifficultyWinter) || state.activeHutDiffFilters.has(h.accessDifficultySummerT));
  }
  if(state.activeHutApproachTypeFilters.size){
    list = list.filter(h=>(h.approachTypes||[]).some(v=>state.activeHutApproachTypeFilters.has(v)));
  }
  if(state.activeHutStaffedMonthFilters.size){
    list = list.filter(h=>[...(h.staffedMonths||[]), ...(h.staffedMonthsPartial||[])].some(m=>state.activeHutStaffedMonthFilters.has(m)));
  }
  if(state.activeHutWinterraumMonthFilters.size){
    list = list.filter(h=>[...(h.winterraumMonths||[]), ...(h.winterraumMonthsPartial||[])].some(m=>state.activeHutWinterraumMonthFilters.has(m)));
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(h=> (h.name||'').toLowerCase().includes(q) || (h.region||'').toLowerCase().includes(q));
  }
  return sortHuts(list);
}

  else if(m.type==='edit-tour-route') inner = tourRouteFormHtml(m.payload.tourId, m.payload.kind, m.payload.route);
  else if(m.type==='tour-route-detail') inner = tourRouteDetailHtml(m.payload.tourId, m.payload.route, m.payload.kind);

  else if(m.type==='edit-sektor') inner = sektorFormHtml(m.payload);

  else if(m.type==='edit-sektor-route') inner = sektorRouteFormHtml(m.payload.sektorId, m.payload.kind, m.payload.route);
  else if(m.type==='sektor-route-detail') inner = sektorRouteDetailHtml(m.payload.sektorId, m.payload.route, m.payload.kind);
  else if(m.type==='export') inner = exportModalHtml(m.payload);
  else if(m.type==='import') inner = importModalHtml();
  else if(m.type==='vorlagen') inner = vorlagenModalHtml(TOUR_VORLAGE_JSON);
  else if(m.type==='bedienungsanleitung') inner = bedienungsanleitungModalHtml();
  else if(m.type==='add-agenda') inner = agendaFormHtml();
  else if(m.type==='agenda-detail') inner = agendaDetailHtml(m.payload);
  else if(m.type==='emergency') inner = emergencyCardHtml();
  else if(m.type==='add-completion') inner = completionModalHtml(m.payload);
  root.innerHTML = `<div class="overlay" data-act="overlay-close">${inner}</div>`;
  wireModalHandlers();
}

// Baut die Export-Nutzlast anhand der aktuell angehakten Filter-Chips im Export-Fenster.
// Bewusst nicht "alles immer" (wie früher) — man will z. B. oft nur die eigenen MSL-Touren an
// jemanden weitergeben, nicht die ganze Sammlung samt Hütten/Sektoren/Agenda.
function buildExportData(){
  const singleTourId = state.modal && state.modal.type==='export' && state.modal.payload && state.modal.payload.tourId;
  if(singleTourId){
    const tour = state.tours.find(t=>t.id===singleTourId);
    return tour ? {tours:[tour]} : {};
  }
  const chips = document.querySelectorAll('#export-filter-chips .chip');
  const selected = new Set();
  chips.forEach(c=>{ if(c.classList.contains('on')) selected.add(c.getAttribute('data-export-key')); });
  const data = {};
  const tours = [];
  if(selected.has('tours-hochtour')) tours.push(...state.tours.filter(t=>(t.tourCategory||'hochtour')!=='msl'));
  if(selected.has('tours-msl')) tours.push(...state.tours.filter(t=>t.tourCategory==='msl'));
  if(tours.length) data.tours = tours;
  if(selected.has('huts')) data.huts = state.huts;
  if(selected.has('sektoren')) data.sektoren = state.sektoren;
  if(selected.has('agenda')) data.agenda = state.agenda;
  return data;
}
function refreshExportText(){
  const ta = document.getElementById('export-text');
  if(ta) ta.value = JSON.stringify(buildExportData(), null, 2);
}

  const isKnownRegion = REGIONS.includes(t.region);

  const ROPE_TYPES = ['Gletscherseil','Einfachseil','Halbseilstrang','Zwillingsseil'];
  const ROPE_LENGTHS = ['30m','40m','50m','60m','70m'];
  return `<div class="modal" data-stop="1">
    <div class="modal-head"><h2>${(existing&&existing.id)?'Tour bearbeiten':'Neue Tour'}</h2><button class="x-btn" data-act="close-modal">×</button></div>
    <form id="tour-form" novalidate>
      <div class="field"><label>Tourtyp</label>
        <div class="chips">
          <button type="button" class="chip type-chip ${(t.tourCategory||'hochtour')==='hochtour'?'on':''}" style="${(t.tourCategory||'hochtour')==='hochtour'?'background:var(--ice-deep)':''}" data-type="hochtour">🏔️ Hochtour</button>
          <button type="button" class="chip type-chip ${t.tourCategory==='msl'?'on':''}" style="${t.tourCategory==='msl'?'background:var(--ice-deep)':''}" data-type="msl">🧗 MSL</button>
        </div>
        <input type="hidden" name="tourCategory" id="tourcategory-hidden" value="${esc(t.tourCategory||'hochtour')}"/>
      </div>
      <div class="row2">
        <div class="field"><label>Gipfel / Bergmassiv *</label><input required name="name" value="${esc(t.name||'')}" placeholder="z. B. Unnerbächhorn"/></div>
        <div class="field"><label>Route</label><input name="routeName" value="${esc(t.routeName||'')}" placeholder="z. B. Südgrat"/></div>
      </div>
      <div class="field"><label>Region</label>
        <div class="chips" id="region-chips">
          ${REGIONS.map(r=>`<button type="button" class="chip region-chip ${t.region===r?'on':''}" style="${t.region===r?'background:var(--ice-deep)':''}" data-region="${r}">${r}</button>`).join('')}
          <button type="button" class="chip region-chip ${t.region && !isKnownRegion?'on':''}" style="${t.region && !isKnownRegion?'background:var(--ice-deep)':''}" data-region="__other__">Anderes</button>
        </div>
        <input type="text" id="region-other-input" value="${!isKnownRegion?esc(t.region||''):''}" placeholder="eigene Region eintragen" style="margin-top:8px; ${t.region && !isKnownRegion?'':'display:none;'}"/>
        <input type="hidden" name="region" id="region-hidden-input" value="${esc(t.region||'')}"/>
      </div>
      <div class="field" id="subregion-field" style="${(isKnownRegion && REGION_SUBAREAS[t.region])?'':'display:none;'}">
        <label>Teilgebiet / Pass (optional)</label>
        <div class="chips" id="subregion-chips">${renderSubregionChipsHtml(t.region, t.subregion)}</div>
        <input type="hidden" name="subregion" id="subregion-hidden" value="${esc(t.subregion||'')}"/>
      </div>

      <h3 style="font-size:15px; margin:16px 0 5px 0; padding-top:10px; border-top:1px solid var(--line);">Schwierigkeit &amp; Sicherheit</h3>

      <div id="hochtour-safety-fields" style="${(t.tourCategory||'hochtour')==='hochtour'?'':'display:none;'}">
        <div class="row2">
          <div class="field"><label>Schwierigkeit (SAC)</label>
            <select name="difficulty">
              <option value="" ${!t.difficulty?'selected':''}>— keine Angabe —</option>
              ${DIFF_ORDER.map(c=>`<option value="${c}" ${t.difficulty===c?'selected':''}>${c} — ${DIFF[c].label}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Maximale Felsschwierigkeit</label>
            <select name="climbGrade">
              <option value="" ${!t.climbGrade?'selected':''}>— keine —</option>
              ${CLIMB_ORDER.map(c=>`<option value="${c}" ${t.climbGrade===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field"><label>Gletscher</label>
          <div class="chips">
            <button type="button" class="chip glacier-chip ${t.glacier==='ja'?'on':''}" style="${t.glacier==='ja'?'background:var(--ice-deep)':''}" data-value="ja">Ja</button>
            <button type="button" class="chip glacier-chip ${(t.glacier||'nein')==='nein'?'on':''}" style="${(t.glacier||'nein')==='nein'?'background:var(--ice-deep)':''}" data-value="nein">Nein</button>
          </div>
          <input type="hidden" name="glacier" id="glacier-hidden" value="${esc(t.glacier||'nein')}"/>
        </div>
        <div class="field"><label>Spaltenrisiko</label>
          <div class="chips">
            <button type="button" class="chip crevasse-chip ${(t.crevasseRisk||'nein')==='nein'?'on':''}" style="${(t.crevasseRisk||'nein')==='nein'?'background:var(--ice-deep)':''}" data-value="nein">Nein</button>
            <button type="button" class="chip crevasse-chip ${t.crevasseRisk==='moeglich'?'on':''}" style="${t.crevasseRisk==='moeglich'?'background:var(--ice-deep)':''}" data-value="moeglich">Möglich</button>
            <button type="button" class="chip crevasse-chip ${t.crevasseRisk==='ausgepraegt'?'on':''}" style="${t.crevasseRisk==='ausgepraegt'?'background:var(--ice-deep)':''}" data-value="ausgepraegt">Ausgeprägt</button>
          </div>
          <input type="hidden" name="crevasseRisk" id="crevasse-hidden" value="${esc(t.crevasseRisk||'nein')}"/>
        </div>
        <div class="field"><label>Abstiegsart</label>
          <div class="chips">
            ${DESCENT_TYPES.map(d=>`<button type="button" class="chip descent-chip-ht ${t.descentType===d?'on':''}" style="${t.descentType===d?'background:var(--ice-deep)':''}" data-value="${d}">${d}</button>`).join('')}
          </div>
          <input type="hidden" name="descentTypeHochtour" id="descent-hidden-ht" value="${esc((t.tourCategory||'hochtour')!=='msl' ? (t.descentType||'') : '')}"/>
        </div>
        <div class="field"><label>Exposition</label>
          <div class="chips">
            ${EXPOSITIONS.map(x=>`<button type="button" class="chip exposition-hochtour-chip ${(t.exposition||[]).includes(x)?'on':''}" style="${(t.exposition||[]).includes(x)?'background:var(--ice-deep)':''}" data-value="${x}">${x}</button>`).join('')}
          </div>
        </div>
        <div class="field"><label>Gefahren</label>
          <div class="chips">
            ${GEFAHREN_HOCHTOUR.map(g=>`<button type="button" class="chip gefahren-hochtour-chip ${(t.gefahren||[]).includes(g)?'on':''}" style="${(t.gefahren||[]).includes(g)?'background:var(--ice-deep)':''}" data-value="${g}">${g}</button>`).join('')}
          </div>
        </div>
      </div>

      <div id="msl-safety-fields" style="${t.tourCategory==='msl'?'':'display:none;'}">
        <div class="row2">
          <div class="field"><label>Obligatorische Schwierigkeit</label>
            <select name="mandatoryDifficulty">
              <option value="" ${!t.mandatoryDifficulty?'selected':''}>— keine Angabe —</option>
              ${CLIMB_ORDER.map(c=>`<option value="${c}" ${t.mandatoryDifficulty===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Schlüsselstelle</label>
            <select name="cruxDifficulty">
              <option value="" ${!t.cruxDifficulty?'selected':''}>— keine Angabe —</option>
              ${CLIMB_ORDER.map(c=>`<option value="${c}" ${t.cruxDifficulty===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field"><label>Längste Seillänge</label><input name="longestPitch" value="${esc(t.longestPitch||'')}" placeholder="z. B. 35m"/></div>
        <div class="field"><label>Absicherung</label>
          <div class="chips" style="flex-direction:column; align-items:flex-start; gap:8px;">
            ${PROTECTION_LEVELS.map(p=>`<button type="button" class="chip protection-chip ${t.protection===p.value?'on':''}" style="${t.protection===p.value?'background:var(--ice-deep)':''}; text-align:left;" data-value="${p.value}">${p.label} <span style="font-weight:400; opacity:0.8;">— ${p.desc}</span></button>`).join('')}
          </div>
          <input type="hidden" name="protection" id="protection-hidden" value="${esc(t.protection||'')}"/>
        </div>
        <div class="field"><label>Abstieg</label>
          <div class="chips">
            ${DESCENT_TYPES.map(d=>`<button type="button" class="chip descent-chip ${t.descentType===d?'on':''}" style="${t.descentType===d?'background:var(--ice-deep)':''}" data-value="${d}">${d}</button>`).join('')}
          </div>
          <input type="hidden" name="descentType" id="descent-hidden" value="${esc(t.descentType||'')}"/>
        </div>
        <div class="field"><label>Exposition</label>
          <div class="chips">
            ${EXPOSITIONS.map(x=>`<button type="button" class="chip exposition-msl-chip ${(t.exposition||[]).includes(x)?'on':''}" style="${(t.exposition||[]).includes(x)?'background:var(--ice-deep)':''}" data-value="${x}">${x}</button>`).join('')}
          </div>
        </div>
        <div class="field"><label>Gefahren</label>
          <div class="chips">
            ${GEFAHREN_MSL.map(g=>`<button type="button" class="chip gefahren-msl-chip ${(t.gefahren||[]).includes(g)?'on':''}" style="${(t.gefahren||[]).includes(g)?'background:var(--ice-deep)':''}" data-value="${g}">${g}</button>`).join('')}
          </div>
        </div>
      </div>

      <h3 style="font-size:15px; margin:16px 0 5px 0; padding-top:10px; border-top:1px solid var(--line);">Material</h3>
      <div class="field"><label>Tourenspezifisches Material</label>
        <div class="chips">
          ${MATERIAL_FIXSEIL.map(m=>`<button type="button" class="chip material-chip ${selectedMaterial.includes(m)?'on':''}" style="${selectedMaterial.includes(m)?'background:var(--ice-deep)':''}" data-value="${m}">${m}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Anzahl Expressschlingen</label><input name="quickdrawCount" value="${esc(t.quickdrawCount||'')}" placeholder="z. B. 10"/></div>
      <div class="field"><label>Seiltyp</label>
        <div class="chips" id="rope-type-chips">
          ${ROPE_TYPES.map(r=>`<button type="button" class="chip rope-type-chip ${t.ropeType===r?'on':''}" style="${t.ropeType===r?'background:var(--ice-deep)':''}" data-rope-type="${r}">${r}</button>`).join('')}
        </div>
        <input type="hidden" name="ropeType" id="rope-type-hidden" value="${esc(t.ropeType||'')}"/>
      </div>
      <div class="field"><label>Seillänge</label>
        <div class="chips" id="rope-length-chips">
          ${ROPE_LENGTHS.map(r=>`<button type="button" class="chip rope-length-chip ${t.ropeLength===r?'on':''}" style="${t.ropeLength===r?'background:var(--ice-deep)':''}" data-rope-length="${r}">${r}</button>`).join('')}
        </div>
        <input type="hidden" name="ropeLength" id="rope-length-hidden" value="${esc(t.ropeLength||'')}"/>
      </div>
      <div class="row2">
        <div class="field"><label>Ziel – Gipfelhöhe (m ü. M.)</label><input name="targetAltitude" value="${esc(t.targetAltitude||'')}" placeholder="z. B. 4545"/></div>
        <div class="field"><label>Zeitbedarf (h)</label><input name="duration" value="${esc(t.duration||'')}" placeholder="z. B. 6–8"/></div>
      </div>
      <div class="row2">
        <div class="field"><label>Aufstieg (Hm)</label><input name="elevationGain" value="${esc(t.elevationGain||'')}" placeholder="z. B. 1200"/></div>
        <div class="field"><label>Abstieg (Hm, falls abweichend)</label><input name="elevationLoss" value="${esc(t.elevationLoss||'')}" placeholder="z. B. 1600"/></div>
      </div>
      <div class="field"><label>Link zur Tour</label><input type="url" name="tourLink" id="tour-link-input" value="${esc(t.tourLink||'')}" placeholder="https://www.camptocamp.org/..."/>
        <button type="button" class="btn secondary" id="camptocamp-search-toggle-btn" style="margin-top:8px;">🔍 Auf Camptocamp.org suchen</button>
        <div id="camptocamp-search-box" style="margin-top:10px; display:none;"></div>
      </div>
      <div class="field"><label>Link zu einer GPX-Datei (optional)</label><input type="url" name="gpxLink" value="${esc(t.gpxLink||'')}" placeholder="https://.../track.gpx"/></div>
      <div class="field"><label>Eigenen GPX-Track hochladen</label>
        <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml"/>
        <div class="hint">Wird automatisch für die Kartenanzeige vereinfacht. Die Originaldatei bleibt separat gespeichert und ist jederzeit als Volldownload abrufbar.</div>
        <p id="gpx-upload-status" style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;">${t.trackSimplified ? '✓ GPX-Track bereits hochgeladen.' : 'Noch kein Track hochgeladen.'}</p>
        <input type="hidden" name="trackSimplified" id="track-simplified-hidden" value='${esc(t.trackSimplified ? JSON.stringify(t.trackSimplified) : "")}'/>
        <input type="hidden" name="tourIdForTrack" id="tour-id-for-track" value="${esc(t.id||'')}"/>
      </div>
      <div class="field"><label>Topo-Bilder (max. ${TOPO_IMAGE_MAX_COUNT})</label>
        <input type="file" id="topo-image-input" accept="image/*" multiple/>
        <div class="hint">Werden automatisch verkleinert vor dem Hochladen (spart Speicherplatz und Datenvolumen).</div>
        <p id="topo-image-status" style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;">${(t.topoImages && t.topoImages.length) ? `✓ ${t.topoImages.length}/${TOPO_IMAGE_MAX_COUNT} Bilder hochgeladen.` : 'Noch keine Bilder hochgeladen.'}</p>
        <input type="hidden" name="topoImages" id="topo-images-hidden" value='${esc(t.topoImages ? JSON.stringify(t.topoImages) : "[]")}'/>
        <div id="topo-images-hidden-thumbs">${topoImageThumbsHtml(t.topoImages, 'topo-images-hidden')}</div>
      </div>
      <div class="field"><label>Schlüsselstelle</label><textarea name="crux" placeholder="z. B. Querung unter dem Bergschrund, kurze Eispassage am Grat …">${esc(t.crux||'')}</textarea></div>
      <div class="field"><label>Spezielles</label><textarea name="special" placeholder="Spaltenrisiko, Steinschlag, beste Jahreszeit …">${esc(t.special||'')}</textarea></div>
      <div id="pitchcount-field" class="field" style="${t.tourCategory==='msl'?'':'display:none;'} background:var(--ice-light); border-radius:var(--radius); padding:12px 14px;">
        <label style="font-weight:700; font-size:15px;">Anzahl Seillängen</label>
        <input name="pitchCount" value="${esc(t.pitchCount||'')}" placeholder="z. B. 8" style="font-size:20px; font-weight:700; text-align:center;"/>
      </div>
      <div class="field"><label>Aufstieg</label><textarea name="ascent" placeholder="Route, Orientierungspunkte, Gefahrenstellen …">${esc(t.ascent||'')}</textarea></div>
      <div class="field"><label>Art der Anfahrt</label>
        <div class="chips" id="approach-type-chips">
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('auto')?'on':''}" style="${(t.approachTypes||[]).includes('auto')?'background:var(--ice-deep)':''}" data-value="auto">🚗 Auto</button>
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('oev')?'on':''}" style="${(t.approachTypes||[]).includes('oev')?'background:var(--ice-deep)':''}" data-value="oev">🚌 ÖV</button>
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('seilbahn')?'on':''}" style="${(t.approachTypes||[]).includes('seilbahn')?'background:var(--ice-deep)':''}" data-value="seilbahn">🚡 Seilbahn</button>
          <button type="button" class="chip approach-type-chip ${(t.approachTypes||[]).includes('zufuss')?'on':''}" style="${(t.approachTypes||[]).includes('zufuss')?'background:var(--ice-deep)':''}" data-value="zufuss">🥾 Zu Fuss</button>
        </div>
      </div>
      <div class="field"><label>Ausgangspunkt / Aufenthalt</label>
        <div class="chips" id="stay-type-chips">
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('tagestour')?'on':''}" style="${(t.stayTypes||[]).includes('tagestour')?'background:var(--ice-deep)':''}" data-value="tagestour">☀️ Tagestour</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('huette')?'on':''}" style="${(t.stayTypes||[]).includes('huette')?'background:var(--ice-deep)':''}" data-value="huette">🛖 Hütte</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('biwak')?'on':''}" style="${(t.stayTypes||[]).includes('biwak')?'background:var(--ice-deep)':''}" data-value="biwak">⛺ Biwak</button>
          <button type="button" class="chip stay-type-chip ${(t.stayTypes||[]).includes('zelt')?'on':''}" style="${(t.stayTypes||[]).includes('zelt')?'background:var(--ice-deep)':''}" data-value="zelt">🏕️ Zelt</button>
        </div>
      </div>
      <div class="field"><label>Anfahrt — Details</label><textarea name="approach" placeholder="Ausgangspunkt, Parkplatz, ÖV …">${esc(t.approach||'')}</textarea></div>
      <div class="field"><label>Punkte &amp; Linie auf der Karte (Parkplatz, Haltestelle, geplante Route …)</label>
        <button type="button" class="btn secondary" id="points-map-toggle-btn">🗺️ Karte öffnen</button>
        <div class="hint">📍 Punkt setzen: antippen, Bezeichnung eintragen, speichern. ✏️ Linie zeichnen: antippen fügt Wegpunkte zur blauen Linie hinzu.</div>
        <div id="points-map" style="margin-top:10px; display:none;"></div>
        <div id="points-list"></div>
        <input type="hidden" name="points" id="points-hidden" value='${esc(JSON.stringify(t.points || (t.lat && t.lon ? [{label:"Ausgangspunkt", lat:t.lat, lon:t.lon}] : [])))}'/>
        <input type="hidden" name="manualTrack" id="manual-track-hidden" value='${esc(JSON.stringify(t.manualTrack || []))}'/>
      </div>
      <div id="descent-freetext-field" class="field" style="${(t.tourCategory||'hochtour')!=='msl'?'':'display:none;'}"><label>Abstieg</label><textarea name="descent" placeholder="Abstiegsroute, Varianten, Abseilstellen …">${esc(t.descent||'')}</textarea></div>
      <div id="descent-msl-hint" class="hint" style="margin:-4px 0 9px 0; ${(t.tourCategory||'hochtour')==='msl'?'':'display:none;'}">Abstieg wird unten in der Detailansicht über "+ Abstieg hinzufügen" strukturiert erfasst (mit Karte/GPX).</div>
      <div class="field"><label>Zustieg über Hütte</label>
        <select name="hutId"><option value="">— keine —</option>${hutOptions}</select>
        <div class="hint">Fehlt die Hütte? Erst unter „Hütten" anlegen, dann hier verlinken.</div>
      </div>
      <div id="sektor-field" class="field" style="${t.tourCategory==='msl'?'':'display:none;'}"><label>Sektor (optional)</label>
        <select name="sektorId"><option value="">— keiner —</option>${sektorOptions}</select>
        <div class="hint">Ist ein Sektor verlinkt, übernimmt die Tour dessen Zustiege/Abstiege automatisch statt eigener. Fehlt der Sektor? Erst unter „Sektoren" anlegen.</div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn secondary" data-act="close-modal">Abbrechen</button>
        <button type="button" id="tour-save-btn" class="btn">${(existing&&existing.id)?'Speichern':'Tour anlegen'}</button>
      </div>
      <button type="button" id="tour-fab-save-btn" class="fab-save">✓ Speichern</button>
      ${(existing&&existing.id) ? `
      <div id="delete-tour-zone" style="margin-top:22px; padding-top:16px; border-top:1px solid var(--line); text-align:right;">
        <button type="button" id="delete-tour-trigger" data-id="${t.id}" style="background:none; border:none; color:var(--ink-faint); font-size:12.5px; text-decoration:underline; cursor:pointer;">Tour löschen</button>
        <div id="delete-tour-confirm" style="display:none; margin-top:10px; font-size:13px; color:var(--danger);">
          Wirklich unwiderruflich löschen?
          <button type="button" id="delete-tour-yes" data-id="${t.id}" class="btn danger" style="padding:5px 12px; font-size:12.5px; margin-left:8px;">Ja, löschen</button>
          <button type="button" id="delete-tour-no" style="background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; margin-left:6px;">Abbrechen</button>
        </div>
      </div>` : ''}
    </form>
  </div>`;
}

function tourDetailHtml(id){
  const t = state.tours.find(x=>x.id===id);
  if(!t) return `<div class="modal" data-stop="1"><p>Tour nicht gefunden.</p></div>`;
  const isMsl = t.tourCategory==='msl';
  const d = t.difficulty ? DIFF[t.difficulty] : null;
  const hut = t.hutId ? state.huts.find(h=>h.id===t.hutId) : null;
  const protectionInfo = t.protection ? PROTECTION_LEVELS.find(p=>p.value===t.protection) : null;
  return `<div class="modal" data-stop="1">
    <div class="modal-head">
      <div>
        <div class="agenda-date-row" style="font-size:12.5px;">${isMsl ? '🧗 MSL — Mehrseillängen-Klettertour' : '🏔️ Hochtour'}</div>
        <div class="detail-badge-row">
          ${isMsl ? `
            ${t.mandatoryDifficulty ? `<span class="badge climb">obligatorisch ${esc(t.mandatoryDifficulty)}</span>` : ''}
            ${t.cruxDifficulty ? `<span class="badge climb">Schlüssel ${esc(t.cruxDifficulty)}</span>` : ''}
          ` : `
            ${d ? `<span class="badge" style="background:${d.color}">${t.difficulty} · ${d.label}</span>` : `<span class="badge" style="background:var(--ink-faint)">unbewertet</span>`}
            ${t.climbGrade ? `<span class="badge climb">🧗 ${esc(t.climbGrade)}</span>` : ''}
          `}
          ${t.targetAltitude ? `<span class="badge" style="background:var(--ice-deep)">${esc(t.targetAltitude)} m ü. M.</span>` : ''}
        </div>
        <h2 style="color:var(--ice-deep);">${esc(t.name)}</h2>
      </div>
      <button class="x-btn" data-act="close-modal">×</button>
    </div>
    ${t.routeName ? `<h2 style="margin:0 0 6px 0; color:var(--ink-soft);">${esc(t.routeName)}</h2>` : ''}
    ${t.region ? `<p style="color:var(--ink-soft); font-size:14px; margin:0 0 6px 0;">${esc(t.region)}${t.subregion ? ' – ' + esc(t.subregion) : ''}</p>` : ''}
    <button type="button" class="btn secondary" style="font-size:12.5px; padding:6px 12px; margin-bottom:10px;" data-act="toggle-tour-status" data-id="${t.id}">${tourStatusLabel(t)} — antippen zum Ändern</button>
    <div class="detail-stats">
      <div class="detail-stat"><div class="num">${esc(t.elevationGain||'–')}</div><div class="lbl">Hm Aufstieg</div></div>

        const accessRoutes = linkedSektor.accessRoutes || [];
        const descentRoutes = linkedSektor.descentRoutes || [];
        const accessRange = accessRouteDifficultyRangeHtml(accessRoutes);
        const descentRange = accessRouteDifficultyRangeHtml(descentRoutes);
        return `
        <div class="detail-section">

        <div class="detail-section">
          <h4>Abstiege${descentRoutes.length ? ` (${descentRoutes.length})` : ''} <span style="font-weight:400; font-size:12.5px; color:var(--ink-soft);">— vom Sektor „${esc(linkedSektor.name)}"</span></h4>

            ${descentRange ? `<p style="font-size:13px; color:var(--ink-soft); margin:0 0 8px 0;">${descentRange}</p>` : ''}
            <div class="grid">${descentRoutes.map((r,i)=>sektorRouteRowHtml(r,i,linkedSektor.id,'descent')).join('')}</div>

      const accessRoutes = t.accessRoutes || [];
      const descentRoutes = t.descentRoutes || [];
      const accessRange = accessRouteDifficultyRangeHtml(accessRoutes);
      const descentRange = accessRouteDifficultyRangeHtml(descentRoutes);
      const sektorCandidates = findSektorCandidateTours(t, state.tours, 300);
      return `
      ${sektorCandidates.length ? `<div class="detail-section" style="background:#EAF3EC; border-left:3px solid #2F6B44;">

      <div class="detail-section">
        <h4>Zustiege${accessRoutes.length ? ` (${accessRoutes.length})` : ''}</h4>
        ${accessRoutes.length ? `
          ${accessRange ? `<p style="font-size:13px; color:var(--ink-soft); margin:0 0 8px 0;">${accessRange}</p>` : ''}
          <button type="button" class="btn secondary" style="margin-bottom:10px;" data-act="show-tour-routes-map" data-points='${esc(JSON.stringify(t.points||[]))}' data-routes='${esc(JSON.stringify(accessRoutes))}' data-target="map-tour-access-${t.id}">🗺️ Karte anzeigen</button>
          <div id="map-tour-access-${t.id}" style="margin-bottom:10px;"></div>
          <div class="grid">${accessRoutes.map((r,i)=>tourRouteRowHtml(r,i,t.id,'access')).join('')}</div>
        ` : `<p style="font-size:13px; color:var(--ink-soft);">Noch kein Zustieg erfasst.</p>`}
        <button type="button" class="btn secondary" style="margin-top:10px;" data-act="add-tour-route" data-tour-id="${t.id}" data-kind="access">+ Zustieg hinzufügen</button>
      </div>
      <div class="detail-section">
        <h4>Abstiege${descentRoutes.length ? ` (${descentRoutes.length})` : ''}</h4>
        ${descentRoutes.length ? `
          ${descentRange ? `<p style="font-size:13px; color:var(--ink-soft); margin:0 0 8px 0;">${descentRange}</p>` : ''}
          <button type="button" class="btn secondary" style="margin-bottom:10px;" data-act="show-tour-routes-map" data-points='${esc(JSON.stringify(t.points||[]))}' data-routes='${esc(JSON.stringify(descentRoutes))}' data-target="map-tour-descent-${t.id}">🗺️ Karte anzeigen</button>
          <div id="map-tour-descent-${t.id}" style="margin-bottom:10px;"></div>
          <div class="grid">${descentRoutes.map((r,i)=>tourRouteRowHtml(r,i,t.id,'descent')).join('')}</div>
        ` : `<p style="font-size:13px; color:var(--ink-soft);">Noch kein Abstieg erfasst.</p>`}
        <button type="button" class="btn secondary" style="margin-top:10px;" data-act="add-tour-route" data-tour-id="${t.id}" data-kind="descent">+ Abstieg hinzufügen</button>
      </div>`;
    })() : ''}
    ${(t.points && t.points.length || t.trackSimplified || (t.manualTrack && t.manualTrack.length) || (t.topoImages && t.topoImages.length)) ? offlineSectionHtml(t.id) : ''}
    ${(t.gpxLink || t.trackSimplified || (t.manualTrack && t.manualTrack.length)) ? `<div class="detail-section">
      <h4>GPX-Track</h4>
      ${t.gpxLink ? `<p style="margin:0 0 8px 0;"><a href="${esc(t.gpxLink)}" target="_blank" rel="noopener noreferrer">${esc(t.gpxLink)}</a></p>` : ''}
      ${t.trackSimplified ? `<button type="button" class="btn secondary" data-act="download-gpx" data-id="${t.id}" data-name="${esc(t.name)}">📥 GPX herunterladen (Originaldatei)</button>` : ''}

    </div>` : ''}
    ${(() => {
      const sameCategoryTours = state.tours.filter(x=> (x.tourCategory||'hochtour')===(t.tourCategory||'hochtour'));
      const related = findToursSharingPoints(t, sameCategoryTours, 300);
      return related.length ? `<div class="detail-section">
      <h4>Weitere Touren ab hier (${related.length})</h4>
      <div class="grid" style="margin-top:6px;">${related.map(tourCardHtml).join('')}</div>
    </div>` : '';
    })()}
    ${!isMsl && t.descent ? `<div class="detail-section"><h4>Abstieg</h4><p>${esc(t.descent)}</p></div>` : ''}

    <div class="detail-section">
      <h4>Erledigt (${(t.completions||[]).length})</h4>
      ${(t.completions && t.completions.length) ? t.completions.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).map(c=>`<p style="margin:0 0 4px 0; font-size:14px;">✓ ${esc(c.by)} — ${esc(fmtDateOnly(c.date))}</p>`).join('') : `<p style="font-size:13.5px; color:var(--ink-soft);">Noch nicht erledigt.</p>`}
    </div>

    <div class="meta-line" style="margin-top:16px;">Angelegt von ${esc(t.createdBy||'?')} · ${fmtDate(t.createdAt)}${t.updatedAt && t.updatedAt!==t.createdAt ? ` · zuletzt bearbeitet von ${esc(t.updatedBy||'?')} · ${fmtDate(t.updatedAt)}` : ''}</div>

    <div class="detail-actions">
      <button class="btn secondary" data-act="mark-done" data-kind="tour" data-id="${t.id}">✓ Als erledigt markieren</button>
      <button class="btn secondary" data-act="edit-tour" data-id="${t.id}">Bearbeiten</button>
      <button class="btn secondary" data-act="export-tour" data-id="${t.id}">📤 Exportieren</button>
    </div>
  </div>`;
}

      <div class="field"><label>Name der Hütte *</label><input required name="name" value="${esc(h.name||'')}" placeholder="z. B. Domhütte"/></div>
      <div class="field"><label>Region</label>
        <div class="chips" id="region-chips">
          ${REGIONS.map(r=>`<button type="button" class="chip region-chip ${h.region===r?'on':''}" style="${h.region===r?'background:var(--ice-deep)':''}" data-region="${r}">${r}</button>`).join('')}
          <button type="button" class="chip region-chip ${h.region && !isKnownRegion?'on':''}" style="${h.region && !isKnownRegion?'background:var(--ice-deep)':''}" data-region="__other__">Anderes</button>
        </div>
        <input type="text" id="region-other-input" value="${!isKnownRegion?esc(h.region||''):''}" placeholder="eigene Region eintragen" style="margin-top:8px; ${h.region && !isKnownRegion?'':'display:none;'}"/>

      </div>

        <div class="chips" id="subregion-chips">${renderSubregionChipsHtml(h.region, h.subregion)}</div>
        <input type="hidden" name="subregion" id="subregion-hidden" value="${esc(h.subregion||'')}"/>
      </div>
      <div class="field"><label>Höhe (m ü. M.)</label><input name="altitude" value="${esc(h.altitude||'')}" placeholder="z. B. 2940"/></div>

      </div>

        <div class="chips" id="approach-type-chips">
          <button type="button" class="chip approach-type-chip ${(h.approachTypes||[]).includes('auto')?'on':''}" style="${(h.approachTypes||[]).includes('auto')?'background:var(--ice-deep)':''}" data-value="auto">🚗 Auto</button>

      <div class="form-actions">
        <button type="button" class="btn secondary" data-act="close-modal">Abbrechen</button>
        <button type="button" id="hut-save-btn" class="btn">${existing?'Speichern':'Hütte anlegen'}</button>
      </div>
      <button type="button" id="hut-fab-save-btn" class="fab-save">✓ Speichern</button>
      ${existing ? `
      <div id="delete-hut-zone" style="margin-top:22px; padding-top:16px; border-top:1px solid var(--line); text-align:right;">
        <button type="button" id="delete-hut-trigger" data-id="${h.id}" style="background:none; border:none; color:var(--ink-faint); font-size:12.5px; text-decoration:underline; cursor:pointer;">Hütte löschen</button>

          <button type="button" id="delete-hut-no" style="background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; margin-left:6px;">Abbrechen</button>
        </div>
      </div>` : ''}
    </form>
  </div>`;
}

  if(!h) return `<div class="modal" data-stop="1"><p>Hütte nicht gefunden.</p></div>`;
  const linked = state.tours.filter(t=>t.hutId===h.id);
  return `<div class="modal" data-stop="1">
    <div class="modal-head">
      <div><h2>🛖 ${esc(h.name)}</h2>${h.region ? `<p style="color:var(--ink-soft); font-size:14px; margin:4px 0 0 0;">${esc(h.region)}</p>` : ''}</div>

/* ================= Abgeschlossen view ================= */
function buildPersonGroups(){
  const groups = {};
  state.tours.forEach(t=>{
    (t.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].tours.find(x=>x.id===t.id)) groups[name].tours.push(t);
    });
  });
  state.huts.forEach(h=>{
    (h.completions||[]).forEach(c=>{
      const name = (c.by||'').trim() || '?';
      if(!groups[name]) groups[name] = {tours:[], huts:[]};
      if(!groups[name].huts.find(x=>x.id===h.id)) groups[name].huts.push(h);
    });
  });
  return groups;
}

function abgeschlossenViewHtml(){
  const groups = buildPersonGroups();
  const names = Object.keys(groups);
  if(!names.length){
    return `<div class="empty">
      <h3>Noch nichts als erledigt markiert</h3>
      <p>Öffne eine Tour oder Hütte und tippe auf "Als erledigt markieren", um Name und Datum einzutragen.</p>
    </div>`;
  }
  names.sort((a,b)=>{
    if(state.myName){
      if(a===state.myName) return -1;
      if(b===state.myName) return 1;
    }
    return a.localeCompare(b, 'de');
  });
  return names.map(name=>{
    const g = groups[name];
    const isMe = state.myName && name===state.myName;
    const total = g.tours.length + g.huts.length;
    return `<div class="detail-section" style="margin-bottom:28px;">
      <h4>${isMe ? '⭐ Meine Liste' : esc(name)} (${total})</h4>
      ${g.tours.length ? `<div class="grid" style="margin-top:6px;">${g.tours.map(tourCardHtml).join('')}</div>` : ''}
      ${g.huts.length ? `<div class="grid" style="margin-top:${g.tours.length?12:6}px;">${g.huts.map(hutCardHtml).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function openMarkDone(kind, id){
  state.modal = {type:'add-completion', payload:{kind, id}};
  render();
}

async function submitCompletion(kind, id, name, date){
  const n = (name||'').trim();
  if(!n){
    const box = document.getElementById('completion-error');
    if(box){ box.style.display='block'; box.textContent = 'Bitte einen Namen eingeben.'; }
    return;
  }
  const entry = {by:n, date: date || new Date().toISOString().slice(0,10), addedAt: new Date().toISOString()};
  if(kind==='tour'){
    const t = state.tours.find(x=>x.id===id);
    if(!t) return;
    t.completions = t.completions || [];
    t.completions.push(entry);
    closeModal();
    state.modal = {type:'tour-detail', payload:id};
    render();
    const ok = await saveTourCloud(t).catch(()=>false);
    t._unsynced = !ok;
    if(!ok){ markUnsaved(); showToast('Eintrag lokal gespeichert, aber nicht synchronisiert.', true); }
    else{ showToast('Als erledigt eingetragen.'); }
    render();
  }else{
    const h = state.huts.find(x=>x.id===id);
    if(!h) return;
    h.completions = h.completions || [];
    h.completions.push(entry);
    closeModal();
    state.modal = {type:'hut-detail', payload:id};
    render();
    const ok = await saveHutCloud(h).catch(()=>false);
    h._unsynced = !ok;
    if(!ok){ markUnsaved(); showToast('Eintrag lokal gespeichert, aber nicht synchronisiert.', true); }
    else{ showToast('Als erledigt eingetragen.'); }
    render();
  }
}

    else if(act==='filter-hut-diff') el.onclick = ()=>toggleHutDiffFilter(el.getAttribute('data-code'));
